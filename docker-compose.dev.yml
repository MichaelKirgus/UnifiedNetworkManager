  # MCP server for AI agents: exposes the API's OpenAPI operations as MCP tools
  # over Streamable HTTP. Two endpoints:
  #   POST :3901/mcp        — production-safe (OpenAPI tools only; scope the
  #                           UNM_API_TOKEN to control what an agent can do)
  #   POST :3901/debug/mcp  — extended debug: + read-only SQL against Postgres
  #                           and live plugin probes. Requires Authorization:
  #                           Bearer <MCP_DEBUG_KEY>.
  # Create the UNM_API_TOKEN in the webapp (Tokens page) or via POST /v1/tokens.
  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    # No host port by default — the MCP server carries an API token with full
    # agent capabilities, so exposing it on all interfaces is a deliberate choice.
    # Opt in for remote access (behind auth / reverse proxy) via .env:
    #   UNM_MCP_PORT=8081  →  add a ports entry mapping ${UNM_MCP_PORT} to container port 3901
    environment:
      - MCP_PORT=3901
      # Base URL the OpenAPI tools call (container-to-container).
      - UNM_API_BASE=http://api:3000/v1
      # mTLS (Stage 2): enroll this server against the CA (identity "mcp") and
      # talk to the API's mTLS listener on :8443 + mTLS-live plugins. Off by
      # default — set UNM_TLS=1 in .env together with the fleet. Plain HTTP
      # fallback keeps working while enrollment is pending or if it fails.
      - UNM_TLS=${UNM_TLS:-}
      - UNM_API_TLS_BASE=https://api:8443/v1
      # Long-lived API token for the OpenAPI tools — REQUIRED.
      - UNM_API_TOKEN=${UNM_API_TOKEN:-}
      # Bearer key gating /debug/mcp (read-only SQL + plugin probes).
      - MCP_DEBUG_KEY=${MCP_DEBUG_KEY:-dev-mcp-debug-key}
      # Optional: also gate the plain /mcp endpoint with a bearer key.
      - MCP_KEY=${MCP_KEY:-}
      # Same database as the API — used by the debug SQL tool AND by the
      # plugin_probe debug tool (it reads every endpoint from the plugins
      # table, so there is no static endpoint list to maintain here).
      - DATABASE_URL=postgresql://unm:unm@postgres:5432/unm
      # Optional macvlan default gateway (scripts/docker-entrypoint.sh) — empty = no-op.
      - UNM_DEFAULT_GATEWAY=${UNM_DEFAULT_GATEWAY:-}
      # Privilege drop (scripts/docker-entrypoint.sh): the app runs as uid/gid 1001
      # by default. UNM_RUN_AS_ROOT=1 skips the drop, UNM_SKIP_CHOWN=1 skips the
      # data-dir chown below, UNM_DOCKER_GID/UID join a host group / set the uid.
      - UNM_RUN_AS_ROOT=${UNM_RUN_AS_ROOT:-}
      - UNM_SKIP_CHOWN=${UNM_SKIP_CHOWN:-}
      - UNM_DOCKER_GID=${UNM_DOCKER_GID:-}
      - UNM_DOCKER_UID=${UNM_DOCKER_UID:-}
      # Runtime chown of pre-existing root-owned data volumes (first boot after
      # the unprivileged switch; no-op once owned by uid 1001). /data/ca is
      # deliberately EXCLUDED — it's mounted read-only here.
      - UNM_CHOWN_PATHS=/data/tls
    volumes:
      # mTLS (Stage 2): the CA config volume READ-ONLY — MCP only reads
      # root_ca.crt from it to build its trust bundle. The PKI volume is never
      # mounted here (no CA signing keys), and ca.json/state are irrelevant.
      - ${UNM_CA_CONFIG_VOLUME:-unm-ca-cfg}:/data/ca:ro
      # mTLS (Stage 2): the MCP's OWN ACME account + leaf keys persist here so a
      # container rebuild does not re-enroll (the old leaf stays valid until its
      # renewal window). Only UNM-owned material — no CA signing keys.
      - ${UNM_MCP_TLS_VOLUME:-unm-mcp-tls}:/data/tls
    # Plain-HTTP self-check on :3901 (the MCP listener never goes TLS —
    # mTLS enrollment only affects its OUTBOUND calls to the API/plugins).
    healthcheck:
      test: ["CMD-SHELL", 'node -e ''require("http").get({host:"127.0.0.1",port:3901,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - api
    restart: unless-stopped

  # Mock OPNsense appliance for end-to-end plan-execution tests (the script now
  # lives in the plugin-test-kit fixtures). Host network
  # so it can bind :80/:443 directly; reachable from the plugin containers as
  # http(s)://host.docker.internal (bare hostname — device managementAddress
  # never carries a scheme/port). Captured requests are served at GET /__requests.
  # TEST-ONLY: hidden behind the "test" profile so plain `docker compose up`
  # (and `make up`) can never start it in a productive environment.
  # Start on demand: `docker compose --profile test up -d mock-appliance`.
  mock-appliance:
    profiles: ["test"]
    image: node:20-alpine
    network_mode: host
    entrypoint: ["node", "/mock/mock.js"]
    volumes:
      - ./packages/plugin-test-kit/src/fixtures/opnsenseAppliance.cjs:/mock/mock.js:ro
      # Self-signed TLS material generated on the host (openssl req -x509);
      # node:20-alpine has no openssl and apk access is unreliable here.
      - ./packages/plugin-test-kit/src/fixtures/tls:/mock/tls:ro
    # Test-only fixture (profile "test", host network): plain-HTTP check of
    # the captured-request endpoint on :80.
    healthcheck:
      test: ["CMD-SHELL", 'node -e ''require("http").get({host:"127.0.0.1",port:80,path:"/__requests"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: "no"
  # Identity provider plugin: local users + TOTP (2FA). Performs credential
  # verification on behalf of the API. It does NOT own a database: the API
  # owns the `users` table and this plugin reads/writes user records through
  # the API's internal user-data endpoints (UNM_API_URL + x-plugin-api-key).
  basic-auth-plugin:
    # Root context — the image also builds the shared @unm/plugin-sdk package.
    build:
      context: .
      dockerfile: plugins/basic-auth/Dockerfile
    ports:
      - "4002:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://basic-auth-plugin:4080
      # Optional macvlan default gateway (scripts/docker-entrypoint.sh) — empty = no-op.
      - UNM_DEFAULT_GATEWAY=${UNM_DEFAULT_GATEWAY:-}
      # Privilege drop (scripts/docker-entrypoint.sh): the app runs as uid/gid 1001
      # by default. UNM_RUN_AS_ROOT=1 skips the drop, UNM_SKIP_CHOWN=1 skips the
      # data-dir chown, UNM_DOCKER_GID/UID join a host group / set the uid.
      - UNM_RUN_AS_ROOT=${UNM_RUN_AS_ROOT:-}
      - UNM_SKIP_CHOWN=${UNM_SKIP_CHOWN:-}
      - UNM_DOCKER_GID=${UNM_DOCKER_GID:-}
      - UNM_DOCKER_UID=${UNM_DOCKER_UID:-}
      # Base URL of the API's internal user-data endpoints (plugin -> API).
      - UNM_API_URL=http://api:3000/v1
      # mTLS (Stage 1): enroll against the CA and serve TLS on :4080.
      # Off by default — set UNM_TLS=1 in .env to enable fleet-wide.
      - UNM_TLS=${UNM_TLS:-}
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      # WebAuthn RP identity — MUST match the api service's values so assertion
      # verification accepts the options generated by the API.
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:8080}
    # Liveness check against the SDK's dedicated plain-HTTP health listener on
    # :4081 (HEALTH_PORT) — a minimal second server that never goes behind mTLS,
    # so no client cert is needed. A dead process fails this; a broken TLS swap
    # or failed enrollment does NOT (the main API plane stays up independently).
    healthcheck:
      test: ["CMD-SHELL", 'node -e ''require("http").get({host:"127.0.0.1",port:4081,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - api
    restart: unless-stopped

  # Secrets provider plugin: encrypts/decrypts and manages device secrets.
  # It is the crypto holder (owns MASTER_KEY) and the management logic. It does
  # NOT own a database: the API owns the `secrets` table and this plugin
  # stores/reads ciphertext through the API's internal endpoints
  # (UNM_API_URL + x-plugin-api-key).
  secrets-provider-plugin:
    # Root context — the image also builds the shared @unm/plugin-sdk package.
    build:
      context: .
      dockerfile: plugins/secrets-provider/Dockerfile
    ports:
      - "4003:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://secrets-provider-plugin:4080
      # Optional macvlan default gateway (scripts/docker-entrypoint.sh) — empty = no-op.
      - UNM_DEFAULT_GATEWAY=${UNM_DEFAULT_GATEWAY:-}
      # Privilege drop (scripts/docker-entrypoint.sh): the app runs as uid/gid 1001
      # by default. UNM_RUN_AS_ROOT=1 skips the drop, UNM_SKIP_CHOWN=1 skips the
      # data-dir chown, UNM_DOCKER_GID/UID join a host group / set the uid.
      - UNM_RUN_AS_ROOT=${UNM_RUN_AS_ROOT:-}
      - UNM_SKIP_CHOWN=${UNM_SKIP_CHOWN:-}
      - UNM_DOCKER_GID=${UNM_DOCKER_GID:-}
      - UNM_DOCKER_UID=${UNM_DOCKER_UID:-}
      # Base URL of the API's internal secrets-data endpoints (plugin -> API).
      - UNM_API_URL=http://api:3000/v1
      # mTLS (Stage 1): enroll against the CA and serve TLS on :4080.
      # Off by default — set UNM_TLS=1 in .env to enable fleet-wide.
      - UNM_TLS=${UNM_TLS:-}
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      # Crypto key material (the plugin is the crypto holder).
      - MASTER_KEY=${MASTER_KEY:-default-master-key-must-be-changed-in-production}
      - CRYPTO_SALT=${CRYPTO_SALT:-salt}
    # Liveness check against the SDK's dedicated plain-HTTP health listener on
    # :4081 (HEALTH_PORT) — a minimal second server that never goes behind mTLS,
    # so no client cert is needed. A dead process fails this; a broken TLS swap
    # or failed enrollment does NOT (the main API plane stays up independently).
    healthcheck:
      test: ["CMD-SHELL", 'node -e ''require("http").get({host:"127.0.0.1",port:4081,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - api
    restart: unless-stopped

  webapp:
    build:
      context: ./webapp
      # VITE_API_URL is compiled into the static bundle at build time (Vite
      # inlines import.meta.env.VITE_* at build, not at container runtime),
      # so it must be passed as a build arg here rather than as a plain
      # `environment:` entry below, which the already-built assets would
      # never see. The value is the URL the *browser* (not the container)
      # uses to reach the API, i.e. the host's published api port.
      args:
        VITE_API_URL: http://localhost:3000/v1
    ports:
      - ${UNM_WEB_PORT:-8080}:5173
    environment:
      # Optional macvlan default gateway (scripts/docker-entrypoint.sh) — empty = no-op.
      - UNM_DEFAULT_GATEWAY=${UNM_DEFAULT_GATEWAY:-}
      # Privilege drop (scripts/docker-entrypoint.sh): the app runs as uid/gid 1001
      # by default. UNM_RUN_AS_ROOT=1 skips the drop, UNM_SKIP_CHOWN=1 skips the
      # data-dir chown, UNM_DOCKER_GID/UID join a host group / set the uid.
      - UNM_RUN_AS_ROOT=${UNM_RUN_AS_ROOT:-}
      - UNM_SKIP_CHOWN=${UNM_SKIP_CHOWN:-}
      - UNM_DOCKER_GID=${UNM_DOCKER_GID:-}
      - UNM_DOCKER_UID=${UNM_DOCKER_UID:-}
    # Static-serve self-check on :5173 (the baked build-tag manifest is a
    # stable same-origin URL that exists in every image).
    healthcheck:
      test: ["CMD-SHELL", 'node -e ''require("http").get({host:"127.0.0.1",port:5173,path:"/manifest.json"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - api
    restart: unless-stopped

  # Optional: uncomment to back the job queue with real Redis/BullMQ instead
  # of the in-process fallback queue used by default in api/src/queue.ts.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

volumes:
  pgdata:
  # CA PKI material (root/intermediate certs + intermediate key) — mounted on
  # the unm-ca service ONLY. Override with UNM_CA_PKI_VOLUME=<host-path> in .env
  # to back it up / migrate; losing this volume = re-keying the whole fleet.
  unm-ca-pki:
  # CA config + state (ca.json rendered by the API, step-ca's Badger DB) —
  # mTLS (Stage 1): the API's own ACME account key + enrolled leaf, persisted
  # across container rebuilds. Contains ONLY UNM-owned material — CA signing
  # keys never leave the CA-only volume above.
  unm-api-tls:
  # mounted on BOTH unm-ca and api. Override with UNM_CA_CONFIG_VOLUME if needed.
  unm-ca-cfg:
  # mTLS (Stage 2): the MCP server's own ACME account key + enrolled leaf,
  # persisted across container rebuilds. Same content rules as unm-api-tls —
  # only UNM-owned material, no CA signing keys.
  unm-mcp-tls:
  # Stored UNM backups (Backups page) — local-destination archives. Mounted on
  # the api service ONLY; override with UNM_BACKUP_VOLUME in .env.
  unm-backups:
  # Legacy api-local file-repo volume (fallback + pre-plugin rows). Mounted on
  # the api service ONLY — plugins access files through the API, never directly.
  filerepo:
  # Active file-repo byte store — mounted on the file-repo-plugin service only.
  # Override with FILE_REPO_PLUGIN_VOLUME=<other-volume-or-host-path> in .env.
  filerepo-plugin:
