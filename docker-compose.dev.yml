  # Web-fetch plugin (capability `webFetch`): GLOBAL service — no device
  # assignment, no credentials. Downloads files/web content from the internet
  # on behalf of UNM (POST /fetch), plain or through an egress proxy with
  # CONNECT tunneling for HTTPS targets. This is what lets the API container
  # live in a network segment WITHOUT internet access while this plugin sits
  # behind one that has it — deploy it wherever egress exists and point
  # WEBFETCH_PROXY_URL at your corporate proxy if plain TLS is not allowed.
  # The GeoIP worker (api/src/workers/geoip.ts) uses it to pull database files
  # into the central file repository; host port 4022 = HTTP control plane.
  web-fetch-plugin:
    build:
      context: .
      dockerfile: plugins/web-fetch/Dockerfile
    ports:
      - "4022:4080"
    # Lets the plugin reach host-network services (e.g. a mock download server
    # on :9199 during e2e) as http://host.docker.internal — plain Linux Docker
    # has no such name by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://web-fetch-plugin:4080
