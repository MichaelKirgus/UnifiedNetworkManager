  # Generic HTTP(S) plugin: vendor-agnostic web-service health check for ANY host
  # that serves HTTP(S). Checks the configured endpoints (default port 80 and/or
  # 443, adjustable in settings), reports response time + status code as live
  # metrics, and probes the TLS endpoint's certificate into the cross-device
  # Certificates page. No credentials needed — plain TCP/TLS connects.
  generic-http-plugin:
    # Root context — the image also builds the shared @unm/plugin-sdk package.
    build:
      context: .
      dockerfile: plugins/generic-http/Dockerfile
    ports:
      - "4016:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://generic-http-plugin:4080
      # Optional macvlan default gateway (scripts/docker-entrypoint.sh) — empty = no-op.
      - UNM_DEFAULT_GATEWAY=${UNM_DEFAULT_GATEWAY:-}
      # Privilege drop (scripts/docker-entrypoint.sh): the app runs as uid/gid 1001
      # by default. UNM_RUN_AS_ROOT=1 skips the drop, UNM_SKIP_CHOWN=1 skips the
      # data-dir chown, UNM_DOCKER_GID/UID join a host group / set the uid.
