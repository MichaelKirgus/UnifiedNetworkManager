version: "3.9"

# ── Optional: dedicated management VLAN via macvlan ───────────────────────────
# Put every service on its own static IP in an external macvlan network and give
# each container a default route through the VLAN gateway. The images' entrypoint
# wrapper (scripts/docker-entrypoint.sh) installs that route when UNM_DEFAULT_GATEWAY
# is set — it is already wired into EVERY service's environment below, empty = no-op.
#
# 1. Create the network once on the host (parent = your management NIC):
#      docker network create -d macvlan \
#        --subnet 192.168.50.0/24 --gateway 192.168.50.1 \
#        -o parent=enp3s0 -o mode=bridge unm-vlan
#    (mode=bridge keeps host↔container reachability; plain macvlan blocks it.)
# 2. Set in .env:   UNM_DEFAULT_GATEWAY=192.168.50.1
# 3. Uncomment the top-level networks block below AND add a per-service block, e.g.
#    for api (repeat for every service with a distinct IP):
#      api:
#        networks:
#          default:            # keep → NAT stays as fallback for internet egress
#          unm-vlan:
#            ipv4_address: 192.168.50.10
#    Drop the `default:` entry to go macvlan-only (ALL egress via your gateway).
#
# networks:
#   unm-vlan:
#     external: true
#
# ── Unprivileged containers (default) ───────────────────────────────────────
# Every UNM image runs its app as uid/gid 1001 (`app`) after boot. The entrypoint
# wrapper (scripts/docker-entrypoint.sh) chowns pre-existing root-owned data
# volumes (UNM_CHOWN_PATHS, set per service below), joins a host docker group
# when UNM_DOCKER_GID is set, then drops privileges before starting the app.
# Opt-outs (set in .env, apply to every service):
#   UNM_RUN_AS_ROOT=1     run as root — no privilege drop (rollback switch)
#   UNM_SKIP_CHOWN=1      skip the runtime data-dir chown (pre-chowned stores)
#   UNM_DOCKER_GID=<gid>  join this host group (e.g. `id -g docker`) so a
#                         mounted /var/run/docker.sock is accessible
#   UNM_DOCKER_UID=<uid>  run the app under this uid instead of 1001

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unm}
      POSTGRES_DB: ${POSTGRES_DB:-unm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Accepting-connections check (no auth) with the initdb user/database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unm} -d ${POSTGRES_DB:-unm}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Certificate Authority (step-ca, Apache 2.0 — see ca/Dockerfile). Issues the
  # mTLS leaf certificates for every plugin + the API via RFC 8555 ACME.
  # Two volumes with deliberately different exposure:
  #   unm-ca-pki  CA-ONLY: root/intermediate certs + intermediate key. Mounted
  #               here ONLY — no other service (incl. the API) ever sees keys.
  #   unm-ca-cfg  shared with the api: ca.json (rendered by the API from global
  #               settings; SIGHUP-reloaded on change) + step-ca's state DB.
  # The CA listens on :9000 inside the compose network only — NOT published to
  # the host. ACME directory: https://unm-ca:9000/acme/acme/directory.
  unm-ca:
    build:
      context: .
      dockerfile: ca/Dockerfile
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${UNM_CA_PKI_VOLUME:-unm-ca-pki}:/pki
      - ${UNM_CA_CONFIG_VOLUME:-unm-ca-cfg}:/data/ca
    depends_on:
      - postgres
    restart: unless-stopped
    # step-ca's `ca health` needs BOTH flags or it errors out and the container
    # shows "(unhealthy)" even though enrollment works fine: --ca-url (the CA has
    # no IP SANs, so address it by DNS name) AND --root pointing at a root PEM.
    # The entrypoint mirrors /pki/root_ca.crt → /data/ca/ on every boot, so the
    # public root is always present on the shared cfg volume for this check.
    healthcheck:
      test: ["CMD-SHELL", "step ca health --ca-url https://unm-ca:9000 --root /data/ca/root_ca.crt | grep '^ok' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=dev-secret
      - DATABASE_URL=postgresql://unm:unm@postgres:5432/unm
      # Identity provider selection (the API is a pure auth broker).
      # AUTH_PLUGIN_ID names the active identity provider plugin; if unset or
      # offline the API falls back to the built-in basic-auth plugin.
      - AUTH_PLUGIN_ID=${AUTH_PLUGIN_ID:-00000000-0000-4000-8000-000000000001}
      # Shared key the API presents to plugins (x-plugin-api-key).
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      # WebAuthn (passkey) relying-party identity. Production MUST set these to
      # your real domain + https origin(s), e.g.
      #   WEBAUTHN_RP_ID=unm.example.com  WEBAUTHN_ORIGIN=https://unm.example.com
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:8080}
      # CORS allowlist for the API (comma-separated origins). The webapp origin
      # from WEBAUTHN_ORIGIN is always included, and http(s)://localhost /
      # 127.0.0.1 on ANY port are always allowed so the dev webapp works without
      # a fully-qualified domain name. Production: set your real origin(s), e.g.
      #   UNM_CORS_ORIGINS=https://unm.example.com
      - UNM_CORS_ORIGINS=${UNM_CORS_ORIGINS:-}
      # How many days of plugin log entries are kept before the retention sweep deletes them.
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      # Central file repository metadata lives in Postgres; the BYTES live in a
      # file-repo plugin (capability `fileRepo`). FILE_REPO_PLUGIN_ID names the
      # default provider for new uploads; if unset or offline the API falls back
      # to its own local volume (legacy rows with no providerId always read from it).
      - FILE_REPO_PLUGIN_ID=${FILE_REPO_PLUGIN_ID:-00000000-0000-4000-8000-000000000011}
      # Legacy api-local file-repo volume (fallback + pre-plugin rows). Only the
      # api container mounts it — plugins reach files through the API's
      # /plugin/files/* routes and never see any filesystem.
      - FILE_REPO_PATH=${FILE_REPO_PATH:-/data/file-repo}
      # Local destination for stored UNM backups (the Backups page; archives are
      # gzip-compressed JSON documents, <id>.unmbak.gz). Override with a host
      # path or another volume via UNM_BACKUP_VOLUME in .env.
      - BACKUP_PATH=${BACKUP_PATH:-/data/backups}
      # Secrets provider selection (the API is a pure secrets broker).
      # SECRETS_PLUGIN_ID names the active secrets provider plugin; if unset or
      # offline the API falls back to the built-in secrets-provider plugin.
      - SECRETS_PLUGIN_ID=${SECRETS_PLUGIN_ID:-00000000-0000-4000-8000-000000000002}
      # Plugin discovery is PUSH-BASED: every plugin self-registers with the
      # API (POST /plugin/register) on boot using UNM_API_URL + PLUGIN_API_KEY,
      # and the discovery worker polls whatever endpoints are in the plugins
      # table. There is deliberately NO catalog of plugin endpoints here — a
      # third-party plugin needs zero changes to this file to appear in UNM.
      # Optional legacy fallback for topologies where a plugin cannot reach the
      # API at all (comma-separated list, e.g. http://my-plugin:4080):
      - PLUGIN_POLL_ENDPOINTS=${PLUGIN_POLL_ENDPOINTS:-}
      # mTLS (Stage 1): enroll the API itself against the CA (identity "api") and
      # open a TLS listener on :8443. Off by default — set UNM_TLS=1 in .env to
      # enable it together with the plugins' enrollment.
      - UNM_TLS=${UNM_TLS:-}
      # mTLS (Stage 2): broker POST /ca/renew for subject 'mcp' through the MCP
      # server's own /tls/renew endpoint (gated by its debug key).
      - MCP_DEBUG_KEY=${MCP_DEBUG_KEY:-dev-mcp-debug-key}
      - UNM_MCP_URL=http://mcp:3901
      # Optional macvlan default gateway (scripts/docker-entrypoint.sh) — empty = no-op.
      - UNM_DEFAULT_GATEWAY=${UNM_DEFAULT_GATEWAY:-}
      # Privilege drop (scripts/docker-entrypoint.sh): the app runs as uid/gid 1001
      # by default. UNM_RUN_AS_ROOT=1 skips the drop, UNM_SKIP_CHOWN=1 skips the
      # data-dir chown below, UNM_DOCKER_GID/UID join a host group / set the uid.
      - UNM_RUN_AS_ROOT=${UNM_RUN_AS_ROOT:-}
      - UNM_SKIP_CHOWN=${UNM_SKIP_CHOWN:-}
      - UNM_DOCKER_GID=${UNM_DOCKER_GID:-}
      - UNM_DOCKER_UID=${UNM_DOCKER_UID:-}
      # Runtime chown of pre-existing root-owned data volumes (first boot after
      # the unprivileged switch; no-op once owned by uid 1001). /data/ca is
      # deliberately EXCLUDED — it's shared with unm-ca and group-writable there.
      - UNM_CHOWN_PATHS=/data/backups /data/file-repo /data/tls
    volumes:
      # Stored UNM backups (Backups page) — local-destination archives live here.
      # Named volume by default; set UNM_BACKUP_VOLUME to a host path or another
      # named volume in .env to persist/backup them off-stack.
      - ${UNM_BACKUP_VOLUME:-unm-backups}:/data/backups
      # Legacy api-local file-repo volume (fallback + pre-plugin rows). The
      # active byte store is the file-repo plugin's own volume below.
      - filerepo:/data/file-repo
      # CA config volume (shared with unm-ca): the API renders ca.json here from
      # global settings and persists its own admin JWK key. The PKI volume is
      # deliberately NOT mounted — the API never sees CA signing keys.
      - ${UNM_CA_CONFIG_VOLUME:-unm-ca-cfg}:/data/ca
      # mTLS (Stage 1): the API's OWN ACME account + leaf keys persist here so a
      # container rebuild does not re-enroll (the old leaf stays valid until its
      # renewal window). Only UNM-owned material — no CA signing keys.
      - ${UNM_API_TLS_VOLUME:-unm-api-tls}:/data/tls
    # Plain-HTTP self-check on :3000 (the mTLS listener on :8443 is an
    # additional endpoint and does not gate this check).
    healthcheck:
      test: ["CMD-SHELL", 'node -e ''require("http").get({host:"127.0.0.1",port:3000,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - postgres
      - unm-ca
    restart: unless-stopped

  # File-repository storage backend (capability `fileRepo`). STATELESS with
  # respect to UNM metadata — it stores only raw bytes, content-addressed by
  # SHA-256, on its own volume. The API owns all repo_files/repo_file_uses rows
  # in Postgres and brokers every read/write here (see api/src/fileRepoBroker.ts).
  # Mount FILE_REPO_PLUGIN_PATH at a host path or named volume to persist bytes;
  # run multiple instances (PLUGIN_INSTANCE_ID) for repos in different segments.
  file-repo-plugin:
    build:
      context: .
      dockerfile: plugins/file-repo/Dockerfile
    ports:
      - "4020:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://file-repo-plugin:4080
      # Optional macvlan default gateway (scripts/docker-entrypoint.sh) — empty = no-op.
      - UNM_DEFAULT_GATEWAY=${UNM_DEFAULT_GATEWAY:-}
      # Privilege drop (scripts/docker-entrypoint.sh): the app runs as uid/gid 1001
      # by default. UNM_RUN_AS_ROOT=1 skips the drop, UNM_SKIP_CHOWN=1 skips the
      # data-dir chown below, UNM_DOCKER_GID/UID join a host group / set the uid.
      - UNM_RUN_AS_ROOT=${UNM_RUN_AS_ROOT:-}
      - UNM_SKIP_CHOWN=${UNM_SKIP_CHOWN:-}
      - UNM_DOCKER_GID=${UNM_DOCKER_GID:-}
      - UNM_DOCKER_UID=${UNM_DOCKER_UID:-}
      # Runtime chown of pre-existing root-owned data volumes (first boot after
      # the unprivileged switch; no-op once owned by uid 1001).
      - UNM_CHOWN_PATHS=/data/file-repo /data/tls
      # Base URL of the API's internal endpoints (plugin -> API) — log shipping.
      - UNM_API_URL=http://api:3000/v1
      # mTLS (Stage 1): enroll against the CA and serve TLS on :4080.
      # Off by default — set UNM_TLS=1 in .env to enable fleet-wide.
      - UNM_TLS=${UNM_TLS:-}
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      # On-disk store root inside this container (the ONLY mount that holds bytes).
      - FILE_REPO_PATH=/data/file-repo
    volumes:
      # The byte store. Named volume by default; set to a host path (e.g.
      # /opt/unm/file-repo) or another named volume per instance if preferred.
      - ${FILE_REPO_PLUGIN_VOLUME:-filerepo-plugin}:/data/file-repo
    # Liveness check against the SDK's dedicated plain-HTTP health listener on
    # :4081 (HEALTH_PORT) — a minimal second server that never goes behind mTLS,
    # so no client cert is needed. A dead process fails this; a broken TLS swap
    # or failed enrollment does NOT (the main API plane stays up independently).
    healthcheck:
      test: ["CMD-SHELL", 'node -e ''require("http").get({host:"127.0.0.1",port:4081,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - api
    restart: unless-stopped

  opnsense-plugin:
    # Root context — the image also builds the shared @unm/plugin-sdk package.
    build:
      context: .
      dockerfile: plugins/opnsense/Dockerfile
    ports:
      - "4001:4080"
    # Lets the plugin reach host-network services (e.g. mock-appliance on :80/:443)
    # as http(s)://host.docker.internal — plain Linux Docker has no such name by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Conventional internal port for ALL plugins; the host mapping above is
      # only for curl-from-host debugging + setup.sh wait_for_port.
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      # Without this the plugin advertises http://localhost:4080, which is
      # unreachable from the API container.
      - ADVERTISED_ENDPOINT=http://opnsense-plugin:4080
      # Optional macvlan default gateway (scripts/docker-entrypoint.sh) — empty = no-op.
      - UNM_DEFAULT_GATEWAY=${UNM_DEFAULT_GATEWAY:-}
      # Privilege drop (scripts/docker-entrypoint.sh): the app runs as uid/gid 1001
      # by default. UNM_RUN_AS_ROOT=1 skips the drop, UNM_SKIP_CHOWN=1 skips the
      # data-dir chown, UNM_DOCKER_GID/UID join a host group / set the uid.
      - UNM_RUN_AS_ROOT=${UNM_RUN_AS_ROOT:-}
      - UNM_SKIP_CHOWN=${UNM_SKIP_CHOWN:-}
      - UNM_DOCKER_GID=${UNM_DOCKER_GID:-}
      - UNM_DOCKER_UID=${UNM_DOCKER_UID:-}
      # Base URL of the API's internal endpoints (plugin -> API) — used for log shipping.
      - UNM_API_URL=http://api:3000/v1
      # mTLS (Stage 1): enroll against the CA and serve TLS on :4080.
      # Off by default — set UNM_TLS=1 in .env to enable fleet-wide.
      - UNM_TLS=${UNM_TLS:-}
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      - OPNSENSE_HOST=${OPNSENSE_HOST:-https://opnsense.local}
      - OPNSENSE_KEY=${OPNSENSE_KEY:-}
      - OPNSENSE_SECRET=${OPNSENSE_SECRET:-}
    # Liveness check against the SDK's dedicated plain-HTTP health listener on
    # :4081 (HEALTH_PORT) — a minimal second server that never goes behind mTLS,
    # so no client cert is needed. A dead process fails this; a broken TLS swap
    # or failed enrollment does NOT (the main API plane stays up independently).
    healthcheck:
      test: ["CMD-SHELL", 'node -e ''require("http").get({host:"127.0.0.1",port:4081,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - api
    restart: unless-stopped

  # ICMP plugin: reachability / latency metrics plus IP+MAC inventory,
  # measured from inside its own container via system ping (ICMP echo). No
  # credentials needed — it probes whatever host the device's settings point at.
  icmp-plugin:
    # Root context — the image also builds the shared @unm/plugin-sdk package.
    build:
      context: .
      dockerfile: plugins/icmp/Dockerfile
    ports:
      - "4004:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://icmp-plugin:4080
      # Optional macvlan default gateway (scripts/docker-entrypoint.sh) — empty = no-op.
      - UNM_DEFAULT_GATEWAY=${UNM_DEFAULT_GATEWAY:-}
      # Privilege drop (scripts/docker-entrypoint.sh): the app runs as uid/gid 1001
      # by default. UNM_RUN_AS_ROOT=1 skips the drop, UNM_SKIP_CHOWN=1 skips the
      # data-dir chown, UNM_DOCKER_GID/UID join a host group / set the uid.
      - UNM_RUN_AS_ROOT=${UNM_RUN_AS_ROOT:-}
      - UNM_SKIP_CHOWN=${UNM_SKIP_CHOWN:-}
      - UNM_DOCKER_GID=${UNM_DOCKER_GID:-}
      - UNM_DOCKER_UID=${UNM_DOCKER_UID:-}
      # Base URL of the API's internal endpoints (plugin -> API) — used for log shipping.
      - UNM_API_URL=http://api:3000/v1
      # mTLS (Stage 1): enroll against the CA and serve TLS on :4080.
      # Off by default — set UNM_TLS=1 in .env to enable fleet-wide.
      - UNM_TLS=${UNM_TLS:-}
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
    # Liveness check against the SDK's dedicated plain-HTTP health listener on
    # :4081 (HEALTH_PORT) — a minimal second server that never goes behind mTLS,
    # so no client cert is needed. A dead process fails this; a broken TLS swap
    # or failed enrollment does NOT (the main API plane stays up independently).
    healthcheck:
      test: ["CMD-SHELL", 'node -e ''require("http").get({host:"127.0.0.1",port:4081,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - api
    restart: unless-stopped

  # ── Multi-instance example ────────────────────────────────────────────────
  # Every plugin supports running multiple instances of the same type (e.g. one
  # ICMP plugin per remote site). Each instance needs a unique
  # PLUGIN_INSTANCE_ID and its own ADVERTISED_ENDPOINT; it then registers as a
  # separate plugin ("ICMP Plugin (site-a)") that can be assigned independently.
  # PLUGIN_DISPLAY_NAME optionally overrides the auto-generated name.
  # No api-side registration needed — each instance self-registers on boot.
  # icmp-site-a:
  #   build:
  #     context: .
  #     dockerfile: plugins/icmp/Dockerfile
  #   ports:
  #     - "4010:4080"   # next free HOST port — the container port is always 4080
  #   environment:
  #     - PORT=4080
  #     - ADVERTISED_ENDPOINT=http://icmp-site-a:4080
  #     - PLUGIN_INSTANCE_ID=site-a
  #     # - PLUGIN_DISPLAY_NAME=HQ ICMP
  #   restart: unless-stopped

  # Generic SNMP plugin: SNMPv1/v2c monitoring (system group + interface
  # throughput) and inventory over native UDP (@unm/snmp-client). Credentials
  # come from an snmp-type secret assigned per device (community + version).
  # Vendor MIB files can be dropped into ./plugins/generic-snmp/mibs — mounted
  # read-only at /app/mibs for manual debugging only.
  generic-snmp-plugin:
    # Root context — the image also builds the shared @unm/snmp-client package.
    build:
      context: .
      dockerfile: plugins/generic-snmp/Dockerfile
    ports:
      - "4005:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://generic-snmp-plugin:4080
      # Optional macvlan default gateway (scripts/docker-entrypoint.sh) — empty = no-op.
      - UNM_DEFAULT_GATEWAY=${UNM_DEFAULT_GATEWAY:-}
      # Privilege drop (scripts/docker-entrypoint.sh): the app runs as uid/gid 1001
      # by default. UNM_RUN_AS_ROOT=1 skips the drop, UNM_SKIP_CHOWN=1 skips the
      # data-dir chown, UNM_DOCKER_GID/UID join a host group / set the uid.
      - UNM_RUN_AS_ROOT=${UNM_RUN_AS_ROOT:-}
      - UNM_SKIP_CHOWN=${UNM_SKIP_CHOWN:-}
      - UNM_DOCKER_GID=${UNM_DOCKER_GID:-}
      - UNM_DOCKER_UID=${UNM_DOCKER_UID:-}
      # Base URL of the API's internal endpoints (plugin -> API) — used for log shipping.
      - UNM_API_URL=http://api:3000/v1
      # mTLS (Stage 1): enroll against the CA and serve TLS on :4080.
      # Off by default — set UNM_TLS=1 in .env to enable fleet-wide.
      - UNM_TLS=${UNM_TLS:-}
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
    volumes:
      - ./plugins/generic-snmp/mibs:/app/mibs:ro
    # Liveness check against the SDK's dedicated plain-HTTP health listener on
    # :4081 (HEALTH_PORT) — a minimal second server that never goes behind mTLS,
    # so no client cert is needed. A dead process fails this; a broken TLS swap
    # or failed enrollment does NOT (the main API plane stays up independently).
    healthcheck:
      test: ["CMD-SHELL", 'node -e ''require("http").get({host:"127.0.0.1",port:4081,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})''']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - api
    restart: unless-stopped

  # LANCOM LX plugin: vendor-specific monitoring for LCOS-LX access points via
  # the LCOS-LX-MIB (radios, SSIDs, stations/clients, RF environment, WDS,
  # CAPWAP/LMC) plus network + WLAN-client inventory propagation. Intended to
  # be assigned IN ADDITION TO the generic SNMP plugin on the same devices.
  lancom-lx-plugin:
    # Root context — the image also builds the shared @unm/snmp-client package.
    build:
      context: .
      dockerfile: plugins/lancom-lx/Dockerfile
    ports:
      - "4006:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://lancom-lx-plugin:4080
      # Optional macvlan default gateway (scripts/docker-entrypoint.sh) — empty = no-op.
      - UNM_DEFAULT_GATEWAY=${UNM_DEFAULT_GATEWAY:-}
      # Privilege drop (scripts/docker-entrypoint.sh): the app runs as uid/gid 1001
      # by default. UNM_RUN_AS_ROOT=1 skips the drop, UNM_SKIP_CHOWN=1 skips the
      # data-dir chown, UNM_DOCKER_GID/UID join a host group / set the uid.
      - UNM_RUN_AS_ROOT=${UNM_RUN_AS_ROOT:-}
      - UNM_SKIP_CHOWN=${UNM_SKIP_CHOWN:-}
      - UNM_DOCKER_GID=${UNM_DOCKER_GID:-}
      - UNM_DOCKER_UID=${UNM_DOCKER_UID:-}
      # Base URL of the API's internal endpoints (plugin -> API) — used for log shipping.
      - UNM_API_URL=http://api:3000/v1
      # mTLS (Stage 1): enroll against the CA and serve TLS on :4080.
      # Off by default — set UNM_TLS=1 in .env to enable fleet-wide.
      - UNM_TLS=${UNM_TLS:-}
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
    volumes:
      - ./plugins/lancom-lx/mibs:/app/mibs:ro
    # Liveness check against the SDK's dedicated plain-HTTP health listener on
    # :4081 (HEALTH_PORT) — a minimal second server that never goes behind mTLS,
    # so no client cert is needed. A dead process fails this; a broken TLS swap
