# CodeQL code-scanning configuration for UnifiedNetworkManager.
#
# Used by `.github/workflows/codeql.yml` (advanced setup) via the `config-file:`
# input of github/codeql-action/init. GitHub's built-in dynamic scanner does NOT
# read this file — only the custom workflow applies it.
#
# SCHEMA NOTE (learned the hard way): the codescanning config file supports ONLY
# global path exclusions (`paths-ignore`) plus metadata-based query filters
# (`query-filters` with exclude/include by id/tags/severity). There is NO
# per-rule paths-ignore — an unknown top-level key (e.g. `query-config:`)
# triggers "WARNING: Invalid property specified in the configuration file" and
# is silently dropped, so keep keys to the documented set: name,
# disable-default-queries, queries, packs, paths, paths-ignore, query-filters,
# threat-models. Defaults still run when no `queries:`/`disable-default-queries`
# is given — that is what we want (coverage unchanged).
#
# Every path below is an ACCEPTED-RISK decision for this codebase (not a claim
# the rules are wrong); each justification says which rule classes it silences
# and why. Keep them in sync if the underlying design changes (e.g. if pinning
# is ever removed, drop api/src/consoleProxy.ts).

name: unm-codeql-config

paths-ignore:
  # Local-only dev/probe tooling (scripts/probe-*, e2e-*, setup-*). Not shipped,
  # not reachable by untrusted input; its "sensitive logging" / "cert disable"
  # findings are noise.
  - 'scripts/'

  # Device-facing plugin layer: the entire purpose of these plugins is to reach
  # operator-configured appliance endpoints — self-signed certs (pinning
  # preflight handles identity), vendor-mandated crypto (SwOS MD5 .b-files,
  # IPMI RMCP+ HMAC-SHA1/AES-CBC-128), internal HTTP routes behind the shared
  # plugin-key gate. SSRF / cert-validation / weak-crypto / rate-limiting /
  # ReDoS-on-device-output findings here are by-design product behavior.
  - 'plugins/'

  # SDK primitives that execute UNM's own action catalog against managed
  # devices: operator-defined commands (configs:apply + 2FA-gated), the
  # credential-free TLS pinning preflight, bounded probe timeouts. Same
  # accepted-risk class as plugins/.
  - 'packages/plugin-sdk/src/'

  # In-process test mocks bound to 127.0.0.1 — never network-exposed (the
  # stack-trace exposure is only visible to the local test runner).
  - 'packages/plugin-test-kit/'

  # Internal MCP server on the trusted compose network behind API auth; the
  # flagged regex was audited linear-time (js/polynomial-redos).
  - 'mcp/src/httpServer.ts'

  # Automation trigger patterns are OPERATOR-authored (authenticated, validated
  # with `new RegExp(...)` at write time — routes/automations.ts rejects invalid
  # ones with 400) and matched against device telemetry; the pattern author IS
  # the trusted principal. Silences js/regex-injection + js/tainted-format-string.
  - 'api/src/automations/'
  - 'api/src/routes/automations.ts'
  - 'api/src/workers/automations.ts'

  # Icon/asset proxy to DB-registered plugin endpoints — the target host is
  # trusted by construction (js/request-forgery).
  - 'api/src/routes/plugins.ts'

  # Internal mTLS WS proxy for plugins: rejectUnauthorized:false is required so
  # Node runs its identity hooks, and self-signed appliance certs fail chain
  # validation first anyway (js/disabling-certificate-validation).
  - 'api/src/consoleProxy.ts'

  # Flagged regex audited linear-time on LAN-device output
  # (js/polynomial-redos).
  - 'api/src/replication.ts'
