# Dependabot — dependency + action updates as PRs (never auto-merged).
#
# The repo has NO npm workspaces: every package.json is installed independently
# (see the CI install loops), so each directory needs its own entry. Adding a new
# workspace means adding one more `npm` block here.
version: 2
updates:
  # GitHub Actions — daily, because action SHAs are pinned in the workflows and
  # security fixes to actions should land quickly. Dependabot updates the SHA
  # (and keeps the tag comment consistent with the new release).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily

  # npm — weekly, one PR per directory; minor/patch updates are grouped so a
  # directory gets at most one routine PR plus separate majors.
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dependencies:
        # no dependency-type → groups production AND development deps together
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/api"
