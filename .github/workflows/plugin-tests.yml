# Standardized per-plugin contract suite — see packages/plugin-test-kit/README.md.
#
# Every built plugin is spawned as a standalone process against in-process mock
# appliances and checked for fatal flaws (healthz, /discover validation,
# monitoring happy-path + dead-target handling). No Docker needed: plain Node.
name: Plugin tests

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token scope — CI only reads the checkout, never writes.
permissions:
  contents: read

jobs:
  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to immutable commit SHAs (tag in comment) so a
      # compromised or moved upstream tag can never change what CI executes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # Root deps (js-yaml for the spec validator) — cheap, and lets us fail on
      # a broken OpenAPI spec BEFORE spending time on installs/builds/tests.
      - name: Install root dependencies
        run: |
          set -e
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if npm ci --no-audit --no-fund; then break; fi
            echo "::warning::npm ci failed (attempt $attempt/3) — retrying in 5s." >&2
            sleep 5
            attempt=$((attempt + 1))
          done
          [ "$attempt" -le 3 ] || { echo "::error::npm ci failed after 3 attempts." >&2; exit 1; }

      # The API is driven by openapi/unified-network-manager.openapi.yaml — a
      # malformed or structurally-broken spec must never reach the build.
      - name: Validate OpenAPI spec
        run: node validate-openapi.cjs

      # Install every workspace's dependencies (mirrors `make setup`).
      # npm install — NOT npm ci: these workspaces depend on sibling packages via
      # file: links, and the committed lockfiles store those as versioned entries.
      # Local npm 9 accepts that shape; CI runners ship npm 10 (with Node 20), which
      # rejects it — `npm ci` fails with EUSAGE "Missing: @unm/… from lock file" in
      # every such workspace. npm install uses the committed package-lock.json as its
      # starting point and works on both, so installs stay reproducible.
      # The root workspace has no file: deps — it keeps strict `npm ci` above.
      #
      # Every job's exit code is collected explicitly: a bare `wait` returns 0 if ANY
      # backgrounded job succeeded, which would let a broken install silently reach
      # the build step (and surface as confusing downstream errors instead).
      - name: Install dependencies
        run: |
          set -e
          # Each workspace install is retried up to 3 times with a short backoff.
          # Under ~29 concurrent installs on one runner, esbuild's postinstall can
          # transiently hit ETXTBSY ("text file busy") when it execs the binary it
          # just extracted — a filesystem race that almost always clears on retry.
          # A genuinely broken install still fails (after 3 attempts) and is caught
          # by the per-PID wait below, so this only absorbs transient flakes.
          install_with_retry() {
            dir="$1"
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if (cd "$dir" && npm install --legacy-peer-deps --no-audit --no-fund); then
                return 0
              fi
              echo "::warning::install $dir failed (attempt $attempt/3) — retrying in 5s." >&2
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "::error::install $dir failed after 3 attempts." >&2
            return 1
          }
          pids=()
          for d in packages/plugin-sdk packages/snmp-client packages/lancom-shared packages/plugin-test-kit api webapp mcp; do
            (install_with_retry "$d") &
            pids+=($!)
          done
          for p in plugins/*/package.json; do
            dir=$(dirname "$p")
            [ "$(basename "$dir")" = "_template" ] && continue
            (install_with_retry "$dir") &
            pids+=($!)
          done
          fail=0
          for pid in "${pids[@]}"; do wait "$pid" || fail=1; done
          [ "$fail" = "0" ] || { echo "::error::One or more workspace installs failed — see output above." >&2; exit 1; }

      # Build shared packages + all plugins (the suite tests dist/ output).
      - name: Build
        run: make build

      # Run the contract suite for every plugin.
      - name: Plugin contract suite
        run: node packages/plugin-test-kit/bin/run-all.mjs
