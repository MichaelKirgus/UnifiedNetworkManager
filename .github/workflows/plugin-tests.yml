# Standardized per-plugin contract suite — see packages/plugin-test-kit/README.md.
#
# Every built plugin is spawned as a standalone process against in-process mock
# appliances and checked for fatal flaws (healthz, /discover validation,
# monitoring happy-path + dead-target handling). No Docker needed: plain Node.
name: Plugin tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to immutable commit SHAs (tag in comment) so a
      # compromised or moved upstream tag can never change what CI executes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # Root deps (js-yaml for the spec validator) — cheap, and lets us fail on
      # a broken OpenAPI spec BEFORE spending time on installs/builds/tests.
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      # The API is driven by openapi/unified-network-manager.openapi.yaml — a
      # malformed or structurally-broken spec must never reach the build.
      - name: Validate OpenAPI spec
        run: node validate-openapi.cjs

      # Install every workspace's dependencies (mirrors `make setup`).
      # npm ci — NOT npm install: installs exactly the committed lockfile and
      # FAILS if package.json and its lockfile disagree, so dependency drift
      # can never sneak into CI builds.
      - name: Install dependencies
        run: |
          set -e
          for d in packages/plugin-sdk packages/snmp-client packages/lancom-shared packages/plugin-test-kit api webapp mcp; do
            (cd "$d" && npm ci --legacy-peer-deps --no-audit --no-fund) &
          done
          for p in plugins/*/package.json; do
            dir=$(dirname "$p")
            [ "$(basename "$dir")" = "_template" ] && continue
            (cd "$dir" && npm ci --legacy-peer-deps --no-audit --no-fund) &
          done
          wait

      # Build shared packages + all plugins (the suite tests dist/ output).
      - name: Build
        run: make build

      # Run the contract suite for every plugin.
      - name: Plugin contract suite
        run: node packages/plugin-test-kit/bin/run-all.mjs
