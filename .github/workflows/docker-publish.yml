# Build + publish all component images to GitHub Container Registry (GHCR).
#
# Tag scheme:
#   - push to a branch  → image tag = branch name ("main" maps to "dev")
#   - push to a v* tag  → image tag = the release version (e.g. v0.1.0) AND
#                         "latest" is moved to that release (never to dev).
#
# Images are only built/published AFTER the plugin contract suite passes.
# The component list is derived from docker-compose.yml at runtime, so adding a
# new service with a `build:` block needs no change here.

name: Docker publish

on:
  push:
    branches: ['*']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ── Lightweight metadata job: component matrix + tag scheme. ───────────────
  meta:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.components.outputs.components }}
      tags: ${{ steps.tags.outputs.tags }}
      # Single primary tag (no ",latest") — baked into every image as the
      # UNM_BUILD_TAG env so the webapp can show which branch/release it runs.
      tag: ${{ steps.tags.outputs.tag }}
      # Lowercased ghcr.io/<owner>/<repo> prefix for the image names. Computed
      # in bash (tr) instead of an expression filter pipe — GitHub's workflow
      # validator rejects `|` inside expressions with "Unexpected symbol: '|'",
      # which would invalidate the ENTIRE file and silently disable publishing.
      imagePrefix: ${{ steps.tags.outputs.imagePrefix }}
    steps:
      # Actions are pinned to immutable commit SHAs (tag in comment) so a
      # compromised or moved upstream tag can never change what CI executes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Derive the buildable components from docker-compose.yml itself — every
      # service with a `build:` block becomes one image named after its service.
      # Both paths are emitted relative to the WORKSPACE ROOT: compose resolves
      # `context` to an absolute path in its JSON output, and buildx (via
      # docker/build-push-action) resolves a relative `--file` against the caller
      # CWD — which is the workspace root here — NOT against the context. That is
      # why webapp (no explicit `dockerfile:` key → default "Dockerfile") failed
      # with "open Dockerfile: no such file or directory": its Dockerfile lives at
      # webapp/Dockerfile, not at the repo root. Every plugin already carried an
      # explicit root-relative dockerfile, so only webapp was affected.
      - name: Components
        id: components
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const path = require("node:path");
            const cfg = JSON.parse(execSync("docker compose config --format json", { encoding: "utf8" }));
            const out = Object.entries(cfg.services ?? {})
              .filter(([, s]) => s.build)
              .map(([name, s]) => {
                const ctx = path.relative(process.cwd(), (s.build.context || ".")) || ".";
                // Compose `dockerfile` is relative to the CONTEXT dir; buildx needs
                // it relative to CWD → join with the context.
                return { service: name, context: ctx, dockerfile: path.join(ctx, s.build.dockerfile || "Dockerfile") };
              });
            if (!out.length) throw new Error("no buildable services found in docker-compose.yml");
            require("fs").writeFileSync(process.env.GITHUB_OUTPUT, `components<<EOF\n${JSON.stringify(out)}\nEOF`);
          '

      # Tag scheme: v* release tag → version + latest; main → dev; else branch name.
      - name: Resolve image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"          # e.g. v0.1.0
            EXTRA=",latest"                        # releases — and only releases — own "latest"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="dev"                              # default branch maps to dev
            EXTRA=""
          else
            TAG="$(echo "$GITHUB_REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
            EXTRA=""
          fi
          echo "tags=${TAG}${EXTRA}" >> "$GITHUB_OUTPUT"
          # Single primary tag for the UNM_BUILD_TAG build arg (releases bake
          # their version, branches bake their name — never "latest").
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # GHCR package names must be lowercase; GITHUB_REPOSITORY is always set.
          echo "imagePrefix=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  # ── Gate: the plugin contract suite must pass before any image is built. ───
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # Root deps (js-yaml for the spec validator) — cheap, and lets us fail on
      # a broken OpenAPI spec BEFORE spending time on installs/builds/tests.
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      # The API is driven by openapi/unified-network-manager.openapi.yaml — a
      # malformed or structurally-broken spec must never reach the build.
      - name: Validate OpenAPI spec
        run: node validate-openapi.cjs

      # Install every workspace's dependencies (mirrors `make setup`).
      # npm install — NOT npm ci: these workspaces depend on sibling packages via
      # file: links, and the committed lockfiles store those as versioned entries.
      # Local npm 9 accepts that shape; CI runners ship npm 10 (with Node 20), which
      # rejects it — `npm ci` fails with EUSAGE "Missing: @unm/… from lock file" in
      # every such workspace. npm install uses the committed package-lock.json as its
      # starting point and works on both, so installs stay reproducible.
      # The root workspace has no file: deps — it keeps strict `npm ci` above.
      #
      # Every job's exit code is collected explicitly: a bare `wait` returns 0 if ANY
      # backgrounded job succeeded, which would let a broken install silently reach
      # the build step (and surface as confusing downstream errors instead).
      - name: Install dependencies
        run: |
          set -e
          pids=()
          for d in packages/plugin-sdk packages/snmp-client packages/lancom-shared packages/plugin-test-kit api webapp mcp; do
            (cd "$d" && npm install --legacy-peer-deps --no-audit --no-fund) &
            pids+=($!)
          done
          for p in plugins/*/package.json; do
            dir=$(dirname "$p")
            [ "$(basename "$dir")" = "_template" ] && continue
            (cd "$dir" && npm install --legacy-peer-deps --no-audit --no-fund) &
            pids+=($!)
          done
          fail=0
          for pid in "${pids[@]}"; do wait "$pid" || fail=1; done
          [ "$fail" = "0" ] || { echo "::error::One or more workspace installs failed — see output above." >&2; exit 1; }

      # Build shared packages + all plugins (the suite tests dist/ output).
      - name: Build
        run: make build

      # Run the contract suite for every plugin.
      - name: Plugin contract suite
        run: node packages/plugin-test-kit/bin/run-all.mjs

  # ── Build + push every compose component to GHCR (one job per component). ───
  publish:
    needs: [meta, tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.meta.outputs.components) }}

    steps:
      # Fail fast BEFORE any expensive build: the credential must exist AND be
      # accepted by GHCR for this repository. We validate against the registry —
      # the same token exchange docker login performs — rather than api.github.com:
      # this workflow's job token is scoped to `contents` + `packages` only, so a
      # call like GET /user answers 403 even for a perfectly good publishing
      # credential (the scope restriction, not the token, causes it).
      - name: Preflight — GITHUB_TOKEN present + accepted by GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is empty — cannot publish to GHCR."
            exit 1
          fi
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          code=$(curl -sS -o /tmp/ghcr-token.json -w '%{http_code}' \
            -u "${GITHUB_ACTOR}:${TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull")
          if [ "$code" != "200" ] || ! grep -q '"token"' /tmp/ghcr-token.json; then
            echo "::error::GITHUB_TOKEN rejected by GHCR (HTTP $code) — cannot publish."
            exit 1
          fi
          rm -f /tmp/ghcr-token.json
          echo "GITHUB_TOKEN is present and accepted by GHCR for ${repo}."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GHCR image names must be lowercase — the repo is lowercased explicitly.
      # This login also performs the real registry auth handshake, so a token
      # that is valid for the API but lacks `packages: write` (see top-level
      # permissions) fails HERE — before any layer is built or pushed.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ needs.meta.outputs.imagePrefix }}/${{ matrix.service }}:${{ needs.meta.outputs.tags }}
          # Baked into every image (ARG UNM_BUILD_TAG in each Dockerfile) so the
          # webapp sidebar + Plugins page can show which branch/release runs.
          build-args: |
            UNM_BUILD_TAG=${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
