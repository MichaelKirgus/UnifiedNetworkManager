openapi: 3.1.0
info:
  title: UnifiedNetworkManager API
  version: 0.1.0
  contact:
    name: UnifiedNetworkManager Maintainers
    url: https://github.com/MichaelKirgus/UnifiedNetworkManager
  description: >-
    Open, vendor-neutral API for monitoring and configuring mixed network
    environments (OPNsense, OpenWrt, MikroTik) through a plugin model.
servers:
  - url: https://api.unified-network-manager.local/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Devices
  - name: Monitoring
  - name: Configuration
  - name: Plugins
paths:
  /auth/flow:
    get:
      tags: [Authentication]
      summary: Report the active identity provider's authentication flow
      description: >
        Returns the `flow` of the active identity provider (e.g. `password`,
        `oauth2`, `ldap`, `saml`). The webapp uses this to adapt its login UI
        before the user enters any credentials.
      security: []
      responses:
        '200':
          description: Auth flow
          content:
            application/json:
              schema:
                type: object
                required: [flow]
                properties:
                  flow:
                    type: string
                    enum: [password, oauth2, ldap, saml]
        '503':
          description: No identity provider available

  /auth/redirect:
    get:
      tags: [Authentication]
      summary: Get the URL to start an external authentication flow
      description: >
        Returns the URL the webapp should redirect the user to in order to
        start an external authentication flow (OAuth2 / SAML / LDAP web login).
        The provider declares this in its discovery response. Responds 501
        when the active provider does not support redirect-based login (e.g.
        the basic-auth password provider).
      security: []
      responses:
        '200':
          description: Redirect URL
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string, format: uri }
        '501':
          description: Provider does not support redirect-based login
        '503':
          description: No identity provider available

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user and issue pre-2FA token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Credentials accepted
          content:
            application/json:
              schema:
                type: object
                required: [challengeToken, twoFactorRequired]
                properties:
                  challengeToken: { type: string }
                  twoFactorRequired: { type: boolean }
        '401':
          description: Invalid username or password
        '429':
          description: Too many login attempts

  /auth/2fa/verify:
    post:
      tags: [Authentication]
      summary: Complete login using TOTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, totpCode]
              properties:
                challengeToken: { type: string }
                totpCode: { type: string, minLength: 6, maxLength: 6, pattern: "^\\d{6}$" }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, roles, permissions]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer }
                  roles:
                    type: array
                    items: { type: string }
                  permissions:
                    type: array
                    items: { type: string }
        '401':
          description: Invalid or expired 2FA challenge/token

  /devices:
    get:
      tags: [Devices]
      summary: List managed devices
      parameters:
        - in: query
          name: vendor
          schema: { type: string }
        - in: query
          name: site
          schema: { type: string }
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          description: Authentication required
    post:
      tags: [Devices]
      summary: Register device
      description: Requires permission `devices:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Referenced plugin not found
        '422':
          description: Plugin assignment payload is invalid

  /devices/{deviceId}:
    patch:
      tags: [Devices]
      summary: Update a device (rename, change management address, ...)
      description: >-
        Updates the identity fields of an existing device. Only the provided
        fields are changed; plugin assignments and their settings are managed
        via the /devices/{deviceId}/plugins endpoints. `site` may be set to
        null to clear it.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1 }
                vendor: { type: string, minLength: 1 }
                deviceType: { type: string, minLength: 1 }
                managementAddress: { type: string, minLength: 1 }
                # null clears the site (OpenAPI 3.1 / JSON Schema type array).
                site: { type: [string, 'null'] }
      responses:
        '200':
          description: Updated device (with its plugin assignments)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: No updatable fields provided or a field is invalid
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Device not found

  /devices/{deviceId}/plugins:
    get:
      tags: [Devices]
      summary: List a device's plugin assignments
      description: >-
        Returns every plugin assigned to the device, each with its own
        credential source and primary flag. A device can be served by several
        plugins at once (e.g. OPNsense API + SNMP + SSH).
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, plugins]
                properties:
                  deviceId: { type: string }
                  plugins:
                    type: array
                    items:
                      $ref: '#/components/schemas/DevicePluginAssignment'
        '401':
          description: Authentication required
        '404':
          description: Device not found
    post:
      tags: [Devices]
      summary: Assign a plugin to a device
      description: >-
        Adds another plugin assignment. The first assignment on a device
        becomes primary automatically; passing `isPrimary: true` demotes the
        current primary (exactly one primary per device). Each assignment may
        carry its own credential source (`secretId`).
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePluginAssignmentInput'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePluginAssignment'
        '400':
          description: Missing pluginId
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Device, plugin or credentials not found
        '409':
          description: Plugin is already assigned to this device

  /devices/{deviceId}/plugins/{pluginId}:
    delete:
      tags: [Devices]
      summary: Remove a plugin assignment from a device
      description: >-
        Removes the (device, plugin) binding. If it was the primary and other
        assignments remain, the oldest remaining one is promoted to keep
        exactly one primary.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: path
          name: pluginId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Assignment removed
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Device not found or plugin is not assigned to it

  /devices/{deviceId}/plugins/{pluginId}/options:
    get:
      tags: [Devices]
      summary: Get a device's settings for one of its plugins
      description: >-
        Same option descriptors as the global view, but `values` holds THIS
        device's overrides and `effectiveValues` resolves in the order
        device override → global override → descriptor default.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: path
          name: pluginId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Option descriptors + device-scoped settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '401':
          description: Authentication required
        '404':
          description: Device not found or plugin is not assigned to it

  /devices/{deviceId}/plugins/{pluginId}/settings:
    put:
      tags: [Devices]
      summary: Save a device's settings overrides for one of its plugins
      description: >-
        Persists per-device override values (validated against the plugin's
        descriptors, all-or-nothing). Unchanged options keep inheriting the
        global setting or descriptor default.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: path
          name: pluginId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties: true
                  description: "Map of option key -> value (string | integer | boolean)"
      responses:
        '200':
          description: Saved; returns the updated device-scoped options view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '400':
          description: One or more values failed validation
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  fieldErrors:
                    type: object
                    additionalProperties: { type: string }
        '401':
          description: Authentication required
        '403':
          description: Missing plugins:manage permission
        '404':
          description: Device not found or plugin is not assigned to it
    delete:
      tags: [Devices]
      summary: Reset a device's settings overrides for one of its plugins
      description: >-
        Deletes this device's override rows only — every option falls back to
        the global setting (or descriptor default) instead of being wiped.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: path
          name: pluginId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reset; returns the options view (device values now empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '401':
          description: Authentication required
        '403':
          description: Missing plugins:manage permission
        '404':
          description: Device not found or plugin is not assigned to it

  /devices/{deviceId}/monitoring:
    get:
      tags: [Monitoring]
      summary: Get normalized device telemetry
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current telemetry snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySnapshot'
        '401':
          description: Authentication required
        '404':
          description: Device not found

  /devices/{deviceId}/config-jobs:
    post:
      tags: [Configuration]
      summary: Queue asynchronous configuration action
      description: Requires 2FA-completed session and permission `configs:apply`.
      x-2fa-required: true
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigJobRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigJob'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Device not found

  /config-jobs/{jobId}:
    get:
      tags: [Configuration]
      summary: Get configuration job status
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigJob'
        '401':
          description: Authentication required
        '404':
          description: Job not found

  /plugins:
    get:
      tags: [Plugins]
      summary: List discovered plugins
      description: >-
        Plugins are discovered automatically via mDNS/DNS-SD advertising and an
        HTTP polling fallback, so no manual registration is required.
      responses:
        '200':
          description: Plugin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plugin'
        '401':
          description: Authentication required

  /secrets:
    get:
      tags: [Secrets]
      summary: List stored secrets
      description: Returns a list of stored secrets (metadata only, including type and providerId).
      responses:
        '200':
          description: Secret list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
    post:
      tags: [Secrets]
      summary: Create a new secret
      description: >-
        Creates a typed secret via the specified (or default) secrets provider.
        The provider encrypts the fields and stores the ciphertext. The secret
        type and provider id are recorded so decryption is always routed back
        to the correct provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, fields]
              properties:
                type: { type: string, description: "Secret type (e.g. apiKey, usernamePassword, snmp)" }
                providerId: { type: string, nullable: true, description: "Provider plugin UUID (defaults to SECRETS_PLUGIN_ID)" }
                fields:
                  type: object
                  additionalProperties: { type: string }
                  description: "Decrypted field values as declared by the provider's secret type schema"
                label: { type: string, nullable: true }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          description: Invalid request (missing type or fields)
        '401':
          description: Authentication required
        '403':
          description: Missing required permission

  /secrets/providers:
    get:
      tags: [Secrets]
      summary: List registered secrets providers
      description: >-
        Returns all registered secrets provider plugins along with the secret
        types each serves (field schemas). Use this to render dynamic secret
        creation forms.
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretProvider'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission

  /plugins/{id}/required-secret-type:
    get:
      tags: [Plugins]
      summary: Get the secret type a device plugin requires
      description: >-
        Reads the `requiredSecretType` from the plugin's /discover endpoint.
        Use this to filter which secrets are applicable to devices managed by
        this plugin.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Required secret type
          content:
            application/json:
              schema:
                type: object
                properties:
                  requiredSecretType:
                    type: string
                    nullable: true
        '401':
          description: Authentication required

  /plugins/{id}/metrics:
    get:
      tags: [Plugins]
      summary: Get the metric descriptors a plugin serves
      description: >-
        Returns the metric descriptors the plugin declared in its /discover
        endpoint. The webapp renders device metrics generically from these
        (gauge/plot/text/table), so new plugins/metrics need no webapp changes.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Metric descriptors
          content:
            application/json:
              schema:
                type: object
                required: [pluginId, metrics]
                properties:
                  pluginId: { type: string }
                  metrics:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetricDescriptor'
        '401':
          description: Authentication required
        '404':
          description: Plugin not found

  /plugins/{id}/options:
    get:
      tags: [Plugins]
      summary: Get a plugin's option descriptors and current settings
      description: >-
        Returns the typed option descriptors the plugin declared in its
        /discover endpoint, plus the stored overrides (`values`) and the
        effective values (defaults merged with overrides) that the webapp
        should initialize its form to. Works even when the plugin is offline —
        everything is served from the API's cache of the discovery response.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Option descriptors + settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '401':
          description: Authentication required
        '404':
          description: Plugin not found

  /plugins/{id}/settings:
    put:
      tags: [Plugins]
      summary: Save a plugin's settings (validated against its descriptors)
      description: >-
        Persists user-set values for the named options. Every value is
        validated by the API against the plugin's descriptor (type, regex
        pattern, min/max). The request is all-or-nothing: if any value is
        invalid nothing is written and a 400 with per-field errors is returned.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties: true
                  description: "Map of option key -> value (string | integer | boolean)"
      responses:
        '200':
          description: Saved; returns the updated options view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '400':
          description: One or more values failed validation
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  fieldErrors:
                    type: object
                    additionalProperties: { type: string }
        '401':
          description: Authentication required
        '403':
          description: Missing plugins:manage permission
        '404':
          description: Plugin not found

    delete:
      tags: [Plugins]
      summary: Reset a plugin's settings to their defaults
      description: >-
        Deletes all stored overrides for the plugin so every option falls back
        to its declared default value.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reset; returns the options view (values now empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '401':
          description: Authentication required
        '403':
          description: Missing plugins:manage permission
        '404':
          description: Plugin not found

  /devices/{deviceId}/telemetry:
    get:
      tags: [Devices]
      summary: Get recent telemetry history for a device
      description: >-
        Returns the most recent telemetry samples (oldest → newest) for a
        device. Used to render 'plot' metrics over time.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 30, maximum: 200 }
      responses:
        '200':
          description: Telemetry history
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, history]
                properties:
                  deviceId: { type: string }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        collectedAt: { type: string, format: date-time }
                        health: { type: string }
                        pluginId: { type: string, description: "Which plugin produced this sample" }
                        metrics:
                          type: object
                          additionalProperties: true
        '401':
          description: Authentication required
        '404':
          description: Device not found

  /secrets/{id}:
    delete:
      tags: [Secrets]
      summary: Delete a secret
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Secret deleted
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Secret not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Authenticated JWT used for RBAC protected endpoints. Privileged operations
        marked with `x-2fa-required: true` additionally expect a token with a 2FA
        completion claim (for example `amr` includes `totp`).

  schemas:
    Secret:
      type: object
      required: [id, type, createdAt]
      properties:
        id: { type: string }
        type: { type: string, description: "Secret type (e.g. apiKey, usernamePassword, snmp)" }
        providerId: { type: string, nullable: true, description: "Provider plugin UUID that created this secret" }
        label: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        username: { type: string }

    SecretField:
      type: object
      required: [name, label, input]
      properties:
        name: { type: string }
        label: { type: string }
        input:
          type: string
          enum: [text, password, select]
        secret: { type: boolean, default: false }
        required: { type: boolean, default: false }
        options:
          type: array
          items: { type: string }

    SecretType:
      type: object
      required: [type, label, fields]
      properties:
        type: { type: string }
        label: { type: string }
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SecretField'

    SecretProvider:
      type: object
      required: [id, name, online, secretTypes]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        endpoint: { type: string, format: uri }
        online: { type: boolean }
        secretTypes:
          type: array
          items:
            $ref: '#/components/schemas/SecretType'

    # One row of the device ↔ plugin join table (a device can have several).
    DevicePluginAssignment:
      type: object
      required: [id, deviceId, pluginId, isPrimary]
      properties:
        id: { type: string }
        deviceId: { type: string }
        pluginId: { type: string }
        secretId: { type: string, description: "Credential source for this assignment (null = no credentials)" }
        isPrimary: { type: boolean, description: "Exactly one primary per device; default target for config jobs" }
        createdAt: { type: string, format: date-time }
        # Enriched fields returned by the list endpoints:
        pluginName: { type: string }
        pluginVersion: { type: string }
        pluginEndpoint: { type: string, format: uri }
        pluginOnline: { type: boolean }
        secretLabel: { type: string }

    DevicePluginAssignmentInput:
      type: object
      required: [pluginId]
      properties:
        pluginId: { type: string }
        secretId: { type: string, description: "Optional credential source for this assignment" }
        isPrimary: { type: boolean, default: false }

    Device:
      type: object
      required: [id, name, vendor, deviceType, managementAddress, status]
      properties:
        id: { type: string }
        name: { type: string }
        vendor: { type: string }
        deviceType: { type: string }
        managementAddress: { type: string }
        site: { type: string }
        status:
          type: string
          enum: [online, degraded, offline, unknown]
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/DevicePluginAssignment'
          description: "Assigned plugins (list endpoints include this)"
        summaryMetrics:
          type: array
          items:
            type: object
            additionalProperties: true
          description: "Headline metrics from the latest telemetry of each assignment"

    DeviceCreateRequest:
      type: object
      required: [name, vendor, deviceType, managementAddress, plugins]
      properties:
        name: { type: string }
        vendor: { type: string }
        deviceType: { type: string }
        managementAddress: { type: string }
        site: { type: string }
        # At least one plugin assignment; the first becomes primary.
        plugins:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DevicePluginAssignmentInput'

    # One plugin's monitoring snapshot for a device (a device can have several).
    PluginTelemetrySnapshot:
      type: object
      required: [pluginId, health, metrics]
      properties:
        pluginId: { type: string }
        collectedAt: { type: string, format: date-time, description: "null when the plugin has not reported yet" }
        health:
          type: string
          enum: [ok, warning, degraded, critical, unknown]
        metrics:
          type: object
          additionalProperties: true
        metricDescriptors:
          type: array
          items:
            $ref: '#/components/schemas/MetricDescriptor'

    TelemetrySnapshot:
      type: object
      required: [deviceId, health, snapshots]
      properties:
        deviceId: { type: string }
        # Overall device health = worst-wins across all plugin assignments.
        health:
          type: string
          enum: [ok, warning, degraded, critical, unknown]
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/PluginTelemetrySnapshot'

    ConfigJobRequest:
      type: object
      required: [pluginId, action, payload]
      properties:
        # Which assigned plugin applies the change (a device can have several).
        pluginId: { type: string }
        action:
          type: string
          enum: [applyConfig, rollbackConfig, syncState]
        payload:
          type: object
          additionalProperties: true

    ConfigJob:
      type: object
      required: [id, deviceId, action, status, createdAt]
      properties:
        id: { type: string }
        deviceId: { type: string }
        pluginId: { type: string, description: "The assignment that executes this job" }
        action:
          type: string
          enum: [applyConfig, rollbackConfig, syncState]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        result:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    MetricDescriptor:
      type: object
      required: [key, label, type, visualization]
      properties:
        key: { type: string, description: "Metric id; matches a key in the telemetry metrics map" }
        label: { type: string }
        unit: { type: string, description: "Unit of measure (%, MB, bps, s, ...) — the raw unit, kept for machine comparison" }
        format:
          type: string
          enum: [bytes, bits, duration, number, text]
          description: "How the webapp should humanize the value (bytes → 1.2 GB, bits → 850 Mbps, duration → 3d 4h, ...). The extensible rendering hint."
        type:
          type: string
          enum: [number, string, boolean, enum]
        visualization:
          type: string
          enum: [gauge, plot, text, table]
        group: { type: string, description: "Optional section grouping" }
        min: { type: number }
        max: { type: number }
        color: { type: string }
        rows:
          type: array
          items: { type: string }
          description: "For 'table': the row keys (e.g. interface names)"
        columns:
          type: array
          items: { type: string }
          description: "For 'table': the column keys (e.g. rx, tx)"
        summary:
          type: boolean
          description: "When true, this is a headline metric the webapp renders inline in the device overview table (not just the detail view)."
        intervalMs:
          type: integer
          description: "How often this metric group should be re-fetched from the appliance (ms). The plugin caches slow data (inventory) and only re-polls when the interval elapses — the extensible refresh-cadence contract."

    # A typed option a plugin declares in /discover. Discriminated union on
    # `type`; adding a new type = add one member + one webapp renderer branch.
    PluginOptionDescriptor:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string, description: "Short internal name; unique per plugin" }
        label: { type: string, description: "Human-readable display name" }
        type:
          type: string
          enum: [string, integer, boolean]
        # No `type` on purpose: the default is string | integer | boolean
        # depending on the option's own type (OpenAPI 3.0 "any" schema).
        default:
          description: "Default value used when the user has not set an override"
        description: { type: string, description: "Longer help text for the option" }
        docsUrl: { type: string, format: uri, description: "Optional URI with more information" }
        # string-type extras
        pattern: { type: string, description: "Regex the user input must match (type=string)" }
        minLength: { type: integer, description: "Minimum length (type=string)" }
        maxLength: { type: integer, description: "Maximum length (type=string)" }
        # integer-type extras
        min: { type: number, description: "Lower bound (type=integer)" }
        max: { type: number, description: "Upper bound (type=integer)" }

    PluginOptions:
      type: object
      required: [pluginId, options, values, effectiveValues]
      properties:
        pluginId: { type: string }
        options:
          type: array
          items:
            $ref: '#/components/schemas/PluginOptionDescriptor'
        values:
          type: object
          additionalProperties: true
          description: "Stored overrides only (empty when nothing was set)"
        effectiveValues:
          type: object
          additionalProperties: true
          description: "Defaults merged with stored overrides — what the form initializes to"

    Plugin:
      type: object
      required: [id, name, version, vendors, capabilities, endpoint]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        vendors:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items:
            type: string
            enum: [monitoring, configuration, inventory, identityProvider, secretsProvider]
        endpoint: { type: string, format: uri }
        authType:
          type: string
          enum: [none, token, mTLS]

    PluginCreateRequest:
      type: object
      required: [name, version, vendors, capabilities, endpoint]
      properties:
        name: { type: string }
        version: { type: string }
        vendors:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items:
            type: string
            enum: [monitoring, configuration, inventory, identityProvider, secretsProvider]
        endpoint: { type: string, format: uri }
        authType:
          type: string
          enum: [none, token, mTLS]
