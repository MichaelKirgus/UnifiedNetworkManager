openapi: 3.1.0
info:
  title: UnifiedNetworkManager API
  version: 0.1.0
  contact:
    name: UnifiedNetworkManager Maintainers
    url: https://github.com/MichaelKirgus/UnifiedNetworkManager
  description: >-
    Open, vendor-neutral API for monitoring and configuring mixed network
    environments (OPNsense, OpenWrt, MikroTik) through a plugin model.
servers:
  - url: https://api.unified-network-manager.local/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Devices
  - name: Monitoring
  - name: Configuration
  - name: Plugins
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user and issue pre-2FA token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Credentials accepted
          content:
            application/json:
              schema:
                type: object
                required: [challengeToken, twoFactorRequired]
                properties:
                  challengeToken: { type: string }
                  twoFactorRequired: { type: boolean }
        '401':
          description: Invalid username or password
        '429':
          description: Too many login attempts

  /auth/2fa/verify:
    post:
      tags: [Authentication]
      summary: Complete login using TOTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, totpCode]
              properties:
                challengeToken: { type: string }
                totpCode: { type: string, minLength: 6, maxLength: 6, pattern: "^\\d{6}$" }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn, roles, permissions]
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer }
                  roles:
                    type: array
                    items: { type: string }
                  permissions:
                    type: array
                    items: { type: string }
        '401':
          description: Invalid or expired 2FA challenge/token

  /devices:
    get:
      tags: [Devices]
      summary: List managed devices
      parameters:
        - in: query
          name: vendor
          schema: { type: string }
        - in: query
          name: site
          schema: { type: string }
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          description: Authentication required
    post:
      tags: [Devices]
      summary: Register device
      description: Requires permission `devices:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Referenced plugin not found
        '422':
          description: Referenced plugin ID is invalid

  /devices/{deviceId}/monitoring:
    get:
      tags: [Monitoring]
      summary: Get normalized device telemetry
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current telemetry snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySnapshot'
        '401':
          description: Authentication required
        '404':
          description: Device not found

  /devices/{deviceId}/config-jobs:
    post:
      tags: [Configuration]
      summary: Queue asynchronous configuration action
      description: Requires 2FA-completed session and permission `configs:apply`.
      x-2fa-required: true
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigJobRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigJob'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Device not found

  /config-jobs/{jobId}:
    get:
      tags: [Configuration]
      summary: Get configuration job status
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigJob'
        '401':
          description: Authentication required
        '404':
          description: Job not found

  /plugins:
    get:
      tags: [Plugins]
      summary: List discovered plugins
      description: >-
        Plugins are discovered automatically via mDNS/DNS-SD advertising and an
        HTTP polling fallback, so no manual registration is required.
      responses:
        '200':
          description: Plugin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plugin'
        '401':
          description: Authentication required

  /secrets:
    get:
      tags: [Secrets]
      summary: List stored secrets
      description: Returns a list of stored secrets (metadata only).
      responses:
        '200':
          description: Secret list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
    post:
      tags: [Secrets]
      summary: Create a new secret
      description: Encrypts and stores API credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey, apiSecret]
              properties:
                apiKey: { type: string }
                apiSecret: { type: string, format: password }
                label: { type: string, nullable: true }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission

  /secrets/{id}:
    delete:
      tags: [Secrets]
      summary: Delete a secret
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Secret deleted
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Secret not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Authenticated JWT used for RBAC protected endpoints. Privileged operations
        marked with `x-2fa-required: true` additionally expect a token with a 2FA
        completion claim (for example `amr` includes `totp`).

  schemas:
    Secret:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        username: { type: string }

    Device:
      type: object
      required: [id, name, vendor, deviceType, pluginId, managementAddress, status]
      properties:
        id: { type: string }
        name: { type: string }
        vendor: { type: string }
        deviceType: { type: string }
        pluginId: { type: string }
        managementAddress: { type: string }
        site: { type: string }
        status:
          type: string
          enum: [online, degraded, offline, unknown]

    DeviceCreateRequest:
      type: object
      required: [name, vendor, deviceType, pluginId, managementAddress, credentialsRef]
      properties:
        name: { type: string }
        vendor: { type: string }
        deviceType: { type: string }
        pluginId: { type: string }
        managementAddress: { type: string }
        credentialsRef: { type: string, description: "Reference to secret store key" }
        site: { type: string }

    TelemetrySnapshot:
      type: object
      required: [deviceId, collectedAt, health, metrics]
      properties:
        deviceId: { type: string }
        collectedAt: { type: string, format: date-time }
        health:
          type: string
          enum: [ok, warning, critical, unknown]
        metrics:
          type: object
          additionalProperties:
            type: number

    ConfigJobRequest:
      type: object
      required: [action, payload]
      properties:
        action:
          type: string
          enum: [applyConfig, rollbackConfig, syncState]
        payload:
          type: object
          additionalProperties: true

    ConfigJob:
      type: object
      required: [id, deviceId, action, status, createdAt]
      properties:
        id: { type: string }
        deviceId: { type: string }
        action:
          type: string
          enum: [applyConfig, rollbackConfig, syncState]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        result:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    Plugin:
      type: object
      required: [id, name, version, vendors, capabilities, endpoint]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        vendors:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items:
            type: string
            enum: [monitoring, configuration, inventory]
        endpoint: { type: string, format: uri }
        authType:
          type: string
          enum: [none, token, mTLS]

    PluginCreateRequest:
      type: object
      required: [name, version, vendors, capabilities, endpoint]
      properties:
        name: { type: string }
        version: { type: string }
        vendors:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items:
            type: string
            enum: [monitoring, configuration, inventory]
        endpoint: { type: string, format: uri }
        authType:
          type: string
          enum: [none, token, mTLS]
