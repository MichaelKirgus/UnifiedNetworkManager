openapi: 3.1.0
info:
  title: UnifiedNetworkManager API
  version: 0.1.0
  contact:
    name: UnifiedNetworkManager Maintainers
    url: https://github.com/MichaelKirgus/UnifiedNetworkManager
  description: >-
    Open, vendor-neutral API for monitoring and configuring mixed network
    environments (OPNsense, OpenWrt, MikroTik) through a plugin model.
servers:
  - url: https://api.unified-network-manager.local/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Devices
  - name: Monitoring
  - name: Configuration
  - name: Plugins
  - name: Secrets
  - name: Sites
  - name: Layers
  - name: Inventory
  - name: Updates
  - name: Logs
  - name: Notifications
  - name: Users
  - name: Tokens
  - name: System
paths:
  /auth/flow:
    get:
      tags: [Authentication]
      summary: Report the active identity provider's authentication flow
      description: >
        Returns the `flow` of the active identity provider (e.g. `password`,
        `oauth2`, `ldap`, `saml`). The webapp uses this to adapt its login UI
        before the user enters any credentials.
      security: []
      responses:
        '200':
          description: Auth flow
          content:
            application/json:
              schema:
                type: object
                required: [flow, supportsPasskey]
                properties:
                  flow:
                    type: string
                    enum: [password, oauth2, ldap, saml]
                  # True when the active provider supports passkey (WebAuthn) step-2.
                  supportsPasskey: { type: boolean }
        '503':
          description: No identity provider available

  /auth/redirect:
    get:
      tags: [Authentication]
      summary: Get the URL to start an external authentication flow
      description: >
        Returns the URL the webapp should redirect the user to in order to
        start an external authentication flow (OAuth2 / SAML / LDAP web login).
        The provider declares this in its discovery response. Responds 501
        when the active provider does not support redirect-based login (e.g.
        the basic-auth password provider).
      security: []
      responses:
        '200':
          description: Redirect URL
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string, format: uri }
        '501':
          description: Provider does not support redirect-based login
        '503':
          description: No identity provider available

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user and issue pre-2FA token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Credentials accepted
          content:
            application/json:
              schema:
                type: object
                required: [challengeToken, twoFactorRequired]
                properties:
                  challengeToken: { type: string }
                  twoFactorRequired: { type: boolean }
                  # True when the user's password has exceeded its max age — the
                  # client must force a change right after sign-in completes.
                  passwordExpired: { type: boolean }
        '401':
          description: Invalid username or password
        '403':
          description: >-
            No enrolled second factor satisfies the user's credential policy
            (error code `no_2fa_enrolled`) — enroll TOTP/passkey first. A
            disabled account is also rejected here (error code `user_disabled`),
            as is a service-only account without the `auth:interactive-login`
            permission (error code `no_interactive_login`).
        '429':
          description: Too many login attempts

  /auth/webauthn/assertion-options:
    get:
      tags: [Authentication]
      summary: Fetch WebAuthn assertion options for a pending login challenge
      description: >-
        Step 2a of passkey sign-in. The API generates the nonce + options (it
        owns the relying-party identity); the provider binds the nonce to its
        in-memory challenge entry. The webapp then calls
        navigator.credentials.get() with `options` and posts the result back to
        /auth/webauthn/verify together with `nonce`.
      security: []
      parameters:
        - in: query
          name: challengeToken
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Assertion options + nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebauthnAssertionOptionsResponse'
        '401':
          description: Invalid or expired challenge token
        '503':
          description: No identity provider available

  /auth/webauthn/verify:
    post:
      tags: [Authentication]
      summary: Complete login using a WebAuthn passkey assertion
      description: >-
        Step 2b of passkey sign-in. Verifies the browser's assertion against
        one of the user's enrolled credentials (nonce must match the one bound
        in /auth/webauthn/assertion-options) and mints the session JWT — same
        response shape as /auth/2fa/verify, with amr ['pwd','webauthn'].
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, response, nonce]
              properties:
                challengeToken: { type: string }
                # PublicKeyCredentialAuthenticationResponse from the browser.
                response: { type: object }
                nonce: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSessionResponse'
        '401':
          description: Invalid/expired challenge, nonce mismatch, or assertion rejected

  # --- In-session two-factor re-validation ---------------------------------
  # A session whose 2FA `amr` has expired is rejected by require2FA-gated
  # endpoints (plan create/execute). Instead of a full re-login, the webapp can
  # re-prove TOTP/passkey here to mint a fresh JWT. The password is NOT
  # re-checked — the caller's identity is already established by their current
  # JWT; only the second factor is asserted (per credential policy).

  /auth/revalidate/challenge:
    post:
      tags: [Authentication]
      summary: Start an in-session two-factor revalidation for the caller
      description: >-
        Issues a 2FA challenge for the ALREADY-authenticated caller WITHOUT
        re-checking the password (the provider trusts the caller's user id, which
        the API verified via their JWT). Returns a challenge token plus whether
        passkey step-2 is available. Completion mints a fresh session JWT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Revalidation challenge started
          content:
            application/json:
              schema:
                type: object
                required: [challengeToken, twoFactorRequired, userId]
                properties:
                  challengeToken: { type: string }
                  twoFactorRequired: { type: boolean }
                  supportsPasskey: { type: boolean, description: "True when the caller has an enrolled passkey" }
                  userId: { type: string }
        '401':
          description: Authentication required or user no longer exists
        '503':
          description: No identity provider available

  /auth/revalidate/totp:
    post:
      tags: [Authentication]
      summary: Complete an in-session revalidation with a TOTP code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, totpCode]
              properties:
                challengeToken: { type: string }
                totpCode: { type: string, minLength: 6, maxLength: 6, pattern: "^\\d{6}$" }
      responses:
        '200':
          description: Fresh session minted (amr carries the verified second factor)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSessionResponse'
        '401':
          description: Authentication required, or invalid/expired challenge/code

  /auth/revalidate/webauthn/options:
    get:
      tags: [Authentication]
      summary: Fetch passkey assertion options for a pending revalidation challenge
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: challengeToken
          required: true
          schema: { type: string }
        - in: query
          name: userId
          required: true
          schema: { type: string, description: "Must equal the caller's own user id" }
      responses:
        '200':
          description: Assertion options + nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebauthnAssertionOptionsResponse'
        '401':
          description: Authentication required or invalid/expired challenge
        '403':
          description: userId does not match the caller

  /auth/revalidate/webauthn/verify:
    post:
      tags: [Authentication]
      summary: Complete an in-session revalidation with a passkey assertion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, response, nonce]
              properties:
                challengeToken: { type: string }
                response: { type: object }
                nonce: { type: string }
      responses:
        '200':
          description: Fresh session minted (amr carries ['webauthn'])
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSessionResponse'
        '401':
          description: Authentication required, or invalid/expired challenge/assertion

  /auth/2fa/verify:
    post:
      tags: [Authentication]
      summary: Complete login using TOTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, totpCode]
              properties:
                challengeToken: { type: string }
                totpCode: { type: string, minLength: 6, maxLength: 6, pattern: "^\\d{6}$" }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSessionResponse'
        '401':
          description: Invalid or expired 2FA challenge/token

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user's own profile
      description: >-
        Returns the caller's account (no users:read permission needed). Powers
        the self-service "My Account" page. `effectivePermissions` is the
        session's JWT claim (explicit grants + role-derived); `permissions` are
        the explicit grants stored on the account.
        `deviceAccessUnrestricted` indicates whether the caller can see every
        device (true) or is limited by their effective device-scope rules (false).
      responses:
        '200':
          description: Own profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      effectivePermissions:
                        type: array
                        items: { type: string }
                      deviceAccessUnrestricted:
                        type: boolean
                        description: "True when the caller can access every device (devices:all or no scope rules)"
        '401':
          description: Authentication required

  /auth/session:
    get:
      tags: [Authentication]
      summary: Get the caller's session expiry + warning lead time
      description: >-
        Returns when the CALLER's interactive session expires, computed
        server-side from the JWT issued-at plus the effective session TTL
        (global `sessionTimeoutSeconds` capped by any per-user override) — so
        it matches exactly what the auth middleware enforces. The webapp uses
        this for its top-bar countdown chip and the amber "session ending
        soon" banner, which appears once the remaining time drops below
        `warnSeconds` (the global `sessionWarnSeconds` setting; 0 disables the
        warning).
      responses:
        '200':
          description: Session expiry info
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt:
                    type: integer
                    format: int64
                    description: "Unix epoch MILLISECONDS at which the session expires"
                  ttlSeconds:
                    type: integer
                    description: "Effective TTL applied to this session (global capped by per-user override)"
                  warnSeconds:
                    type: integer
                    description: "Warning lead time in seconds (0 = warning disabled)"
                  extensionAllowed:
                    type: boolean
                    description: >-
                      Whether the caller may extend their session at all —
                      true only when the credential policy allows it AND a
                      second factor is enrolled. The webapp hides the "Extend"
                      button otherwise.
        '401':
          description: Authentication required

  /auth/session/extend/challenge:
    post:
      tags: [Authentication]
      summary: Start a session-extension revalidation (2FA challenge)
      description: >-
        Issues a second-factor challenge for the CALLER so their session can be
        extended. Extension is NEVER allowed without re-proving a second factor
        — an unauthenticated refresh would let anyone holding a stolen token
        keep minting new ones forever. Rejected with 403 when the caller's
        credential policy denies extension (`allowSessionExtension: false`,
        code `extension_disabled`) or no enrolled second factor satisfies the
        policy (code `no_2fa_enrolled`). API tokens are rejected outright.
      responses:
        '200':
          description: Pending challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeToken: { type: string }
                  twoFactorRequired: { type: boolean }
                  supportsPasskey: { type: boolean }
                  userId: { type: string }
        '401':
          description: Authentication required
        '403':
          description: Extension disabled by policy or no second factor enrolled

  /auth/session/extend/totp:
    post:
      tags: [Authentication]
      summary: Extend the session with a TOTP code
      description: >-
        Completes a pending extension challenge with an authenticator-app code.
        Only mints the fresh JWT (current effective TTL, amr carries `totp`)
        when the second factor actually verified. Same 403 gates as the
        challenge endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeToken: { type: string }
                totpCode: { type: string }
      responses:
        '200':
          description: Fresh access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, description: "Lifetime of the new token in seconds" }
        '401':
          description: Authentication required or invalid/expired challenge
        '403':
          description: Extension disabled by policy or no verified second factor

  /auth/session/extend/webauthn/options:
    get:
      tags: [Authentication]
      summary: Passkey assertion options for a pending extension challenge
      parameters:
        - { name: challengeToken, in: query, required: true, schema: { type: string } }
        - { name: userId, in: query, required: true, schema: { type: string }, description: "Must equal the caller's own user id" }
      responses:
        '200':
          description: WebAuthn assertion options + nonce
        '401':
          description: Authentication required
        '403':
          description: Extension disabled by policy, or userId is not the caller

  /auth/session/extend/webauthn/verify:
    post:
      tags: [Authentication]
      summary: Extend the session with a passkey assertion
      description: >-
        Completes a pending extension challenge with a WebAuthn assertion.
        Only mints the fresh JWT (amr carries `webauthn`) when the assertion is
        valid. Same 403 gates as the challenge endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeToken: { type: string }
                response: { type: object, additionalProperties: true }
                nonce: { type: string }
      responses:
        '200':
          description: Fresh access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer, description: "Lifetime of the new token in seconds" }
        '401':
          description: Authentication required or invalid/expired challenge
        '403':
          description: Extension disabled by policy or no verified second factor

  /auth/me/preferences:
    get:
      tags: [Authentication]
      summary: Get the caller's own UI preferences (nav order + hidden pages)
      responses:
        '200':
          description: Stored preferences (empty arrays when none saved yet)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '401':
          description: Authentication required
    put:
      tags: [Authentication]
      summary: Persist the caller's own UI preferences
      description: >-
        Upserts the user's navigation order and hidden-page list. Omitted fields
        are left unchanged; present-but-invalid values are treated as empty.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferencesUpdateRequest' }
      responses:
        '200':
          description: Stored preferences after the update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '401':
          description: Authentication required

  /counts:
    get:
      tags: [Authentication]
      summary: Aggregated nav-badge counts (permission-aware)
      description: >-
        Returns actionable item counts for the sidebar badges in a single call.
        Each key is present only when the caller holds that page's read
        permission. Keys: `notifications` (open), `configJobs` (queued+running),
        `plans` (executing/ready/draft).
      responses:
        '200':
          description: Count object (keys omitted for missing permissions)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NavCountsResponse' }
        '401':
          description: Authentication required

  /auth/me/password:
    post:
      tags: [Authentication]
      summary: Rotate the caller's own password (forced-change flow)
      description: >-
        The authenticated user changes their OWN password. Used by the forced
        change flow when a login reports `passwordExpired`. The current password
        must be proven, and the new one must satisfy the caller's effective
        minimum-length policy. Stamps `passwordChangedAt` (clears any expiry).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Missing fields or newPassword below the policy minimum
        '401':
          description: Authentication required / current password incorrect
        '403':
          description: Account is disabled (error code `user_disabled`)

  # --- Credential policies (2FA requirements + gate AMRs) -------------------
  # A per-user row overrides the global default entirely (user policy wins).
  # The require2FA gate reads these rows LIVE on every privileged request.

  /auth/policies/global:
    get:
      tags: [Authentication]
      summary: Get the global credential policy
      description: >-
        The default policy applied to every user without a per-user override.
        Readable by any authenticated user; editing requires auth:policies:write.
      responses:
        '200':
          description: Global policy
          content:
            application/json:
              schema:
                type: object
                required: [policy]
                properties:
                  policy: { $ref: '#/components/schemas/CredentialPolicy' }
        '401':
          description: Authentication required
    put:
      tags: [Authentication]
      summary: Update the global credential policy
      description: >-
        Requires permission `auth:policies:write`. Partial updates are allowed —
        only the provided fields change. gateAmrs must keep at least one entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialPolicyUpdateRequest' }
      responses:
        '200':
          description: Updated global policy
          content:
            application/json:
              schema:
                type: object
                required: [policy]
                properties:
                  policy: { $ref: '#/components/schemas/CredentialPolicy' }
        '400':
          description: Invalid payload (unknown method/amr, empty gateAmrs)
        '401':
          description: Authentication required
        '403':
          description: Missing auth:policies:write permission

  /users/{id}/policy:
    get:
      tags: [Users]
      summary: Get the effective credential policy for a user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Effective policy + its source (user | global | default)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialPolicyWithSource' }
        '401':
          description: Authentication required
    put:
      tags: [Users]
      summary: Set a per-user credential policy override
      description: >-
        Requires permission `auth:policies:write`. Creates or updates the
        user's override, which wins over the global default. Partial updates are
        allowed — only the provided fields change.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialPolicyUpdateRequest' }
      responses:
        '200':
          description: Updated per-user policy (source = user)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialPolicyWithSource' }
        '400':
          description: Invalid payload (unknown method/amr, empty gateAmrs)
        '401':
          description: Authentication required
        '403':
          description: Missing auth:policies:write permission
    delete:
      tags: [Users]
      summary: Clear a per-user credential policy override
      description: >-
        Requires permission `auth:policies:write`. Removes the user's override so
        the global default applies again. Returns the now-effective (global) policy.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Effective policy after clearing (source = global)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialPolicyWithSource' }
        '401':
          description: Authentication required
        '403':
          description: Missing auth:policies:write permission

  /devices:
    get:
      tags: [Devices]
      summary: List managed devices
      description: >-
        Returns the device list. Callers whose effective permissions include
        `devices:all` (or who have no device-scope rules) see every device.
        Scoped callers only receive devices matching at least one of their
        siteIds, tags, or deviceIds rules.
      parameters:
        - in: query
          name: vendor
          schema: { type: string }
        - in: query
          name: siteId
          schema: { type: string, description: "Filter by the device's assigned site" }
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          description: Authentication required
    post:
      tags: [Devices]
      summary: Register device
      description: Requires permission `devices:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Referenced plugin not found
        '422':
          description: Plugin assignment payload is invalid

  /devices/{deviceId}:
    patch:
      tags: [Devices]
      summary: Update a device (rename, change management address or site, ...)
      description: >-
        Updates the identity fields of an existing device. Only the provided
        fields are changed; plugin assignments and their settings are managed
        via the /devices/{deviceId}/plugins endpoints. `siteId` may be set to
        null to unassign the site.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1 }
                vendor: { type: string, minLength: 1 }
                # All roles the device fulfills (e.g. ["router", "firewall"]); at least one required.
                deviceTypes:
                  type: array
                  minItems: 1
                  items: { type: string, minLength: 1 }
                # Legacy single-type field — equivalent to a one-element deviceTypes.
                deviceType: { type: string, minLength: 1 }
                # Free-form user tags; [] clears all. Future filter/plan targeting.
                tags:
                  type: array
                  items: { type: string, minLength: 1 }
                managementAddress: { type: string, minLength: 1 }
                # null unassigns the site (OpenAPI 3.1 / JSON Schema type array).
                siteId: { type: [string, 'null'] }
                # Hardware model / firmware version — null clears the selection.
                model: { type: [string, 'null'], description: "Hardware model from a plugin's catalog; null clears" }
                firmwareVersion: { type: [string, 'null'], description: "Firmware version for the selected model; null clears" }
                # Manual topology-layer override — null clears back to auto-classify.
                layerOverride: { type: [string, 'null'], description: "A network_layers id; must exist (400 otherwise); null = auto-classify" }
                # Per-device metrics poll window in ms — null clears back to the inherited value.
                pollIntervalMs: { type: [integer, 'null'], minimum: 5000, maximum: 3600000, description: "Per-device metrics poll window (ms); null/omitted = inherit plugin option / system setting" }
                # Toggles telemetry polling. Disabled devices keep their historical data + last metrics.
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated device (with its plugin assignments)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: No updatable fields provided or a field is invalid
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Device not found
    delete:
      tags: [Devices]
      summary: Delete a device
      description: >-
        Removes the device and everything that hangs off it (plugin assignments,
        per-device plugin settings, secondary IP addresses, telemetry history
        and config-job rows). Refused with 409 while any plan still references
        the device — delete those plans first. The credential secrets assigned
        to the device are NOT deleted; they remain available for reuse.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Device deleted
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Device not found
        '409':
          description: Device is still referenced by plan steps

  /devices/{deviceId}/clone:
    post:
      tags: [Devices]
      summary: Clone a device (all settings reused)
      description: >-
        Requires permission `devices:write`. Creates a copy of the device with
        all its settings — plugin assignments (including credential sources and
        extra slots), secondary IP addresses, per-device plugin setting
        overrides, site, model and firmware. The clone gets a fresh id, status
        'unknown' and the name "<source> (copy)" (numbered when taken). The
        webapp opens the edit form for the clone so the user can change the IP
        or other settings before saving.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Cloned device (with its plugin assignments)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Source device not found

  /devices/refresh:
    post:
      tags: [Devices]
      summary: Force an immediate re-poll of one or more devices (metrics + inventory)
      description: >-
        Requires permission `devices:write`. Bypasses the staggered scheduling
        windows and polls every assignment of each requested device right now,
        with full inventory collection — so both live metrics AND the
        cross-device inventory tables (networks, hosts, ports, storage, …)
        refresh immediately. The regular poll deadlines stay untouched.
        Devices are processed sequentially; per-assignment outcomes report
        reachability and transport errors for diagnostics. Unknown ids and
        disabled devices come back with `ok: false` + an error message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceIds]
              properties:
                deviceIds:
                  type: array
                  items: { type: string }
                  description: Device ids to re-poll (1..N)
      responses:
        '200':
          description: Per-device refresh outcomes
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceRefreshResult'
        '400':
          description: Missing or empty deviceIds
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission

  /devices/{deviceId}/plugins:
    get:
      tags: [Devices]
      summary: List a device's plugin assignments
      description: >-
        Returns every plugin assigned to the device, each with its own
        credential source and primary flag. A device can be served by several
        plugins at once (e.g. OPNsense API + SNMP + SSH).
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, plugins]
                properties:
                  deviceId: { type: string }
                  plugins:
                    type: array
                    items:
                      $ref: '#/components/schemas/DevicePluginAssignment'
        '401':
          description: Authentication required
        '404':
          description: Device not found
    post:
      tags: [Devices]
      summary: Assign a plugin to a device
      description: >-
        Adds another plugin assignment. A new assignment is NOT made primary
        automatically — only the very first assignment on a device becomes
        primary; pass `isPrimary: true` (or use PATCH) to change it later.
        Each assignment may carry its own credential source (`secretId`,
        optional — plugins without credentials omit it).
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePluginAssignmentInput'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePluginAssignment'
        '400':
          description: Missing pluginId
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Device, plugin or credentials not found
        '409':
          description: Plugin is already assigned to this device

  /devices/{deviceId}/plugins/{pluginId}:
    patch:
      tags: [Devices]
      summary: Update a plugin assignment (primary flag and/or credentials)
      description: >-
        Updates an existing (device, plugin) assignment. The request body is
        optional:
          - omit the body → promote to primary (legacy behavior);
          - `isPrimary: true` → promote to primary (demotes the current one);
          - `secretId: "..." | null` → change the credential source (null clears it);
          - `extraCredentials: { slotName: secretId }` → replace bound credential
            slots (validated against the plugin's declared slots; 400 on type mismatch).
        Any combination may be sent in a single call. Idempotent when nothing
        changes.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: path
          name: pluginId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePluginAssignmentUpdate'
      responses:
        '200':
          description: Assignment is now primary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePluginAssignment'
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Device not found or plugin is not assigned to it
    delete:
      tags: [Devices]
      summary: Remove a plugin assignment from a device
      description: >-
        Removes the (device, plugin) binding. If it was the primary and other
        assignments remain, the oldest remaining one is promoted to keep
        exactly one primary.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: path
          name: pluginId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Assignment removed
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Device not found or plugin is not assigned to it

  /devices/{deviceId}/plugins/order:
    put:
      tags: [Devices]
      summary: Reorder a device's plugin list (drag & drop)
      description: >-
        Rewrites the order of a device's plugin assignments. The request body
        carries the FULL desired sequence as an array of plugin ids; the first
        id becomes primary (the row at position 0), all others are demoted and
        shifted down. Ids not listed keep their relative position after the
        listed ones, so a partial list is safe. Drives the webapp's drag & drop
        reordering in the device create/edit form.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Reordered assignments (in the new order)
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, plugins]
                properties:
                  deviceId: { type: string }
                  plugins:
                    type: array
                    items:
                      $ref: '#/components/schemas/DevicePluginAssignment'
        '400':
          description: Malformed order array
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Device not found

  /devices/{deviceId}/plugins/{pluginId}/options:
    get:
      tags: [Devices]
      summary: Get a device's settings for one of its plugins
      description: >-
        Same option descriptors as the global view, but `values` holds THIS
        device's overrides and `effectiveValues` resolves in the order
        device override → global override → descriptor default.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: path
          name: pluginId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Option descriptors + device-scoped settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '401':
          description: Authentication required
        '404':
          description: Device not found or plugin is not assigned to it

  /devices/{deviceId}/plugins/{pluginId}/settings:
    put:
      tags: [Devices]
      summary: Save a device's settings overrides for one of its plugins
      description: >-
        Persists per-device override values (validated against the plugin's
        descriptors, all-or-nothing). Unchanged options keep inheriting the
        global setting or descriptor default.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: path
          name: pluginId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties: true
                  description: "Map of option key -> value (string | integer | boolean)"
      responses:
        '200':
          description: Saved; returns the updated device-scoped options view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '400':
          description: One or more values failed validation
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  fieldErrors:
                    type: object
                    additionalProperties: { type: string }
        '401':
          description: Authentication required
        '403':
          description: Missing plugins:manage permission
        '404':
          description: Device not found or plugin is not assigned to it
    delete:
      tags: [Devices]
      summary: Reset a device's settings overrides for one of its plugins
      description: >-
        Deletes this device's override rows only — every option falls back to
        the global setting (or descriptor default) instead of being wiped.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: path
          name: pluginId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reset; returns the options view (device values now empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '401':
          description: Authentication required
        '403':
          description: Missing plugins:manage permission
        '404':
          description: Device not found or plugin is not assigned to it

  /devices/{deviceId}/ips:
    get:
      tags: [Devices]
      summary: List a device's IP addresses (primary first)
      description: >-
        Returns the device's primary address (its `managementAddress`) with
        `isPrimary: true`, followed by any secondary IPs. The primary is the
        default target plugins reach; secondaries are additional interfaces.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Addresses (primary first)
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, ips]
                properties:
                  deviceId: { type: string }
                  ips:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceAddress'
        '401':
          description: Authentication required
        '404':
          description: Device not found
    post:
      tags: [Devices]
      summary: Add a secondary IP to a device
      description: >-
        Registers an additional address (IPv4, IPv6, or DNS name) the plugins
        may reach. The primary address is managed via PATCH /devices/{deviceId}
        (`managementAddress`) and cannot be added here. Duplicate of the
        primary or an existing secondary → 409.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, minLength: 1 }
      responses:
        '201':
          description: Address registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceIpRow'
        '400':
          description: address is not a valid IPv4/IPv6/DNS name
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Device not found
        '409':
          description: Address is already registered for this device

  /devices/{deviceId}/ips/{ipId}:
    delete:
      tags: [Devices]
      summary: Remove a secondary IP from a device
      description: >-
        Deletes the given secondary address. The primary (managementAddress)
        cannot be removed here — change it via PATCH /devices/{deviceId}.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: path
          name: ipId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Address removed
        '401':
          description: Authentication required
        '403':
          description: Missing devices:write permission
        '404':
          description: Device not found or address is not registered for it

  /devices/{deviceId}/monitoring:
    get:
      tags: [Monitoring]
      summary: Get normalized device telemetry
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current telemetry snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySnapshot'
        '401':
          description: Authentication required
        '404':
          description: Device not found

  /devices/{deviceId}/state:
    get:
      tags: [Devices]
      summary: Get live device state from a plugin (Config page)
      description: >-
        Fetches the DYNAMIC device-state document from one assigned plugin's
        `GET /state` endpoint (capability `deviceState`). The response is
        returned verbatim — sections of items (ports with live states,
        interfaces, ZFS pools, system info) plus context-aware action
        references. Advertised action ids are validated against the plugin's
        persisted action catalog; unknown ones are stripped. Without a
        `pluginId` query param the device's primary assignment is used.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: query
          name: pluginId
          required: false
          description: "Assigned plugin to fetch state from (default = primary assignment)"
          schema: { type: string }
      responses:
        '200':
          description: Live device state document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceState'
        '400':
          description: Plugin not assigned to this device / no assignment at all
        '401':
          description: Authentication required
        '404':
          description: Device or plugin endpoint not found
        '501':
          description: This plugin does not support device state
        '502':
          description: Plugin failed to report device state

  /devices/{deviceId}/probe:
    get:
      tags: [Devices]
      summary: Get live short-cycle telemetry from a plugin (probe)
      description: >-
        Fetches LIVE probe data from one assigned plugin's `POST /probe`
        endpoint (capability `probe`). Designed for on-demand webapp polling at
        1–5 s cadence — data too slow/heavy for the background monitoring
        worker. The response is returned verbatim: a free-form metrics map
        keyed by probe key, owned by the plugin. Without a `pluginId` query
        param the device's primary assignment is used. This is a live read
        path — nothing is written to the database.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: query
          name: pluginId
          required: false
          description: "Assigned plugin to probe (default = primary assignment)"
          schema: { type: string }
        - in: query
          name: keys
          required: false
          description: "Comma-separated probe keys to collect (absent = the plugin's default set)"
          schema: { type: string }
        - in: query
          name: names
          required: false
          description: >-
            Comma-separated container-name selection — state-style probe keys
            (e.g. `containerStates`) collect only these containers instead of
            the full set, so a page can watch a small subset at a tighter
            cadence. Absent = no restriction (full collection).
          schema: { type: string }
      responses:
        '200':
          description: Live probe snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceProbe'
        '400':
          description: Plugin not assigned to this device / no assignment at all
        '401':
          description: Authentication required
        '404':
          description: Device or plugin endpoint not found
        '501':
          description: This plugin does not support probing
        '502':
          description: Plugin failed to report probe data

  /devices/{deviceId}/quick-action:
    post:
      tags: [Devices]
      summary: Resolve a kind:'url' quick action into the device's web-UI URL
      description: >-
        Resolves ONE kind:'url' quick action for a device's assignment into the
        management web-UI URL. The Devices page "Device Actions" column calls this
        when the user clicks a url-kind shortcut; the plugin owns all URL knowledge
        (scheme, path + its configured `webUiPort` option, which rides in via
        per-device settings). Without an explicit `pluginId`, the assignment whose
        persisted quickActions list contains the id is used. Gated on devices:read —
        opening a web UI transmits NO credentials to the browser.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionId]
              properties:
                actionId: { type: string, description: "The quick-action id to resolve (must be a kind:'url' entry)" }
                pluginId: { type: string, description: "Assigned plugin that owns the quick action (default = auto-resolve from the device's assignments)" }
      responses:
        '200':
          description: Resolved web-UI URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickActionResult'
        '400':
          description: Missing actionId / no assigned plugin advertises the quick action
        '401':
          description: Authentication required
        '404':
          description: Device or plugin endpoint not found
        '502':
          description: Plugin failed to resolve the URL (unknown action / bad address)

  /devices/{deviceId}/filesystem:
    post:
      tags: [Devices]
      summary: Perform one file operation on a device's filesystem (SFTP)
      description: >-
        Performs ONE file operation on a device's filesystem, brokered to the
        assigned plugin's `POST /filesystem` endpoint (capability `filesystem`).
        The webapp's Storage page browses dataset contents and the Containers
        page browses container volume mounts through this single route. The body
        carries an `op` (`list` | `read` | `stat` | `write` | `mkdir` | `rmdir` |
        `unlink` | `rename`) plus a `path` (relative to the scoped root) and a
        `context` naming WHAT to browse — e.g. `{ kind: 'dataset', name }` or
        `{ kind: 'container-volume', source, target? }`. The plugin maps that
        context onto an SFTP root and confines every path to it, so a webapp-
        supplied relative path can never walk out of the scoped tree. Without a
        `pluginId` in the body the device's primary assignment is used. Gated on
        `devices:write` — file operations mutate device state. The response is
        returned verbatim from the plugin (see FilesystemResult).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilesystemRequest'
      responses:
        '200':
          description: Result of the file operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesystemResponse'
        '400':
          description: Plugin not assigned to this device / no assignment at all / bad op
        '401':
          description: Authentication required (requires devices:write)
        '404':
          description: Device or plugin endpoint not found
        '409':
          description: >-
            No eligible file-access credential (code `no_credential`) or several with no
            stored default (code `credential_selection_required`, body carries `candidates`).
        '501':
          description: This plugin does not support filesystem browsing
        '502':
          description: Plugin failed to perform the file operation

  /devices/{deviceId}/session-credentials:
    get:
      tags: [Devices]
      summary: List the caller's eligible session credentials for a device + purpose
      description: >-
        Returns every secret the CALLER may use for interactive sessions of `purpose`
        (`console` = SSH console, `filesystem` = SFTP file access) on this device —
        flagged secrets of an SSH-capable type that are either owned by the caller or
        created by a global writer. Ordered by the caller's stored preference (first =
        auto-used default); `defaultSecretId` is what would be used without prompting
        (null = the client must show its picker). Gated on `devices:write` like the
        console/filesystem routes themselves.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: query
          name: purpose
          required: true
          schema: { type: string, enum: [console, filesystem] }
      responses:
        '200':
          description: Eligible credentials + auto-use default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCredentialOptions'
        '400':
          description: Missing or invalid purpose
        '401':
          description: Authentication required (requires devices:write)
        '403':
          description: Missing required permission / device out of scope
    put:
      tags: [Devices]
      summary: Store the caller's ordered session-credential preference for a device + purpose
      description: >-
        Replaces the caller's stored ORDERED list of preferred credentials for one
        device+purpose. The first entry is auto-used on future sessions (no prompt);
        the rest stay available for re-picking. Ids that are not currently eligible
        for this user+purpose are dropped silently, so stale rows never break resolution.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCredentialPreferenceRequest'
      responses:
        '200':
          description: Preference stored (echoes the cleaned ordered ids + full candidate list)
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, purpose, secretIds]
                properties:
                  deviceId: { type: string }
                  purpose: { type: string, enum: [console, filesystem] }
                  secretIds:
                    type: array
                    items: { type: string }
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionCredentialCandidate'
        '400':
          description: Missing or invalid purpose
        '401':
          description: Authentication required (requires devices:write)
        '403':
          description: Missing required permission / device out of scope

  /devices/{deviceId}/console:
    post:
      tags: [Devices]
      summary: Mint a short-lived ticket for an interactive SSH console
      description: >-
        Authorizes ONE interactive SSH terminal session (capability `sshConsole`)
        and returns a single-use, 60-second CONSOLE TICKET. This is the only
        authenticated step of the console flow — browsers cannot set headers on a
        WebSocket upgrade, so the ticket itself becomes the bearer credential for
        the companion endpoint `GET /devices/{deviceId}/console/ws?ticket=…`.
        Authorization happens here: JWT + `devices:write` + the assigned plugin's
        `sshConsole` capability. The body may carry a `pluginId` (default = primary
        assignment) and a plugin-owned `context` naming what to attach to — e.g.
        `{ kind: 'host' }` for a login shell or `{ kind: 'container', name?, service? }`
        for an exec into a container. The webapp's DeviceDetail page ("Shell" button)
        and the Containers page (per-container console) both drive this route; the
        WebSocket proxy then pipes bytes verbatim to the plugin's `/console` endpoint,
        which opens a PTY session over the `ssh` credential slot — either the one bound
        to the assignment or, when `secretId` is supplied, the user's chosen personal
        credential (validated against their eligible session secrets). Without an explicit
        `secretId`, the stored per-device default / sole eligible candidate is auto-used;
        several candidates with no valid default answer 409 `credential_selection_required`
        so the client can show its picker.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleTicketRequest'
      responses:
        '201':
          description: Ticket minted (use it on the console WebSocket endpoint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleTicketResponse'
        '400':
          description: Plugin not assigned to this device / no assignment at all
        '401':
          description: Authentication required (requires devices:write)
        '403':
          description: The selected credential is not available for this session
        '404':
          description: Device or plugin endpoint not found
        '409':
          description: >-
            No eligible SSH console credential (code `no_credential`) or several with no
            stored default (code `credential_selection_required`, body carries `candidates`).
        '501':
          description: This plugin does not support an SSH console

  /devices/{deviceId}/console/ws:
    get:
      tags: [Devices]
      summary: Open the interactive SSH console WebSocket (ticket-authenticated)
      description: >-
        The WebSocket PROXY for an SSH console. Browsers cannot attach an
        Authorization header to a WS upgrade, so this endpoint authenticates via
        the single-use ticket minted by `POST /devices/{deviceId}/console` — which
        already enforced JWT + `devices:write` + capability checks for exactly this
        device/assignment. The proxy redeems the ticket once, resolves FRESH
        credentials and pipes frames VERBATIM between the browser's xterm.js and
        the plugin's `/console` endpoint (capability `sshConsole`): binary frames
        are raw terminal I/O in both directions; text frames carry JSON control
        messages (`ready`, `resize {cols,rows}`, `exit {code}`, `error {message}`).
        The first frame FROM the proxy is a hello object with fresh credentials —
        plugins never see the user's JWT. This path is served by a server-level
        upgrade listener (not an express route) and therefore appears in this spec
        for documentation only; clients open it as `ws(s)://…/v1/devices/{id}/console/ws?ticket=…`.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: query
          name: ticket
          required: true
          description: "Single-use console ticket from POST /devices/{deviceId}/console"
          schema: { type: string }
      responses:
        '101':
          description: WebSocket upgrade — the terminal stream is live
        '401':
          description: Missing, invalid or expired console ticket
        '502':
          description: Plugin console unreachable / failed to open the PTY

  /devices/{deviceId}/ports:
    get:
      tags: [Devices]
      summary: Get normalized port inventory for a device
      description: >-
        Normalized network-port rows (device_ports table) across all of the
        device's plugins. Fed by the telemetry worker from each plugin's
        `metrics['ports']` array — upserted per poll, deleted-on-absent.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Port rows for this device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePorts'
        '401':
          description: Authentication required
        '404':
          description: Device not found

  /devices/{deviceId}/config-jobs:
    post:
      tags: [Configuration]
      summary: Queue asynchronous configuration action
      description: Requires 2FA-completed session and permission `configs:apply`.
      x-2fa-required: true
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigJobRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigJob'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Device not found

  /config-jobs/{jobId}:
    get:
      tags: [Configuration]
      summary: Get configuration job status
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigJob'
        '401':
          description: Authentication required
        '404':
          description: Job not found

  # --- Execution plans -------------------------------------------------------
  # A plan is the persisted output of a plugin's /plan endpoint (e.g. an
  # OPNsense WireGuard tunnel spanning two firewalls). Creation asks the
  # plugin to plan an intent across selected devices, fulfils every
  # provisionRequest via the secrets provider (secrets are created at plan
  # creation time), and persists each step. Execution walks the steps in
  # dependency order through the plugin's /config endpoint.

  /plans:
    get:
      tags: [Plans]
      summary: List recent execution plans
      responses:
        '200':
          description: Plans (most recent first, with step progress)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
        '401':
          description: Authentication required
    post:
      tags: [Plans]
      summary: Create an execution plan from a plugin intent
      description: >-
        Requires 2FA-completed session and permission `configs:apply`. Asks the
        plugin to build a plan for the given intent across the selected devices,
        creates every provisioned secret immediately (ref -> secret id map is
        returned on the plan), and persists all steps. Multi-device intents
        require exactly their declared device count.
      x-2fa-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreateRequest'
      responses:
        '201':
          description: Plan created (status ready) with steps + provisioned secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '400':
          description: Invalid request, unknown intent/action, or plugin rejected the plan
        '401':
          description: Authentication required (or 2FA-completed session missing)
        '403':
          description: Missing required permission
        '404':
          description: Plugin or device not found
        '502':
          description: Plugin unreachable or secret provisioning failed

  /plans/activity:
    get:
      tags: [Plans]
      summary: Plans activity feed for the top-bar plans icon
      description: >-
        Returns every executing plan plus recently-finished ones (terminal
        status within `windowMs`, default 300000), newest activity first, with
        step progress. No steps — use the detail route for those.
      parameters:
        - in: query
          name: windowMs
          required: false
          schema: { type: integer, minimum: 10000, maximum: 3600000 }
          description: "Recency window for finished plans (ms). Default 300000."
      responses:
        '200':
          description: Active + recently-finished plans (with step progress)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
        '401':
          description: Authentication required

  /plans/{id}:
    get:
      tags: [Plans]
      summary: Get plan detail (steps + provisioned secrets)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Plan with ordered steps and secret metadata (never material)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '401':
          description: Authentication required
        '404':
          description: Plan not found
    delete:
      tags: [Plans]
      summary: Delete a plan and its provisioned secrets
      description: >-
        Requires permission `configs:apply`. Only non-executing plans can be
        deleted; the steps and every secret created for this plan are removed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Plan deleted
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Plan not found
        '409':
          description: Plan is executing — cancel it first

  /plans/{id}/execute:
    post:
      tags: [Plans]
      summary: Start plan execution
      description: >-
        Requires 2FA-completed session and permission `configs:apply`. Only
        draft/ready plans can be executed. Steps run sequentially in dependency
        order; best-effort steps (e.g. snapshot.create) do not abort the plan on
        failure, any other step failure fails the plan and skips its dependents.
      x-2fa-required: true
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Execution started (status executing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '401':
          description: Authentication required (or 2FA-completed session missing)
        '403':
          description: Missing required permission
        '404':
          description: Plan not found
        '409':
          description: Plan is not in a startable state

  /plans/{id}/retry:
    post:
      tags: [Plans]
      summary: Retry a plan (duplicate + execute the copy)
      description: >-
        Requires 2FA-completed session and permission `configs:apply`. Duplicates
        the plan — same intent inputs, steps and provisioned secrets (no
        re-provisioning) — and executes the duplicate immediately. The new plan's
        `retriedFrom` links it to this one. Only non-executing plans can be
        retried.
      x-2fa-required: true
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Duplicate created and queued for execution (status executing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '401':
          description: Authentication required (or 2FA-completed session missing)
        '403':
          description: Missing required permission
        '404':
          description: Plan not found
        '409':
          description: Plan is still executing

  /plans/{id}/cancel:
    post:
      tags: [Plans]
      summary: Cancel an executing plan (cooperative, between steps)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cancel requested; the executor honors it before the next step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Plan not found
        '409':
          description: Plan is not executing

  /plans/{id}/schedule:
    post:
      tags: [Plans]
      summary: (Re-)schedule a plan for later execution
      description: >-
        Requires permission `configs:apply`. Accepts saved plans (draft/ready),
        already-scheduled ones (to change the time/policy) and finished ones
        (succeeded/failed/cancelled/skipped), so any completed action can be
        re-run later. The due time is relative (`inMinutes`) or
        absolute (`at`); exactly one must be given. `policy` controls what
        happens when the plugin cannot be reached at the due instant:
        `run-asap` (default) keeps retrying with backoff until it succeeds,
        `skip` marks the plan skipped. Re-scheduling replaces any existing
        schedule. The scheduler worker flips due plans to executing; a plan that
        was due while UNM itself was down is handled at startup per its policy.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanScheduleRequest'
      responses:
        '200':
          description: Plan scheduled (status scheduled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '400':
          description: Invalid or missing schedule time
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Plan not found
        '409':
          description: Plan is executing (or in a non-schedulable state)
    delete:
      tags: [Plans]
      summary: Remove the schedule from a plan
      description: >-
        Requires permission `configs:apply`. Only scheduled plans can be
        unscheduled. The plan returns to its pre-schedule status (draft/ready
        for never-run plans, succeeded/failed/etc. for finished ones).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Schedule removed; plan restored to its pre-schedule status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Plan not found
        '409':
          description: Plan is not scheduled

  /plans/{id}/steps:
    post:
      tags: [Plans]
      summary: Append a single-device step to a draft/ready plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanStepCreateRequest'
      responses:
        '201':
          description: Step added (step indices + dependsOn re-indexed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '400':
          description: Invalid request or input fails the action's schema
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Plan, device, or plugin assignment not found
        '409':
          description: Plan is not editable (not draft/ready)

  /plans/{id}/steps/bulk:
    post:
      tags: [Plans]
      summary: Append many single-device steps to a draft/ready plan in one call
      description: >-
        Bulk variant of the single-step append, used by cross-device bulk actions
        (e.g. stop/start/update/delete N apps or images on the Containers page).
        Every step is validated against the plan plugin's catalog inputSchema;
        all-or-nothing — any invalid step returns 400 and nothing is written.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/PlanStepCreateRequest'
      responses:
        '201':
          description: Steps added (indices + dependsOn re-indexed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '400':
          description: Empty list, or a step's input fails the action's schema
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Plan or device not found
        '409':
          description: Plan is not editable (not draft/ready)

  /plans/{id}/steps/reorder:
    patch:
      tags: [Plans]
      summary: Move a step within a draft/ready plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: integer, description: "Current stepIndex" }
                to: { type: integer, description: "Target stepIndex" }
      responses:
        '200':
          description: Steps re-indexed (dependsOn remapped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '400':
          description: Index out of range or dependency cycle introduced
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Plan not found
        '409':
          description: Plan is not editable (not draft/ready)

  /plans/{id}/steps/{stepId}:
    patch:
      tags: [Plans]
      summary: Edit a step of a draft/ready plan
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: stepId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanStepUpdateRequest'
      responses:
        '200':
          description: Step updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '400':
          description: Invalid request or input fails the action's schema
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Plan or step not found
        '409':
          description: Plan is not editable (not draft/ready)
    delete:
      tags: [Plans]
      summary: Remove a step from a draft/ready plan
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: stepId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Step removed (step indices + dependsOn re-indexed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Plan or step not found
        '409':
          description: Plan is not editable (not draft/ready)

  /plans/{id}/secrets/{ref}/regenerate:
    post:
      tags: [Plans]
      summary: Re-roll a plan's provisioned secret in place (same id preserved)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: ref
          required: true
          schema: { type: string, description: "ProvisionRequest ref (e.g. keyA)" }
      responses:
        '200':
          description: Secret regenerated under the same id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  type: { type: string }
        '401':
          description: Authentication required
        '403':
          description: Missing required permission (secrets:write)
        '404':
          description: Plan or provisioned secret not found

  /plugins:
    get:
      tags: [Plugins]
      summary: List discovered plugins
      description: >-
        Plugins are discovered automatically via mDNS/DNS-SD advertising and an
        HTTP polling fallback, so no manual registration is required.
      responses:
        '200':
          description: Plugin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plugin'
        '401':
          description: Authentication required

  /secrets:
    get:
      tags: [Secrets]
      summary: List stored secrets
      description: >-
        Returns secret metadata (no decrypted values). Global readers (`secrets:read`)
        see every secret. A user with only the personal permission `secrets:self-write`
        sees their OWN secrets plus those created by global writers — the shared pool of
        credentials they may use for interactive SSH / file sessions.
      responses:
        '200':
          description: Secret list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
    post:
      tags: [Secrets]
      summary: Create a new secret
      description: >-
        Creates a typed secret via the specified (or default) secrets provider.
        The provider encrypts the fields and stores the ciphertext. The secret
        type and provider id are recorded so decryption is always routed back
        to the correct provider. Requires `secrets:write` (global) OR
        `secrets:self-write` (personal area — the secret is owned by the caller).
        The two usage flags opt the secret in for interactive SSH console / SFTP
        file sessions (only meaningful for usernamePassword / sshKeyPair types).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, fields]
              properties:
                type: { type: string, description: "Secret type (e.g. apiKey, usernamePassword, snmp)" }
                providerId: { type: string, nullable: true, description: "Provider plugin UUID (defaults to SECRETS_PLUGIN_ID)" }
                fields:
                  type: object
                  additionalProperties: { type: string }
                  description: "Decrypted field values as declared by the provider's secret type schema"
                label: { type: string, nullable: true }
                expiresAt: { type: string, format: date-time, nullable: true }
                interactiveLoginAllowed: { type: boolean, default: false, description: "Allow use for interactive SSH console sessions" }
                fileAccessAllowed: { type: boolean, default: false, description: "Allow use for SFTP file-access sessions" }
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          description: Invalid request (missing type or fields)
        '401':
          description: Authentication required
        '403':
          description: Missing required permission

  /secrets/providers:
    get:
      tags: [Secrets]
      summary: List registered secrets providers
      description: >-
        Returns all registered secrets provider plugins along with the secret
        types each serves (field schemas). Use this to render dynamic secret
        creation forms.
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretProvider'
        '401':
          description: Authentication required
        '403':
          description: Missing required permission

  /secrets/generate:
    post:
      tags: [Secrets]
      summary: Generate a new secret of a generatable type
      description: >-
        Asks the secrets provider to CREATE the key material itself (e.g. a
        WireGuard X25519 pair, an IPsec PSK, or an OpenVPN CA+cert bundle) and
        store it — no human types any keys. Only works for secret types the
        provider marks `generatable`. Non-material context fields (e.g. an
        OpenVPN commonName) may be supplied in `fields` and are preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, description: "Generatable secret type (e.g. wireguardKeyPair, tunnelPsk, openvpnProfile)" }
                providerId: { type: string, nullable: true, description: "Provider plugin UUID (defaults to SECRETS_PLUGIN_ID)" }
                fields:
                  type: object
                  additionalProperties: true
                  description: "Optional non-material context (e.g. commonName); generated material overwrites same-named keys"
                label: { type: string, nullable: true }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: Secret generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          description: Type is not generatable or missing type
        '401':
          description: Authentication required
        '403':
          description: Missing required permission

  /secrets/{id}/regenerate:
    post:
      tags: [Secrets]
      summary: Regenerate a secret's key material in place
      description: >-
        Asks the owning provider to RE-ROLL a generatable secret's key material
        while preserving its id (so assignments and plans referencing it keep
        working). Non-material context fields are carried over. Only works for
        `generatable` types.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Secret regenerated (same id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          description: Type is not generatable
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Secret not found

  /plugins/{id}/icon:
    get:
      tags: [Plugins]
      summary: Fetch a plugin's icon (proxied from the plugin itself)
      description: >-
        Proxies an icon served by the plugin. The default is the plugin's
        advertised `iconUrl`; pass `path` to fetch another asset from the same
        plugin (e.g. a per-model icon from its deviceModels catalog). Deliberately
        UNAUTHENTICATED so plain <img> tags work without a token; the path must be
        relative and cannot traverse outside the plugin's own origin.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: false
          allowReserved: true
          schema: { type: string }
          description: "Icon path relative to the plugin root (defaults to the plugin's iconUrl)"
      responses:
        '200':
          description: Icon bytes (content-type from the plugin, e.g. image/svg+xml)
          content:
            image/*:
              schema: { type: string, format: binary }
        '404':
          description: Plugin not found, or it has no icon / does not serve the requested path
        '502':
          description: The plugin could not be reached for the icon

  /plugins/{id}/required-secret-type:
    get:
      tags: [Plugins]
      summary: Get the secret types a device plugin requires
      description: >-
        Reads the `requiredSecretType` (legacy single type),
        `requiredSecretTypes` (all acceptable PRIMARY secret types, e.g.
        usernamePassword OR sshKeyPair) and any additional named credential
        slots (`credentialSlots`) from the plugin's /discover endpoint. Use
        this to filter which secrets are applicable to devices managed by this
        plugin and to render per-slot credential pickers.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Required secret types
          content:
            application/json:
              schema:
                type: object
                properties:
                  requiredSecretType:
                    type: string
                    nullable: true
                    description: "Legacy single type (first of requiredSecretTypes)"
                  requiredSecretTypes:
                    type: array
                    items: { type: string }
                    description: "All acceptable PRIMARY secret types (empty = undeclared/any)"
                  credentialSlots:
                    type: array
                    items:
                      $ref: '#/components/schemas/CredentialSlotDescriptor'
                    description: "Additional named credential slots declared by the plugin (null = none)"
        '401':
          description: Authentication required

  /plugins/{id}/metrics:
    get:
      tags: [Plugins]
      summary: Get the metric descriptors a plugin serves
      description: >-
        Returns the metric descriptors the plugin declared in its /discover
        endpoint. The webapp renders device metrics generically from these
        (gauge/plot/text/table), so new plugins/metrics need no webapp changes.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Metric descriptors
          content:
            application/json:
              schema:
                type: object
                required: [pluginId, metrics]
                properties:
                  pluginId: { type: string }
                  metrics:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetricDescriptor'
        '401':
          description: Authentication required
        '404':
          description: Plugin not found

  /plugins/{id}/self-metrics:
    get:
      tags: [Plugins]
      summary: Get runtime self-metrics samples of a plugin process
      description: >-
        Health samples of the plugin PROCESS itself (not its devices): CPU%,
        heap/RSS memory, event-loop lag, in-flight work requests, last-poll
        duration + error rate, emitted metric count and log queue depth.
        Collected by an API worker polling each plugin's auto-mounted GET
        /metrics endpoint every 30s (see @unm/plugin-sdk createSelfMetrics).
        `latest` is the most recent sample; `history` carries up to `limit`
        samples newest-first for sparklines. Samples are kept for
        LOG_RETENTION_DAYS (default 7). A plugin that predates the endpoint
        simply has no samples (`latest: null`).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 120, maximum: 576 }
          description: Max history samples to return (default 120 = last hour at the 30s cadence)
      responses:
        '200':
          description: Latest sample + history
          content:
            application/json:
              schema:
                type: object
                required: [pluginId, latest, history]
                properties:
                  pluginId: { type: string }
                  latest:
                    $ref: '#/components/schemas/PluginSelfMetricsSample'
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/PluginSelfMetricsSample'
        '401':
          description: Authentication required
        '404':
          description: Plugin not found

  /plugins/{id}/actions:
    get:
      tags: [Plugins]
      summary: Get the action catalog a plugin serves
      description: >-
        Returns the executable actions (single-device actions + multi-device
        intents, each with an input schema) the plugin declared in its /discover
        endpoint. Drives plan creation: the webapp renders intent/step forms
        from this catalog and the API validates plan step inputs against it.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Action catalog entries
          content:
            application/json:
              schema:
                type: object
                required: [pluginId, actions]
                properties:
                  pluginId: { type: string }
                  actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogEntry'
        '401':
          description: Authentication required
        '404':
          description: Plugin not found

  /plugins/{id}/actions/execute:
    post:
      tags: [Plugins]
      summary: Run one single-device READ action against a device's assignment
      description: >-
        The "peek" path for pages that need live appliance data without creating
        a plan (e.g. the Containers page reading a custom app's current compose
        YAML before editing it). ONLY catalog entries with riskLevel `read` may be
        executed here — write/dangerous actions MUST flow through the plan workflow
        (2FA + audit trail), so this route can never mutate a device. The read-only
        restriction is enforced against the persisted catalog, not the caller's claim.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, actionId]
              properties:
                deviceId: { type: string }
                actionId: { type: string }
                input: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The action's result details (e.g. the compose YAML)
          content:
            application/json:
              schema:
                type: object
                required: [details]
                properties:
                  details: { type: object, additionalProperties: true }
        '400':
          description: Missing fields or unknown single-device action
        '401':
          description: Authentication required
        '403':
          description: Action is not a read action (must use the plan workflow)
        '404':
          description: Plugin not found
        '409':
          description: The plugin reported the action failed (e.g. no editable compose)
        '502':
          description: Device/assignment/plugin missing or dispatch failed

  /plugins/{id}/options:
    get:
      tags: [Plugins]
      summary: Get a plugin's option descriptors and current settings
      description: >-
        Returns the typed option descriptors the plugin declared in its
        /discover endpoint, plus the stored overrides (`values`) and the
        effective values (defaults merged with overrides) that the webapp
        should initialize its form to. Works even when the plugin is offline —
        everything is served from the API's cache of the discovery response.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Option descriptors + settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '401':
          description: Authentication required
        '404':
          description: Plugin not found

  /plugins/{id}/settings:
    put:
      tags: [Plugins]
      summary: Save a plugin's settings (validated against its descriptors)
      description: >-
        Persists user-set values for the named options. Every value is
        validated by the API against the plugin's descriptor (type, regex
        pattern, min/max). The request is all-or-nothing: if any value is
        invalid nothing is written and a 400 with per-field errors is returned.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties: true
                  description: "Map of option key -> value (string | integer | boolean)"
      responses:
        '200':
          description: Saved; returns the updated options view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '400':
          description: One or more values failed validation
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  fieldErrors:
                    type: object
                    additionalProperties: { type: string }
        '401':
          description: Authentication required
        '403':
          description: Missing plugins:manage permission
        '404':
          description: Plugin not found

    delete:
      tags: [Plugins]
      summary: Reset a plugin's settings to their defaults
      description: >-
        Deletes all stored overrides for the plugin so every option falls back
        to its declared default value.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reset; returns the options view (values now empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOptions'
        '401':
          description: Authentication required
        '403':
          description: Missing plugins:manage permission
        '404':
          description: Plugin not found

  /devices/{deviceId}/telemetry:
    get:
      tags: [Devices]
      summary: Get recent telemetry history for a device
      description: >-
        Returns the most recent telemetry samples (oldest → newest) for a
        device. Used to render 'plot' metrics over time.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 30, maximum: 200 }
      responses:
        '200':
          description: Telemetry history
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, history]
                properties:
                  deviceId: { type: string }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        collectedAt: { type: string, format: date-time }
                        health: { type: string }
                        pluginId: { type: string, description: "Which plugin produced this sample" }
                        metrics:
                          type: object
                          additionalProperties: true
        '401':
          description: Authentication required
        '404':
          description: Device not found

  /secrets/{id}:
    get:
      tags: [Secrets]
      summary: Get a secret's decrypted fields (for editing)
      description: >-
        Retrieves the secret's decrypted field values, routed to the provider
        that created it. Used by the edit form — never served from cache so an
        editor always sees current values. Requires `secrets:read`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Decrypted secret fields
          content:
            application/json:
              schema:
                type: object
                required: [type, fields]
                properties:
                  type: { type: string }
                  fields:
                    type: object
                    additionalProperties: { type: string }
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Secret not found
    patch:
      tags: [Secrets]
      summary: Update a secret's fields in place
      description: >-
        Updates the field values of an existing secret while preserving its id,
        so device assignments and plans referencing it keep working. Works for
        ALL secret types — the owning provider re-encrypts the new field map.
        `fields` is a full replacement of the type's declared fields; `label`,
        `expiresAt` and the two usage flags are optional updates (absent =
        unchanged). Requires `secrets:write` for any secret, or
        `secrets:self-write` for the caller's own secrets.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: object
                  additionalProperties: { type: string }
                  description: "Full replacement of the secret's field values (as declared by its type schema)"
                label: { type: string, nullable: true }
                expiresAt: { type: string, format: date-time, nullable: true }
                interactiveLoginAllowed: { type: boolean, description: "Allow use for interactive SSH console sessions (absent = unchanged)" }
                fileAccessAllowed: { type: boolean, description: "Allow use for SFTP file-access sessions (absent = unchanged)" }
      responses:
        '200':
          description: Secret updated (same id)
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        '400':
          description: Invalid request (missing fields)
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Secret not found
    delete:
      tags: [Secrets]
      summary: Delete a secret
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Secret deleted
        '401':
          description: Authentication required
        '403':
          description: Missing required permission
        '404':
          description: Secret not found

  /sites:
    get:
      tags: [Sites]
      summary: List all sites
      responses:
        '200':
          description: Site list (sorted by name)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
        '401':
          description: Authentication required
    post:
      tags: [Sites]
      summary: Create a site
      description: Requires permission `sites:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreateRequest'
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          description: Invalid payload (missing name or bad timezone)
        '401':
          description: Authentication required
        '403':
          description: Missing sites:write permission

  /sites/{id}:
    patch:
      tags: [Sites]
      summary: Update a site
      description: Requires permission `sites:write`. Only the provided fields are changed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteUpdateRequest'
      responses:
        '200':
          description: Updated site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          description: No updatable fields provided or a field is invalid
        '401':
          description: Authentication required
        '403':
          description: Missing sites:write permission
        '404':
          description: Site not found
    delete:
      tags: [Sites]
      summary: Delete a site
      description: >-
        Requires permission `sites:write`. Refused with 409 while any device
        still references the site.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Site deleted
        '401':
          description: Authentication required
        '403':
          description: Missing sites:write permission
        '404':
          description: Site not found
        '409':
          description: Devices still reference this site

  /layers:
    get:
      tags: [Layers]
      summary: List all network layers in band order
      description: >-
        The registry behind the topology view's horizontal bands. Seeded with
        four built-ins (core, distribution, access, endpoint); users may add
        custom ones and re-color/reorder any of them.
      responses:
        '200':
          description: Layer list (ordered by sort)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkLayer'
        '401':
          description: Authentication required
    post:
      tags: [Layers]
      summary: Create a custom layer
      description: Requires permission `layers:write`. The id is a slug of the name; new layers append after all existing ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayerCreateRequest'
      responses:
        '201':
          description: Layer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkLayer'
        '400':
          description: Invalid payload (missing name or bad color)
        '401':
          description: Authentication required
        '403':
          description: Missing layers:write permission
        '409':
          description: A layer with this name already exists

  /layers/{id}:
    patch:
      tags: [Layers]
      summary: Update a layer (name, color and/or sort)
      description: Requires permission `layers:write`. Only the provided fields are changed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayerUpdateRequest'
      responses:
        '200':
          description: Updated layer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkLayer'
        '400':
          description: No updatable fields provided or a field is invalid
        '401':
          description: Authentication required
        '403':
          description: Missing layers:write permission
        '404':
          description: Layer not found
        '409':
          description: A layer with this name already exists
    delete:
      tags: [Layers]
      summary: Delete a custom layer
      description: >-
        Requires permission `layers:write`. Built-in layers are never deletable
        (the classification heuristic references their ids); custom layers are
        refused with 409 while any device's manual override still points at them.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Layer deleted
        '401':
          description: Authentication required
        '403':
          description: Missing layers:write permission
        '404':
          description: Layer not found
        '409':
          description: Built-in layer, or devices still reference it as an override

  /networks:
    get:
      tags: [Inventory]
      summary: List all configured networks across devices
      description: >-
        Cross-device view of the normalized `networks` inventory table, populated
        by the telemetry worker from each plugin's /monitoring metrics (e.g.
        OPNsense interface IPs with CIDR + VLAN id). Every row is joined with
        the device it was collected on and the plugin instance that produced it.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
      responses:
        '200':
          description: Network rows (device + plugin identity included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkRow'
        '401':
          description: Authentication required

  /hosts:
    get:
      tags: [Inventory]
      summary: List all discovered hosts across devices
      description: >-
        Cross-device view of the normalized `hosts` inventory table, populated
        by the telemetry worker from each plugin's ARP/NDP neighbor tables and
        DHCP leases. Rows are upserted per poll; entries not refreshed within
        24h are swept away.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
        - in: query
          name: source
          required: false
          schema:
            type: string
            enum: [arp, ndp, dhcp, wlan, self]
          description: "Filter by discovery source ('self' = the appliance's own interfaces)"
      responses:
        '200':
          description: Host rows (device + plugin identity included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HostRow'
        '400':
          description: Invalid source filter value
        '401':
          description: Authentication required

  /documented-hosts:
    get:
      tags: [Inventory]
      summary: List all documented hosts (user-maintained inventory)
      description: >-
        The user-maintained host documentation — permanent records of what
        SHOULD exist on the network (DNS names, friendly name/description,
        site/layer placement, per-address documented MAC + network). Distinct
        from /hosts (live ARP/NDP/DHCP observations): every row is cross-
        referenced against the live inventory at read time and marked
        `discovered` when a matching MAC or IP was observed recently. A
        documented MAC that differs from what is currently observed for its
        address is flagged as `macMismatch`.
      parameters:
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to hosts placed at a site
      responses:
        '200':
          description: Documented host rows (with live discovery info)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentedHost'
        '401':
          description: Authentication required
    post:
      tags: [Inventory]
      summary: Create a documented host
      description: Requires permission `documented-hosts:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentedHostRequest'
      responses:
        '201':
          description: Created host (with live discovery info)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentedHost'
        '400':
          description: Invalid payload (bad DNS name / IP / MAC, unknown site or layer, empty names or ips)
        '401':
          description: Authentication required
        '403':
          description: Missing documented-hosts:write permission

  /documented-hosts/{id}:
    patch:
      tags: [Inventory]
      summary: Update a documented host
      description: >-
        Requires permission `documented-hosts:write`. Partial update — only the
        provided fields change; when `ips` is present it REPLACES the full
        address list. The merged result must be a complete valid host (at least
        one DNS name and one IP).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentedHostUpdateRequest'
      responses:
        '200':
          description: Updated host (with live discovery info)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentedHost'
        '400':
          description: Invalid payload or merged result incomplete
        '401':
          description: Authentication required
        '403':
          description: Missing documented-hosts:write permission
        '404':
          description: Documented host not found
    delete:
      tags: [Inventory]
      summary: Delete a documented host (and its addresses)
      description: Requires permission `documented-hosts:write`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Documented host deleted
        '401':
          description: Authentication required
        '403':
          description: Missing documented-hosts:write permission
        '404':
          description: Documented host not found

  /documented-hosts/bulk:
    post:
      tags: [Inventory]
      summary: Batch update for documented hosts (active/stale + site/layer)
      description: >-
        Requires permission `documented-hosts:write`. Marks every existing id
        in the batch active or stale (`isActive`) and/or sets its site/layer
        placement (`siteId` / `layerId`, null clears) — all in one call. Omitted
        fields are left untouched; unknown ids are reported in `missing` and
        never abort the call. At most 5000 ids per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: { type: string }
                  description: "Documented host ids to update"
                isActive:
                  type: boolean
                  description: "true = mark active, false = mark stale (omitted = no flag change)"
                siteId:
                  type: [string, 'null']
                  description: "Site id to assign to every row in the batch; null clears the placement. Must exist when set (omitted = no change)"
                layerId:
                  type: [string, 'null']
                  description: "Topology-layer id to assign to every row in the batch; null clears the placement. Must exist when set (omitted = no change)"
      responses:
        '200':
          description: Update summary
          content:
            application/json:
              schema:
                type: object
                required: [updated, missing]
                properties:
                  updated: { type: integer, description: "Hosts whose flag was changed" }
                  missing:
                    type: array
                    items: { type: string }
                    description: "Submitted ids that do not exist"
        '400':
          description: Empty batch or more than 5000 ids
        '401':
          description: Authentication required
        '403':
          description: Missing documented-hosts:write permission

  /documented-hosts/merge:
    post:
      tags: [Inventory]
      summary: Merge several documented host rows into one
      description: >-
        Requires permission `documented-hosts:write`. Merges a set of
        documented hosts (e.g. duplicates created when a multi-NIC machine was
        imported once per MAC) into a SINGLE row: addresses are unioned with
        per-address user data preserved, DNS names and friendly name/description
        merged, tags unioned, site/layer taken from the first row that has one,
        and the host stays active when ANY input row is active. The surviving row is the
        OLDEST by createdAt — its id and createdAt are kept; all other rows are
        deleted. Returns the merged host plus the removed ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 2
                  maxItems: 5000
                  items: { type: string }
                  description: "Documented host ids to merge (oldest survives)"
      responses:
        '200':
          description: The merged host + removed row ids
          content:
            application/json:
              schema:
                type: object
                required: [merged, removed, count]
                properties:
                  merged:
                    $ref: '#/components/schemas/DocumentedHost'
                  removed:
                    type: array
                    items: { type: string }
                    description: "Ids of the rows that were deleted"
                  count: { type: integer, description: "Number of rows that were merged" }
        '400':
          description: Fewer than 2 ids, more than 5000 ids, or unknown ids
        '401':
          description: Authentication required
        '403':
          description: Missing documented-hosts:write permission

  /documented-hosts/import:
    post:
      tags: [Inventory]
      summary: Bulk-import documented hosts (CSV import backend)
      description: >-
        Requires permission `documented-hosts:write`. The webapp parses the CSV
        client-side with a flexible header mapping and sends already-structured
        rows; this endpoint only validates + upserts. Rows are validated
        independently — one bad row never aborts the batch (per-row errors come
        back in `errors`). Matching against existing hosts is by DNS name
        (`matchBy: dns`, default) or documented MAC (`matchBy: mac`); matched
        rows are updated in place when `updateExisting` is true, otherwise
        skipped. At most 5000 rows per batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hosts]
              properties:
                hosts:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    $ref: '#/components/schemas/DocumentedHostRequest'
                matchBy:
                  type: string
                  enum: [dns, mac]
                  default: dns
                  description: "How to match rows against existing hosts"
                updateExisting:
                  type: boolean
                  default: true
                  description: "Update matched hosts in place (false = skip them)"
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentedHostImportResult'
        '400':
          description: Empty batch or more than 5000 rows
        '401':
          description: Authentication required
        '403':
          description: Missing documented-hosts:write permission

  /documented-hosts/import-from-inventory:
    post:
      tags: [Inventory]
      summary: Import the live host inventory into the documented hosts
      description: >-
        Requires permission `documented-hosts:write`. Copies the observed
        hosts (the same data as GET /hosts) into the user-maintained
        documented-hosts table. The merge is ADDITIVE and never loses user
        data: existing DNS names, friendly name, description, site/layer
        placement are preserved; new addresses/MACs/network references from
        the observation are added to the host's address list (hosts match by
        MAC first, then by shared address). A host that is ALSO known in the
        device inventory inherits its site/layer/tags from the observing
        device — gaps only: an existing host keeps its user values and only
        gains what it lacks. `dryRun` defaults to true — it returns a per-host
        plan (create/update/skip + reason) without writing anything; pass
        `dryRun: false` to apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentedHostInventoryImportRequest'
      responses:
        '200':
          description: Import plan (dry run) or applied summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentedHostInventoryImportResult'
        '401':
          description: Authentication required
        '403':
          description: Missing documented-hosts:write permission

  /documented-networks:
    get:
      tags: [Inventory]
      summary: List all documented networks (user-maintained inventory)
      description: >-
        The user-maintained network documentation — permanent records of what
        SHOULD exist on the network (name, subnets, VLAN, gateways, DNS servers,
        site/layer placement). Distinct from /networks (live interface
        observations): every row is cross-referenced against the live logical-
        network inventory at read time and marked `discovered` when a matching
        name, CIDR containment, or VLAN id was observed recently.
      parameters:
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to networks placed at a site
      responses:
        '200':
          description: Documented network rows (with live discovery info)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentedNetwork'
        '401':
          description: Authentication required
    post:
      tags: [Inventory]
      summary: Create a documented network
      description: Requires permission `documented-networks:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentedNetworkRequest'
      responses:
        '201':
          description: Created network (with live discovery info)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentedNetwork'
        '400':
          description: Invalid payload (bad name / CIDR / IP, unknown site or layer)
        '401':
          description: Authentication required
        '403':
          description: Missing documented-networks:write permission
        '409':
          description: Name already used, or subnet range overlaps an existing network

  /documented-networks/{id}:
    patch:
      tags: [Inventory]
      summary: Update a documented network
      description: >-
        Requires permission `documented-networks:write`. Partial update — only the
        provided fields change; when `subnets`/`gateways`/`dnsServers` are present
        they REPLACE the full list. The merged result must be a complete valid row
        (a non-empty name).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentedNetworkUpdateRequest'
      responses:
        '200':
          description: Updated network (with live discovery info)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentedNetwork'
        '400':
          description: Invalid payload or merged result incomplete
        '401':
          description: Authentication required
        '403':
          description: Missing documented-networks:write permission
        '404':
          description: Documented network not found
        '409':
          description: Name or subnet range already used by another network
    delete:
      tags: [Inventory]
      summary: Delete a documented network
      description: Requires permission `documented-networks:write`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Documented network deleted
        '401':
          description: Authentication required
        '403':
          description: Missing documented-networks:write permission
        '404':
          description: Documented network not found

  /documented-networks/bulk:
    post:
      tags: [Inventory]
      summary: Batch update for documented networks (active/stale + site/layer)
      description: >-
        Requires permission `documented-networks:write`. Marks every existing id
        in the batch active or stale (`isActive`) and/or sets its site/layer
        placement (`siteId` / `layerId`, null clears) — all in one call. Omitted
        fields are left untouched; unknown ids are reported in `missing` and
        never abort the call. At most 5000 ids per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: { type: string }
                  description: "Documented network ids to update"
                isActive:
                  type: boolean
                  description: "true = mark active, false = mark stale (omitted = no flag change)"
                siteId:
                  type: [string, 'null']
                  description: "Site id to assign to every row in the batch; null clears the placement. Must exist when set (omitted = no change)"
                layerId:
                  type: [string, 'null']
                  description: "Topology-layer id to assign to every row in the batch; null clears the placement. Must exist when set (omitted = no change)"
      responses:
        '200':
          description: Update summary
          content:
            application/json:
              schema:
                type: object
                required: [updated, missing]
                properties:
                  updated: { type: integer, description: "Networks whose flag was changed" }
                  missing:
                    type: array
                    items: { type: string }
                    description: "Submitted ids that do not exist"
        '400':
          description: Empty batch or more than 5000 ids
        '401':
          description: Authentication required
        '403':
          description: Missing documented-networks:write permission

  /documented-networks/merge:
    post:
      tags: [Inventory]
      summary: Merge several documented network rows into one
      description: >-
        Requires permission `documented-networks:write`. Merges a set of
        documented networks (e.g. duplicates created when the same subnet range
        was imported under different names) into a SINGLE row: subnets, gateways
        and DNS servers are unioned + deduped, name/friendly name/description/
        site/layer taken from the first row that has one, tags unioned, and the
        network stays active when ANY input row is active. The surviving row is
        the OLDEST by createdAt — its id and createdAt are kept; all other rows
        are deleted. Returns the merged network plus the removed ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 2
                  maxItems: 5000
                  items: { type: string }
                  description: "Documented network ids to merge (oldest survives)"
      responses:
        '200':
          description: The merged network + removed row ids
          content:
            application/json:
              schema:
                type: object
                required: [merged, removed, count]
                properties:
                  merged:
                    $ref: '#/components/schemas/DocumentedNetwork'
                  removed:
                    type: array
                    items: { type: string }
                    description: "Ids of the rows that were deleted"
                  count: { type: integer, description: "Number of rows that were merged" }
        '400':
          description: Fewer than 2 ids, more than 5000 ids, or unknown ids
        '401':
          description: Authentication required
        '403':
          description: Missing documented-networks:write permission

  /documented-networks/import:
    post:
      tags: [Inventory]
      summary: Bulk-import documented networks (CSV import backend)
      description: >-
        Requires permission `documented-networks:write`. The webapp parses the CSV
        client-side with a flexible header mapping and sends already-structured
        rows; this endpoint only validates + upserts. Rows are validated
        independently — one bad row never aborts the batch (per-row errors come
        back in `errors`). Matching against existing networks is by name
        (`matchBy: name`, default) or subnet overlap (`matchBy: subnet`); matched
        rows are updated in place when `updateExisting` is true, otherwise
        skipped. At most 5000 rows per batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [networks]
              properties:
                networks:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    $ref: '#/components/schemas/DocumentedNetworkRequest'
                matchBy:
                  type: string
                  enum: [name, subnet]
                  default: name
                  description: "How to match rows against existing networks"
                updateExisting:
                  type: boolean
                  default: true
                  description: "Update matched networks in place (false = skip them)"
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentedNetworkImportResult'
        '400':
          description: Empty batch or more than 5000 rows
        '401':
          description: Authentication required
        '403':
          description: Missing documented-networks:write permission

  /documented-networks/import-from-inventory:
    post:
      tags: [Inventory]
      summary: Import the live network inventory into the documented networks
      description: >-
        Requires permission `documented-networks:write`. Copies the observed
        logical networks (the same data as GET /networks) into the user-maintained
        documented-networks table. The merge is ADDITIVE and never loses user
        data: existing name, subnets, gateways, DNS servers, description, site/layer
        placement are preserved; new subnets/VLAN ids from the observation are added
        (networks match by name first, then by subnet overlap). `dryRun` defaults to
        true — it returns a per-network plan (create/update/skip + reason) without
        writing anything; pass `dryRun: false` to apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentedNetworkInventoryImportRequest'
      responses:
        '200':
          description: Import plan (dry run) or applied summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentedNetworkInventoryImportResult'
        '401':
          description: Authentication required
        '403':
          description: Missing documented-networks:write permission

  /topology:
    get:
      tags: [Inventory]
      summary: Compute the physical + logical network topology graph
      description: >-
        Server-side computed device graph for the Topology page. Nodes are
        devices, logical segments (merged networks/VLANs) and — when requested
        via `includeHosts` — end-hosts. Edges are inferred physical cables
        (`via: mac-table` from switch MAC tables / ARP observations,
        `via: lacp` from LACP partner data), overlay tunnels, and segment
        memberships. Cable edges carry the VLANs traversing the observing port
        so trunk ports can be drawn with one colored line per VLAN.
      parameters:
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
        - in: query
          name: includeHosts
          required: false
          schema: { type: boolean }
          description: "Add end-host nodes (ARP/MAC-table entries) to the logical segments; capped per segment"
      responses:
        '200':
          description: Topology graph (nodes + edges)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyResponse'
        '401':
          description: Authentication required

  /tunnels:
    get:
      tags: [Inventory]
      summary: List all configured tunnels across devices
      description: >-
        Cross-device view of the normalized `tunnels` inventory table, populated
        by the telemetry worker from each plugin's /monitoring metrics (e.g.
        OPNsense WireGuard/OpenVPN/IPsec/PPPoE/GRE configurations and LANCOM
        LCOS IPsec connections). One row per tunnel on one device — no merging;
        devices without tunnels contribute no rows. Rows not refreshed within
        24h are swept away.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [wireguard, openvpn, ipsec, pppoe, gre]
          description: Filter by tunnel type
      responses:
        '200':
          description: Tunnel rows (device + plugin identity included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TunnelRow'
        '400':
          description: Invalid type filter value
        '401':
          description: Authentication required

  /updates:
    get:
      tags: [Updates]
      summary: Cross-device update center (device updates + stack self-update)
      description: >-
        Two payloads in one response. `rows` is the cross-device view of the
        normalized `device_updates` inventory table, populated by the telemetry
        worker from each plugin's /monitoring `updates[]` metric — plugins opt
        in via capability 'updates' (firmware, OS packages over SSH package
        managers, Docker images/apps). Only genuinely available updates are
        persisted; an applied update vanishes on the next inventory poll. Each
        row may carry applyActionId/applyInput pointing at the reporting
        plugin's action catalog — applying is always a plan (configs:apply +
        2FA), never a direct call. `stack` is the "UNM itself" card: running API
        version, discovered plugin versions, and a feed-based latest-version
        check when the updateFeedUrl system setting is configured.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
        - in: query
          name: kind
          required: false
          schema:
            type: string
            enum: [firmware, os-package, docker-image, app]
          description: Filter by update kind
      responses:
        '200':
          description: Update rows + stack self-update info (device + plugin identity included)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatesResponse'
        '400':
          description: Invalid kind filter value
        '401':
          description: Authentication required

  /certificates:
    get:
      tags: [Inventory]
      summary: List all certificate endpoints across devices
      description: >-
        Cross-device view of the normalized `certificates` inventory table, populated
        by the telemetry worker from each plugin's /monitoring metrics. One row per
        endpoint on one device — the management HTTPS certificate (type https) and/or
        the SSH host key presented on port 22 (type ssh). Rows carry issuer,
        validity window, key algorithm/size, SAN names and a real chain-validation
        verdict (an expired ISSUER invalidates the row even when the leaf is still
        nominally valid). Rows not refreshed within 24h are swept away.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [https, ssh]
          description: Filter by endpoint kind (TLS cert vs. SSH host key)
      responses:
        '200':
          description: Certificate rows (device + plugin identity included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificateRow'
        '400':
          description: Invalid type filter value
        '401':
          description: Authentication required

  /certificates/history:
    get:
      tags: [Inventory]
      summary: Fingerprint history of one certificate endpoint
      description: >-
        Append-only audit trail for ONE endpoint (deviceId + name): every distinct
        fingerprint ever observed on it, with the cert metadata as of that
        observation and its first/last-seen window. Newest first. Powers the
        "certificate changed" view — a re-keyed or swapped key stays auditable even
        after it is accepted or rolled back.
      parameters:
        - in: query
          name: deviceId
          required: true
          schema: { type: string }
        - in: query
          name: name
          required: true
          schema: { type: string, description: "Endpoint identity (e.g. https:443, ssh:22)" }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: History rows (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificateHistoryRow'
        '400':
          description: Missing deviceId or name
        '401':
          description: Authentication required

  /certificates/accept:
    post:
      tags: [Inventory]
      summary: Accept the observed key of an endpoint as trusted (re-pin)
      description: >-
        Explicit user action that clears a "certificate changed" condition after a
        legitimate re-key: sets the endpoint's trustedFingerprint to the CURRENTLY
        OBSERVED fingerprint. Pass `fingerprint` in the body to pin a previously-seen
        key from history instead (must match a history row). Requires certificates:write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, name]
              properties:
                deviceId: { type: string }
                name: { type: string, description: "Endpoint identity (e.g. https:443, ssh:22)" }
                fingerprint: { type: string, description: "Optional — pin this previously-seen key instead of the currently observed one" }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deviceId: { type: string }
                  name: { type: string }
                  trustedFingerprint: { type: string }
        '400':
          description: Missing fields or fingerprint not in history
        '401':
          description: Authentication required
        '403':
          description: No access to this device (device scope)
        '404':
          description: Endpoint not found on the device
        '409':
          description: No fingerprint observed yet — nothing to accept

  /routes:
    get:
      tags: [Inventory]
      summary: List all route entries across devices
      description: >-
        Cross-device view of the normalized `routes` inventory table, populated
        by the telemetry worker from each plugin's /monitoring metrics (e.g.
        OPNsense static routes with live gateway status, LANCOM LCOS active
        routing tables — static + OSPF/BGP/RIP rows protocol-labeled per row —
        and LANCOM SX switch routing tables). One row per route entry on one
        device; static and dynamically-learned routes to the same destination
        appear as separate rows (protocol is part of the identity). Devices
        without routing data contribute no rows. Rows not refreshed within 24h
        are swept away.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
        - in: query
          name: protocol
          required: false
          schema:
            type: string
            enum: [static, connected, ospf, bgp, rip, other]
          description: Filter by route protocol
      responses:
        '200':
          description: Route rows (device + plugin identity included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteRow'
        '400':
          description: Invalid protocol filter value
        '401':
          description: Authentication required

  /firewall-rules:
    get:
      tags: [Inventory]
      summary: List all firewall rules across devices (filter + NAT)
      description: >-
        Cross-device view of the normalized `firewall_rules` inventory table,
        populated by the telemetry worker from each plugin's /monitoring
        metrics (`firewallRules[]`). Vendors normalize to one unified shape at
        collection time — OPNsense filter rules plus its four NAT rule sets
        (d_nat/source_nat/one_to_one/npt) and RouterOS firewall filter + nat
        chains — so both vendors share the same columns; vendor-specific fields
        live in `extra`. One row per rule on one device, no merging. Rows not
        refreshed within 24h are swept away.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
        - in: query
          name: ruleType
          required: false
          schema:
            type: string
            enum: [filter, dnat, snat, one-to-one, npt]
          description: Filter by rule kind (filter rules vs. NAT kinds)
      responses:
        '200':
          description: Firewall rule rows (device + plugin identity included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FirewallRuleRow'
        '400':
          description: Invalid ruleType filter value
        '401':
          description: Authentication required

  /wifi:
    get:
      tags: [Inventory]
      summary: Cross-device WiFi overview (SSIDs grouped by name)
      description: >-
        Groups the normalized `wifi_ssids` inventory rows by SSID name across all
        devices and joins per-channel airtime utilization (`wifi_channels`) with
        connected-client counts (`wifi_clients`). Populated by the telemetry
        worker from each plugin's /monitoring metrics (LANCOM LX APs and LCOS
        routers with built-in radios). Also returns a per-band entry list for
        the spectrum view. Rows not refreshed within 24h are swept away.
      parameters:
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
      responses:
        '200':
          description: WiFi overview (grouped SSIDs + per-band spectrum entries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WifiOverview'
        '401':
          description: Authentication required

  /storage:
    get:
      tags: [Inventory]
      summary: Cross-device storage overview (filesystems + physical disks)
      description: >-
        Returns the normalized `storage_filesystems` rows (ZFS pools & datasets,
        ext4/squashfs root filesystems, USB storage) and `storage_disks` rows
        (physical disks / flash media with model, serial, capacity, pool
        membership), both populated by the telemetry worker from each plugin's
        /monitoring metrics (`filesystems[]` + `disks[]`). One row per
        filesystem/disk on one device — no merging; devices without storage data
        contribute no rows. Rows not refreshed within 24h are swept away.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
      responses:
        '200':
          description: Storage overview (filesystems + disks, device + plugin identity included)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageOverview'
        '401':
          description: Authentication required

  /shares:
    get:
      tags: [Inventory]
      summary: Cross-device file-share overview (Shares page)
      description: >-
        Returns the normalized `shares` rows (SMB/CIFS, NFS, iSCSI and NVMe-oF
        exports), populated by the telemetry worker from each plugin's /monitoring
        metrics (`shares[]`), with device + plugin views joined — plus the live
        `share_sessions` rows (active CIFS/SMB + NFS client connections) for the
        page's bottom panel. One row per share/session on one device — no merging;
        devices without share data contribute no rows. Shares are managed through
        the plan/config workflow (configs:apply); this route is read-only and gated
        on `shares:read`. Rows not refreshed within 24h are swept away.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
      responses:
        '200':
          description: Share exports + live client sessions (device + plugin identity included)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharesOverview'
        '401':
          description: Authentication required

  /containers:
    get:
      tags: [Inventory]
      summary: Cross-device container/App overview (Containers page)
      description: >-
        Returns the normalized `containers` rows (TrueNAS SCALE Apps today; any
        plugin may emit the generic `containers[]` metric), populated by the
        telemetry worker from each plugin's /monitoring metrics, plus the
        normalized `docker_images` rows (any plugin may emit the generic
        `images[]` metric) for the page's collapsible images panel. One row per
        app/image on one device — no merging; devices without container or image
        data contribute no rows. The containers `extra` object carries networks[],
        ips[], ports[] and per-service detail for expandable rows. Rows not
        refreshed within 24h are swept away.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
      responses:
        '200':
          description: Container overview (device + plugin identity included)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainersOverview'
        '401':
          description: Authentication required

  /device-time:
    get:
      tags: [Inventory]
      summary: Cross-device clock overview (Time page)
      description: >-
        For every device, reads its latest clock readings from the dedicated
        `device_times` table and computes drift against UNM's own clock. Two
        independent kinds of time are merged per device: (1) the SYSTEM wall
        clock (`system.deviceTime`, emitted by plugins that can read a wall clock
        — OPNsense, TrueNAS, RouterOS, OpenWrt, LANCOM SX/LCOS) → localIso/
        timezone/driftMs; and (2) the NTP-SERVED time (`system.ntpServed`, emitted
        by the generic-ntp plugin) → ntpTimeUtc/ntpStratum/ntpReferenceId/
        ntpDriftMs — the instant the device transmits to its clients, which can
        differ from its own system clock. Drift is timezone-aware: devices keep
        their OWN zone; the API only normalizes to an absolute instant (epoch ms)
        for comparison, never forcing UTC. `available` / `ntpAvailable` are false
        when no reading of that kind exists — those devices still appear so the
        page shows which boxes are covered. Gated on `time:read`.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
      responses:
        '200':
          description: Every device with its local time + drift vs UNM's own clock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTimeOverview'
        '401':
          description: Authentication required

  /vms:
    get:
      tags: [Inventory]
      summary: Cross-device virtual machine overview (VMs page)
      description: >-
        Returns the normalized `vms` rows (TrueNAS SCALE VMs today; any plugin
        may emit the generic `vms[]` metric — e.g. a future Proxmox plugin),
        populated by the telemetry worker from each plugin's /monitoring
        metrics. One row per VM on one device — no merging; devices without VM
        data contribute no rows. The `extra` object carries nics[] {mac, type?,
        nicAttach?}, disks[], description and other plugin-specific detail for
        expandable rows (NICs render as child rows under the parent). Rows not
        refreshed within 24h are swept away.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: siteId
          required: false
          schema: { type: string }
          description: Filter to devices belonging to a site
      responses:
        '200':
          description: VM overview (device + plugin identity included)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmsOverview'
        '401':
          description: Authentication required

  /logs:
    get:
      tags: [Logs]
      summary: List plugin log entries (global view)
      description: >-
        Structured log entries pushed by plugins via the internal POST
        /plugin/logs endpoint. Powers the global Logs page and the per-device
        Logs section in DeviceDetail (same route with a fixed deviceId).
        Requires permission `logs:read` — logs can carry critical details
        (endpoints, error payloads). Rows are kept for LOG_RETENTION_DAYS
        (default 7) and then swept away. Newest first.
      parameters:
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: pluginId
          required: false
          schema: { type: string }
          description: Filter to one plugin instance
        - in: query
          name: level
          required: false
          schema:
            type: string
            enum: [debug, info, warn, error]
          description: "Filter by level (comma list allowed, e.g. 'warn,error')"
        - in: query
          name: search
          required: false
          schema: { type: string }
          description: Case-insensitive substring match on message and context
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
          description: Inclusive lower bound (ISO-8601)
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
          description: Exclusive upper bound (ISO-8601)
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 500, maximum: 2000 }
          description: Max rows to return (default 500, hard cap 2000)
      responses:
        '200':
          description: Log entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
        '400':
          description: Invalid level filter value
        '401':
          description: Authentication required
        '403':
          description: Missing logs:read permission

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications (newest first)
      description: >-
        Notification center rows with optional filters. `status` defaults to
        open,acknowledged; pass e.g. status=open,acknowledged,resolved,closed
        for the full history. `all=true` ignores the caller's personal
        visibility prefs (the Notifications page uses it); without it only
        severities allowed by the user's prefs are returned. Requires
        permission `notifications:read`.
      parameters:
        - in: query
          name: status
          required: false
          allowReserved: true
          schema: { type: string }
          description: "Comma list of open,acknowledged,resolved,closed (default 'open,acknowledged')"
        - in: query
          name: severity
          required: false
          allowReserved: true
          schema: { type: string }
          description: "Comma list of info,warning,critical"
        - in: query
          name: source
          required: false
          allowReserved: true
          schema: { type: string }
          description: "Comma list of system,device,plugin"
        - in: query
          name: deviceId
          required: false
          schema: { type: string }
          description: Filter to one device
        - in: query
          name: pluginId
          required: false
          schema: { type: string }
          description: Filter to one plugin instance
        - in: query
          name: search
          required: false
          schema: { type: string }
          description: Case-insensitive substring match on title and message
        - in: query
          name: all
          required: false
          schema: { type: boolean }
          description: "true = ignore personal visibility prefs (full history)"
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 200, maximum: 500 }
          description: Max rows to return (default 200, hard cap 500)
      responses:
        '200':
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          description: Authentication required
        '403':
          description: Missing notifications:read permission

  /notifications/count:
    get:
      tags: [Notifications]
      summary: Count open notifications visible to the caller (bell badge)
      responses:
        '200':
          description: Open count after applying the caller's visibility prefs
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
        '401':
          description: Authentication required
        '403':
          description: Missing notifications:read permission

  /notifications/ack:
    post:
      tags: [Notifications]
      summary: Acknowledge notifications (seen — leaves the list, drops out of the badge)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
                  description: Notification ids to acknowledge (max 500)
                all:
                  type: boolean
                  description: true = acknowledge every currently-open notification
      responses:
        '200':
          description: Number of rows acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [acknowledged]
                properties:
                  acknowledged: { type: integer }
        '400':
          description: Neither ids nor all:true provided
        '401':
          description: Authentication required
        '403':
          description: Missing notifications:read permission

  /notifications/close:
    post:
      tags: [Notifications]
      summary: Close (dismiss) notifications from view
      description: >-
        Dismisses the given rows locally. With `propagate: true`, plugin-source
        rows that mirror appliance alerts (e.g. TrueNAS alert.list entries,
        dedupe key `plugin:<pluginId>:<key>`) additionally dismiss the
        underlying alert on the appliance via its `alerts.dismiss` action —
        best-effort and non-blocking; a failed dispatch never fails the close.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  description: Notification ids to close (max 500)
                propagate:
                  type: boolean
                  default: false
                  description: Also dismiss mirrored appliance alerts on the device(s)
      responses:
        '200':
          description: Number of rows closed
          content:
            application/json:
              schema:
                type: object
                required: [closed]
                properties:
                  closed: { type: integer }
        '400':
          description: ids array missing or empty
        '401':
          description: Authentication required
        '403':
          description: Missing notifications:read permission

  /notifications/resolve:
    post:
      tags: [Notifications]
      summary: Resolve notifications in bulk (condition fixed/cleared)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  description: Notification ids to resolve (max 500)
      responses:
        '200':
          description: Number of rows resolved
          content:
            application/json:
              schema:
                type: object
                required: [resolved]
                properties:
                  resolved: { type: integer }
        '400':
          description: ids array missing or empty
        '401':
          description: Authentication required
        '403':
          description: Missing notifications:read permission

  /notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Resolve one notification (condition fixed/cleared)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resolved (no-op when already terminal)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401':
          description: Authentication required
        '403':
          description: Missing notifications:read permission

  /notifications/prefs:
    get:
      tags: [Notifications]
      summary: Get the caller's notification visibility prefs
      responses:
        '200':
          description: Per-source severity allow-lists (defaults when never set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPrefs'
        '401':
          description: Authentication required
        '403':
          description: Missing notifications:read permission
    put:
      tags: [Notifications]
      summary: Update the caller's notification visibility prefs
      description: >-
        Fine-grained control over which notifications show up in the bell and
        panel. Omitting a source shows everything for that source; an empty
        list hides it entirely. Requires `notifications:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                      enum: [info, warning, critical]
      responses:
        '200':
          description: The stored (normalized) prefs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPrefs'
        '400':
          description: Malformed body
        '401':
          description: Authentication required
        '403':
          description: Missing notifications:write permission

  /users:
    get:
      tags: [Users]
      summary: List all users
      description: Requires permission `users:read`. Never exposes password hashes or TOTP secrets.
      responses:
        '200':
          description: User list (sorted by username)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Authentication required
        '403':
          description: Missing users:read permission
    post:
      tags: [Users]
      summary: Create a user
      description: >-
        Requires permission `users:create`. Creates the account with an initial
        password and a fresh TOTP secret; the response carries the enrollment
        payload (secret + otpauth URI) for QR-code setup in an authenticator app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created (with TOTP enrollment payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '400':
          description: Invalid payload or unknown role/permission id
        '401':
          description: Authentication required
        '403':
          description: Missing users:create permission
        '409':
          description: Username already taken

  /users/{id}:
    patch:
      tags: [Users]
      summary: Update a user's roles and permissions
      description: >-
        Requires permission `users:write`. Only the provided fields are changed.
        Refused with 409 when it would remove the admin role from the last admin.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: No updatable fields provided or a field is invalid
        '401':
          description: Authentication required
        '403':
          description: Missing users:write permission
        '404':
          description: User not found
        '409':
          description: Would remove the last admin, or demote the initial admin user
    delete:
      tags: [Users]
      summary: Delete a user
      description: >-
        Requires permission `users:write`. Refused with 409 for self-delete,
        when deleting the last admin, or when deleting the initial admin user.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: User deleted
        '401':
          description: Authentication required
        '403':
          description: Missing users:write permission
        '404':
          description: User not found
        '409':
          description: Self-delete, last admin, or initial admin user

  /users/{id}/password:
    post:
      tags: [Users]
      summary: Reset a user's password
      description: >-
        Changing your own password requires `users:self-credentials` and the
        current password; resetting another user's password requires
        `users:manage-credentials`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid payload (short password, missing currentPassword for self)
        '401':
          description: Authentication required or wrong current password
        '403':
          description: Missing users:self-credentials / users:manage-credentials permission
        '404':
          description: User not found

  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Enable or disable a user account
      description: >-
        Requires `users:write`. Disabling is the manual counterpart to the
        inactivity auto-disable sweep: a disabled user is rejected at login and
        their live sessions terminate. The initial seeded admin can never be
        disabled (409).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: "disabled must be a boolean"
        '401':
          description: Authentication required
        '403':
          description: Missing users:write permission
        '404':
          description: User not found
        '409':
          description: The initial admin user cannot be disabled

  /users/{id}/totp/enroll:
    post:
      tags: [Users]
      summary: (Re-)enroll TOTP for a user
      description: >-
        Self requires `users:self-credentials`; another user requires
        `users:manage-credentials`. Generates and persists a FRESH secret
        immediately; the response carries it plus an otpauth URI for QR-code
        setup. Re-enrolling invalidates any previous authenticator entry.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: TOTP enrolled (with enrollment payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollmentResponse'
        '401':
          description: Authentication required
        '403':
          description: Missing users:self-credentials / users:manage-credentials permission
        '404':
          description: User not found

  /users/{id}/totp:
    delete:
      tags: [Users]
      summary: Disable TOTP for a user
      description: >-
        Self requires `users:self-credentials`; another user requires
        `users:manage-credentials`. Clears the stored TOTP secret.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: TOTP disabled
        '401':
          description: Authentication required
        '403':
          description: Missing users:self-credentials / users:manage-credentials permission
        '404':
          description: User not found

  # --- Passkeys (WebAuthn) — multiple per user, one row per device ----------

  /users/{id}/passkeys:
    get:
      tags: [Users]
      summary: List a user's enrolled passkeys
      description: >-
        Self requires `users:self-credentials`; another user requires
        `users:manage-credentials`. Returns display metadata only (no key material).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Passkey list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PasskeyCredential' }
        '401':
          description: Authentication required
        '403':
          description: Missing users:self-credentials / users:manage-credentials permission
    post:
      tags: [Users]
      summary: Start passkey enrollment (fetch registration options)
      description: >-
        Self requires `users:self-credentials`; another user requires
        `users:manage-credentials`. Returns WebAuthn registration options for
        navigator.credentials.create() plus the nonce to echo back on completion.
        Already-enrolled credentials are excluded so each device gets a new one.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Registration options + nonce
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnRegistrationOptionsResponse' }
        '401':
          description: Authentication required
        '403':
          description: Missing users:self-credentials / users:manage-credentials permission
        '404':
          description: User not found

  /users/{id}/passkeys/verify:
    post:
      tags: [Users]
      summary: Complete passkey enrollment (verify attestation)
      description: >-
        Self requires `users:self-credentials`; another user requires
        `users:manage-credentials`. Verifies the browser's creation response
        against the nonce from /users/{id}/passkeys and stores the credential.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce, response]
              properties:
                nonce: { type: string }
                # PublicKeyCredentialCreationResponse from the browser.
                response: { type: object }
                label: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Passkey enrolled
          content:
            application/json:
              schema:
                type: object
                required: [credential]
                properties:
                  credential: { $ref: '#/components/schemas/PasskeyCredential' }
        '400':
          description: Missing nonce or response
        '401':
          description: Authentication required or attestation verification failed
        '403':
          description: Missing users:self-credentials / users:manage-credentials permission
        '404':
          description: User not found
        '409':
          description: This passkey is already enrolled

  /users/{id}/passkeys/{credentialId}:
    delete:
      tags: [Users]
      summary: Remove a passkey from a user
      description: >-
        Self requires `users:self-credentials`; another user requires
        `users:manage-credentials`. Scoped by BOTH user and credential id — an
        admin can revoke any device of any user. The device stops working immediately.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: credentialId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Passkey removed
        '401':
          description: Authentication required
        '403':
          description: Missing users:self-credentials / users:manage-credentials permission
        '404':
          description: Passkey not found

  /roles:
    get:
      tags: [Users]
      summary: List all roles
      responses:
        '200':
          description: Role list (sorted by name)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          description: Authentication required
    post:
      tags: [Users]
      summary: Create a role
      description: Requires permission `users:write`. Permission ids are validated against the catalog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid payload or unknown permission id
        '401':
          description: Authentication required
        '403':
          description: Missing users:write permission
        '409':
          description: Role name already exists

  /roles/{name}:
    patch:
      tags: [Users]
      summary: Update a role's description and permissions
      description: Requires permission `users:write`. Only the provided fields are changed.
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: No updatable fields provided or a field is invalid
        '401':
          description: Authentication required
        '403':
          description: Missing users:write permission
        '404':
          description: Role not found
    delete:
      tags: [Users]
      summary: Delete a role
      description: >-
        Requires permission `users:write`. The built-in `admin` role can never
        be deleted; other roles are refused with 409 while any user still
        carries them.
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Role deleted
        '401':
          description: Authentication required
        '403':
          description: Missing users:write permission
        '404':
          description: Role not found
        '409':
          description: Built-in admin role, or still assigned to users

  /permissions:
    get:
      tags: [Users]
      summary: Permission catalog
      description: >-
        The canonical list of permission ids (with descriptions) and known
        roles. Drives the role/permission checkboxes on the Users page.
      responses:
        '200':
          description: Permission catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCatalog'
        '401':
          description: Authentication required

  /tokens:
    get:
      tags: [Tokens]
      summary: List API tokens
      description: >-
        Lists the caller's own long-lived API tokens (requires permission
        `tokens:manage`). Pass `?all=true` to list every user's tokens
        (additionally requires permission `users:read`). Token values are never
        returned — only a display prefix.
      parameters:
        - in: query
          name: all
          required: false
          schema: { type: boolean, default: false }
          description: "Include other users' tokens (requires users:read)"
      responses:
        '200':
          description: Token list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
        '401':
          description: Authentication required
        '403':
          description: Missing tokens:manage permission, or missing users:read with all=true
    post:
      tags: [Tokens]
      summary: Create an API token for the caller (or another user)
      description: >-
        Creates a long-lived bearer token (`unm_…`) bound to the CALLING user.
        Requires permission `tokens:manage`. The raw value is returned exactly
        once in `rawToken` — store it now, only its SHA-256 hash is kept.
        `permissions` may narrow the grant to a subset of the target user's
        effective permissions; omit it (or pass []) to inherit the full current
        effective set. Pass `userId` to mint on behalf of ANOTHER user —
        requires permission `users:write`. That is how admins provision API
        tokens for service-only accounts that cannot sign into the web UI.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreateRequest'
      responses:
        '201':
          description: Token created (rawToken shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        '400':
          description: Invalid payload or permission not in the target user's effective set
        '401':
          description: Authentication required
        '403':
          description: Missing tokens:manage permission, or missing users:write when minting for another user
        '404':
          description: Target userId not found

  /tokens/{id}:
    delete:
      tags: [Tokens]
      summary: Revoke an API token
      description: >-
        Revokes a token. Revoking your own tokens requires permission
        `tokens:manage`; permission `users:write` allows revoking any user's
        token.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Token revoked
        '401':
          description: Authentication required
        '403':
          description: Missing tokens:manage (own token) or users:write (other user's token)
        '404':
          description: Token not found

  /system/status:
    get:
      tags: [System]
      summary: System/HA status — workers, leader election, database health
      description: >-
        Observability for the worker infrastructure (Workers page). Reports THIS
        instance's view: per-worker leadership state + beat stats, telemetry poll
        cycle counters, recent leadership/error events, and a read-only Postgres
        snapshot (version, connections, table sizes). Requires permission
        `system:read`.
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          description: Authentication required
        '403':
          description: Missing system:read permission

  /system/settings:
    get:
      tags: [System]
      summary: Get effective runtime worker/HA settings
      description: >-
        Effective values for the admin-tunable knobs (stored overrides win over
        env defaults) plus the allowed ranges, so form UIs can validate client-side.
        Requires permission `system:read`.
      responses:
        '200':
          description: Current settings + limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingsResponse'
        '401':
          description: Authentication required
        '403':
          description: Missing system:read permission
    put:
      tags: [System]
      summary: Update runtime worker/HA settings (live effect)
      description: >-
        Persists new values for the tunable knobs. All-or-nothing, validated and
        clamped server-side; takes effect on the next worker beat — no restart.
        Requires permission `system:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsUpdate'
      responses:
        '200':
          description: Saved settings + limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingsResponse'
        '400':
          description: Invalid value (type or out of range)
        '401':
          description: Authentication required
        '403':
          description: Missing system:write permission

  /settings:
    get:
      tags: [System]
      summary: List all central system settings
      description: >-
        Every app-wide setting (retention windows, session/timeout behaviour,
        worker cadence, execution budgets) with its effective value, default,
        type, limits and help text. Requires permission `system:read`.
      responses:
        '200':
          description: All settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsListResponse'
        '401':
          description: Authentication required
        '403':
          description: Missing system:read permission

  /settings/{key}:
    put:
      tags: [System]
      summary: Update one system setting
      description: >-
        Validates + clamps a single setting and persists it. Takes effect on the
        next worker beat — no restart. Requires permission `system:write`.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdateRequest'
      responses:
        '200':
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'
        '400':
          description: Invalid value (type or out of range)
        '401':
          description: Authentication required
        '403':
          description: Missing system:write permission
        '404':
          description: Unknown setting key
    delete:
      tags: [System]
      summary: Reset one system setting to its default
      description: >-
        Deletes the stored override so the setting reverts to its env/default
        baseline. Requires permission `system:write`.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reset setting (now at default)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'
        '401':
          description: Authentication required
        '403':
          description: Missing system:write permission
        '404':
          description: Unknown setting key

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Authenticated JWT used for RBAC protected endpoints. Privileged operations
        marked with `x-2fa-required: true` additionally expect the session's `amr`
        claim to intersect the user's credential-policy gate (`gateAmrs`, managed
        via /auth/policies/global and /users/{id}/policy — default ['totp'], may
        include 'webauthn' for passkey sessions). The policy is evaluated LIVE on
        each request, so admin changes apply immediately to existing sessions.
        Long-lived API tokens (`unm_…`, created via POST /tokens) are also accepted
        as bearer credentials; they can never satisfy a 2FA requirement.

  schemas:
    Secret:
      type: object
      required: [id, type, createdAt]
      properties:
        id: { type: string }
        type: { type: string, description: "Secret type (e.g. apiKey, usernamePassword, snmp)" }
        providerId: { type: string, nullable: true, description: "Provider plugin UUID that created this secret" }
        label: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        username: { type: string }
        interactiveLoginAllowed:
          type: boolean
          default: false
          description: "May this secret be used for an interactive SSH console session (opt-in per secret)"
        fileAccessAllowed:
          type: boolean
          default: false
          description: "May this secret be used for SFTP file-access sessions (opt-in per secret)"

    SecretField:
      type: object
      required: [name, label, input]
      properties:
        name: { type: string }
        label: { type: string }
        input:
          type: string
          enum: [text, password, select, textarea]
        secret: { type: boolean, default: false }
        required: { type: boolean, default: false }
        options:
          type: array
          items: { type: string }

    SecretType:
      type: object
      required: [type, label, fields]
      properties:
        type: { type: string }
        label: { type: string }
        generatable: { type: boolean, default: false, description: "True when the provider can create/rotate this type's key material itself (POST /secrets/generate, POST /secrets/{id}/regenerate)" }
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SecretField'

    SecretProvider:
      type: object
      required: [id, name, online, secretTypes]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        endpoint: { type: string, format: uri }
        online: { type: boolean }
        secretTypes:
          type: array
          items:
            $ref: '#/components/schemas/SecretType'

    # A long-lived API token for agents/scripts (MCP server, CI). The raw value
    # is shown once at creation; only its SHA-256 hash is stored.
    ApiToken:
      type: object
      required: [id, userId, permissions]
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: [string, 'null'], description: "Owner's username (all=true listings)" }
        label: { type: [string, 'null'] }
        tokenPrefix: { type: [string, 'null'], description: "First characters of the raw value for display (e.g. 'unm_abc123')" }
        permissions:
          type: array
          items: { type: string }
          description: "Granted permission ids; empty = inherit the owner's full effective set"
        inheritsAllPermissions: { type: boolean, description: "True when permissions is empty (inherit all)" }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    ApiTokenCreateRequest:
      type: object
      properties:
        label: { type: string, maxLength: 120, description: "Human-readable purpose (e.g. 'MCP server')" }
        userId: { type: string, description: "Optional — mint on behalf of another user (requires users:write); omitted = the caller" }
        permissions:
          type: array
          items: { type: string }
          description: "Optional narrowing to a subset of the target user's effective permissions; omit for inherit-all"
        expiresAt: { type: [string, 'null'], format: date-time, description: "ISO expiry timestamp; null/omitted = no expiry" }

    ApiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
      type: object
      required: [rawToken]
      properties:
        rawToken: { type: string, description: "The bearer token value (unm_…) — returned exactly once" }

    # One named credential slot a plugin declares in /discover (beyond its
    # primary secret), e.g. a web-UI login distinct from SNMP.
    CredentialSlotDescriptor:
      type: object
      required: [name, secretType]
      properties:
        name: { type: string, description: "Slot key (e.g. 'web'); unique per plugin" }
        secretType: { type: string, description: "Secret type the bound secret must have (e.g. usernamePassword)" }
        required: { type: boolean, default: false, description: "True when a config action needs this slot (UI hint, not enforced at assignment time)" }
        description: { type: string, description: "Human-readable purpose shown next to the picker in the webapp" }

    # A declared slot with the secret bound to it on an assignment (list views).
    BoundCredentialSlot:
      allOf:
        - $ref: '#/components/schemas/CredentialSlotDescriptor'
      type: object
      properties:
        secretId: { type: [string, 'null'], description: "secrets.id bound to this slot; null = unbound" }
        secretLabel: { type: [string, 'null'] }

    # One row of the device ↔ plugin join table (a device can have several).
    # One quick action a plugin propagates for its devices (Devices page "Device Actions" column).
    QuickAction:
      type: object
      required: [id, label, kind]
      properties:
        id: { type: string, description: "Stable id within the plugin's quick-action list (e.g. 'webui', 'shell')" }
        label: { type: string, description: "Label rendered on the button" }
        description: { type: string, description: "Tooltip / menu description" }
        iconPath: { type: string, description: "Optional icon path served from the plugin's /icons dir (rendered via the API icon proxy); generic per-kind glyph when absent" }
        kind:
          type: string
          enum: [url, shell, files, action]
          description: >-
            url = open the management web UI (resolved via POST /devices/{id}/quick-action);
            shell/files = reuse the SSH console / filesystem browser dialogs;
            action = run a catalog action through the plan workflow with risk gating.
        url:
          type: object
          properties:
            path: { type: string, description: "Path the plugin appends to the resolved base URL (kind 'url' only)" }
        actionId: { type: string, description: "Catalog entry id for kind 'action'" }
        prefill:
          type: object
          additionalProperties: true
          description: "Pre-filled input values merged under the action schema defaults (kind 'action')"

    # Response of POST /devices/{deviceId}/quick-action.
    QuickActionResult:
      type: object
      required: [deviceId, url]
      properties:
        deviceId: { type: string }
        url: { type: string, format: uri, description: "Fully resolved, browser-openable management web-UI URL" }

    DevicePluginAssignment:
      type: object
      required: [id, deviceId, pluginId, isPrimary, order]
      properties:
        id: { type: string }
        deviceId: { type: string }
        pluginId: { type: string }
        secretId: { type: string, description: "Credential source for this assignment (null = no credentials)" }
        extraCredentials:
          type: object
          additionalProperties: { type: string }
          description: "Bound extra credential slots: slot name → secrets.id"
        isPrimary: { type: boolean, description: "True for the row at position 0 — the device's primary plugin (default target for config jobs)" }
        order: { type: integer, minimum: 0, description: "Position within the device's ordered plugin list (0-based); also the fallback/failover sequence" }
        createdAt: { type: string, format: date-time }
        # Enriched fields returned by the list endpoints:
        pluginName: { type: string }
        pluginVersion: { type: string }
        pluginEndpoint: { type: string, format: uri }
        pluginOnline: { type: boolean }
        secretLabel: { type: string }
        credentialSlots:
          type: array
          items:
            $ref: '#/components/schemas/BoundCredentialSlot'
          description: "The plugin's declared slots with their bound secrets resolved (list views only)"
        pluginQuickActions:
          type: array
          items:
            $ref: '#/components/schemas/QuickAction'
          description: "The assigned plugin's quick actions for the Devices page 'Device Actions' column (list views only; absent when the plugin advertises none)"

    # A device address as presented to the UI and plugins (primary flag included).
    DeviceAddress:
      type: object
      required: [address, isPrimary]
      properties:
        address: { type: string, description: "IPv4, IPv6 literal, or DNS name (no scheme)" }
        isPrimary: { type: boolean, description: "True for the device's managementAddress" }
        id: { type: [string, 'null'], description: "Row id of a secondary IP; null for the primary" }

    # One row of the device_ips table (a secondary IP).
    DeviceIpRow:
      type: object
      required: [id, deviceId, address]
      properties:
        id: { type: string }
        deviceId: { type: string }
        address: { type: string }
        createdAt: { type: string, format: date-time }

    DevicePluginAssignmentInput:
      type: object
      required: [pluginId]
      properties:
        pluginId: { type: string }
        secretId: { type: [string, 'null'], description: "Optional credential source for this assignment (null = no credentials)" }
        isPrimary: { type: boolean, default: false }
        extraCredentials:
          type: object
          additionalProperties: { type: [string, 'null'] }
          description: "Extra credential slots to bind (slot name → secrets.id; null clears a slot). Validated against the plugin's declared slots."

    # Optional body for PATCH /devices/{deviceId}/plugins/{pluginId}.
    DevicePluginAssignmentUpdate:
      type: object
      maxProperties: 3
      properties:
        secretId: { type: [string, 'null'], description: "New credential source; null clears it" }
        isPrimary: { type: boolean, description: "Set true to make this assignment the primary" }
        extraCredentials:
          type: object
          additionalProperties: { type: [string, 'null'] }
          description: "Replace bound slot secrets (validated per slot type); provided = full replacement of the slot map"

    Device:
      type: object
      required: [id, name, vendor, deviceTypes, tags, managementAddress, status]
      properties:
        id: { type: string }
        name: { type: string }
        vendor: { type: string }
        # Legacy single type (first of deviceTypes) — kept for old clients.
        deviceType: { type: [string, 'null'] }
        deviceTypes:
          type: array
          items: { type: string }
          description: "All roles this device fulfills, e.g. ['router', 'firewall']"
        tags:
          type: array
          items: { type: string }
          description: "Free-form user-assigned tags (future filter/plan targeting)"
        managementAddress: { type: string }
        siteId: { type: [string, 'null'], description: "Assigned site (null = unassigned)" }
        siteName: { type: [string, 'null'], description: "Display name of the assigned site" }
        status:
          type: string
          enum: [online, degraded, offline, unknown]
        model: { type: [string, 'null'], description: "Hardware model selected from a plugin's advertised catalog (null = unset)" }
        firmwareVersion: { type: [string, 'null'], description: "Firmware version for the selected model (null = unset)" }
        layerOverride: { type: [string, 'null'], description: "Manual topology-layer override (a network_layers id); null = auto-classify from plugin suggestion / heuristic" }
        pollIntervalMs: { type: [integer, 'null'], minimum: 5000, maximum: 3600000, description: "Per-device metrics poll window in ms; null = inherit the plugin's global option or system setting" }
        detectedFirmwareVersion: { type: [string, 'null'], description: "Firmware version detected from the plugins' latest telemetry — primary plugin first; null when no assigned plugin reports it" }
        serialNumber: { type: [string, 'null'], description: "Serial number from the plugins' latest telemetry (system.serialNumber); null when not reported" }
        enabled: { type: boolean, default: true, description: "Disabled devices are not polled; historical data + last metrics stay preserved" }
        ips:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAddress'
          description: "All addresses, primary first (list endpoints include this)"
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/DevicePluginAssignment'
          description: "Assigned plugins (list endpoints include this)"
        summaryMetrics:
          type: array
          items:
            type: object
            additionalProperties: true
          description: "Headline metrics from the latest telemetry of each assignment"

    DeviceRefreshResult:
      type: object
      required: [deviceId, ok, assignmentsPolled, results]
      properties:
        deviceId: { type: string }
        name: { type: string, description: "Device display name (empty for unknown ids)" }
        ok: { type: boolean, description: "True when at least one assignment was polled successfully" }
        assignmentsPolled: { type: integer, description: "Number of plugin assignments re-polled (0 = none possible)" }
        results:
          type: array
          items:
            type: object
            required: [pluginId, health, reachable]
            properties:
              pluginId: { type: string }
              health: { type: string, description: "Plugin-reported health (ok/degraded/critical/unknown)" }
              reachable: { type: boolean, description: "True when the plugin answered at all (transport OK)" }
              error: { type: [string, 'null'], description: "Transport-level failure reason (only on unreachable)" }
        error: { type: [string, 'null'], description: "Device-level problem (unknown device / polling disabled); no polls ran when set" }

    DeviceCreateRequest:
      type: object
      required: [name, vendor, deviceTypes, managementAddress, plugins]
      properties:
        name: { type: string }
        vendor: { type: string }
        # All roles the device fulfills (e.g. ["router", "firewall"]); at least one.
        deviceTypes:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        # Legacy single-type field — equivalent to a one-element deviceTypes.
        deviceType: { type: string, description: "Legacy; use deviceTypes" }
        # Free-form user tags (optional).
        tags:
          type: array
          items: { type: string, minLength: 1 }
        managementAddress: { type: string, description: "Primary address — IPv4, IPv6 literal, or DNS name (no scheme)" }
        siteId: { type: [string, 'null'], description: "Optional assigned site" }
        # Optional secondary IPs registered at creation time.
        ips:
          type: array
          items: { type: string }
          description: "Optional additional addresses (IPv4/IPv6/DNS names)"
        # At least one plugin assignment; the first becomes primary.
        plugins:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DevicePluginAssignmentInput'
        model: { type: [string, 'null'], description: "Optional hardware model (from a plugin's advertised catalog)" }
        firmwareVersion: { type: [string, 'null'], description: "Optional firmware version for the selected model" }
        layerOverride: { type: [string, 'null'], description: "Optional manual topology-layer override (a network_layers id); null/omitted = auto-classify" }
        pollIntervalMs: { type: [integer, 'null'], minimum: 5000, maximum: 3600000, description: "Optional per-device metrics poll window (ms); null/omitted = inherit" }

    Site:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        address: { type: [string, 'null'], description: "Free-form street/city address" }
        country: { type: [string, 'null'], description: "ISO-3166-1 alpha-2 code (e.g. DE)" }
        timezone: { type: [string, 'null'], description: "IANA timezone identifier (e.g. Europe/Berlin)" }
        latitude: { type: [number, 'null'], description: "GPS latitude in WGS84 decimal degrees (-90..90); set together with longitude" }
        longitude: { type: [number, 'null'], description: "GPS longitude in WGS84 decimal degrees (-180..180); set together with latitude" }
        createdAt: { type: string, format: date-time }

    SiteCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        address: { type: string }
        country: { type: string, pattern: "^[A-Z]{2}$", description: "ISO-3166-1 alpha-2 code (e.g. DE)" }
        timezone: { type: string, description: "IANA timezone identifier (e.g. Europe/Berlin)" }
        latitude: { type: number, minimum: -90, maximum: 90, description: "GPS latitude; provide together with longitude" }
        longitude: { type: number, minimum: -180, maximum: 180, description: "GPS longitude; provide together with latitude" }

    SiteUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        country: { type: [string, 'null'], pattern: "^[A-Z]{2}$", description: "ISO-3166-1 alpha-2 code (e.g. DE); null clears" }
        timezone: { type: [string, 'null'] }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90, description: "Provide together with longitude; both null clears the location" }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180, description: "Provide together with latitude" }

    DeviceScope:
      type: object
      description: >-
        Device-level access rules. A caller may see a device when it matches ANY
        of the listed rules (union). An empty object `{}` or an absent field means
        unrestricted (full visibility). Callers whose effective permissions include
        `devices:all` bypass scoping entirely.
      properties:
        siteIds:
          type: array
          items: { type: string }
          description: "Visible devices assigned to any of these site ids"
        tags:
          type: array
          items: { type: string }
          description: "Devices carrying ANY of these tags"
        deviceIds:
          type: array
          items: { type: string }
          description: "Explicitly visible device ids"

    User:
      type: object
      required: [id, username, roles, permissions, twoFactorEnabled, totpEnabled, passkeyCount, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        roles:
          type: array
          items: { type: string }
        # Explicit permission grants only (role-derived permissions are added at login).
        permissions:
          type: array
          items: { type: string }
        deviceScope:
          $ref: '#/components/schemas/DeviceScope'
        twoFactorEnabled: { type: boolean, description: "Whether ANY second factor is enrolled (TOTP or ≥1 passkey)" }
        totpEnabled: { type: boolean, description: "Whether a TOTP secret is enrolled" }
        passkeyCount: { type: integer, minimum: 0, description: "Number of enrolled passkeys (one per device)" }
        createdAt: { type: string, format: date-time }
        # Credential-policy state: disabled accounts are rejected at login and their live sessions terminate.
        disabled: { type: boolean, description: "Whether the account is disabled (manual or inactivity auto-disable)" }
        lastLoginAt: { type: [string, 'null'], format: date-time, description: "Most recent successful authentication; drives the inactivity sweep" }

    # --- Per-user UI preferences (nav order + hidden pages) -----------------

    UserPreferences:
      type: object
      required: [navOrder, hiddenPages]
      properties:
        navOrder:
          type: array
          items: { type: string }
          description: "Nav path strings in the user's chosen order (e.g. ['/devices','/networks'])"
        hiddenPages:
          type: array
          items: { type: string }
          description: "Nav path strings the user has hidden from the sidebar"

    UserPreferencesUpdateRequest:
      type: object
      properties:
        navOrder:
          type: array
          items: { type: string }
        hiddenPages:
          type: array
          items: { type: string }

    NavCountsResponse:
      type: object
      description: "Keys present only when the caller has the corresponding read permission"
      properties:
        notifications: { type: integer, minimum: 0, description: "Open notifications visible to the user" }
        configJobs: { type: integer, minimum: 0, description: "Config jobs in queued or running state" }
        plans: { type: integer, minimum: 0, description: "Plans in executing/ready/draft state" }

    UserCreateRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        deviceScope:
          $ref: '#/components/schemas/DeviceScope'

    UserCreatedResponse:
      type: object
      required: [user, enrollment]
      properties:
        user:
          $ref: '#/components/schemas/User'
        enrollment:
          $ref: '#/components/schemas/TotpEnrollment'

    PasswordResetRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 8 }
        # Required when changing your own password; ignored for other users.
        currentPassword: { type: string }

    TotpEnrollment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: "Base32 TOTP secret (shown as text + QR code)" }
        otpauthUri: { type: string, description: "otpauth:// URI for authenticator-app setup" }

    TotpEnrollmentResponse:
      type: object
      required: [user, enrollment]
      properties:
        user:
          $ref: '#/components/schemas/User'
        enrollment:
          $ref: '#/components/schemas/TotpEnrollment'

    # --- Passkeys (WebAuthn) + credential policies ---------------------------

    LoginSessionResponse:
      type: object
      required: [accessToken, expiresIn, username, roles, permissions]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer }
        username: { type: string }
        roles:
          type: array
          items: { type: string }
        # Effective permission set: the user's explicit grants unioned with every
        # permission of their assigned roles.
        permissions:
          type: array
          items: { type: string }

    WebauthnAssertionOptionsResponse:
      type: object
      required: [options, nonce]
      properties:
        # PublicKeyCredentialRequestOptionsJSON — pass straight to navigator.credentials.get().
        options: { type: object }
        # Echo back with the assertion response (replay protection).
        nonce: { type: string }

    WebauthnRegistrationOptionsResponse:
      type: object
      required: [options, nonce]
      properties:
        # PublicKeyCredentialCreationOptionsJSON — pass to navigator.credentials.create().
        options: { type: object }
        # Echo back with the creation response (attestation is verified against it).
        nonce: { type: string }

    PasskeyCredential:
      type: object
      required: [id, credentialId, createdAt]
      properties:
        id: { type: string }
        credentialId: { type: string, description: "Base64url credential identifier from the authenticator" }
        label: { type: [string, 'null'], description: "User-assigned display name (e.g. device name)" }
        transports:
          type: array
          items: { type: string }
          description: "Authenticator transports (platform | hybrid | roaming)"
        createdAt: { type: string, format: date-time }

    CredentialPolicy:
      type: object
      required: [requiredMethods, gateAmrs]
      properties:
        # Enrolled methods that satisfy login step 2; empty = no 2FA required.
        requiredMethods:
          type: array
          items: { type: string, enum: [totp, webauthn] }
        # Session AMRs that satisfy the require2FA gate (privileged endpoints).
        gateAmrs:
          type: array
          minItems: 1
          items: { type: string, enum: [pwd, totp, webauthn] }
        # Minimum characters for new/reset passwords; null = built-in default of 8.
        minPasswordLength: { type: [integer, 'null'], minimum: 1 }
        # Force a password change after this many days; null = no forced rotation.
        passwordMaxAgeDays: { type: [integer, 'null'], minimum: 1 }
        # Auto-disable the account if it has not logged on for this many days; null = off.
        inactiveDisableAfterDays: { type: [integer, 'null'], minimum: 1 }
        # Per-user cap on session lifetime (seconds); sessions expire at min(global, this); null = inherit global.
        sessionTimeoutSeconds: { type: [integer, 'null'], minimum: 300 }
        # Whether the user may extend their own session via a 2FA revalidation; false = hardening kill switch.
        allowSessionExtension: { type: boolean, default: true }

    CredentialPolicyUpdateRequest:
      type: object
      minProperties: 1
      properties:
        requiredMethods:
          type: array
          items: { type: string, enum: [totp, webauthn] }
        gateAmrs:
          type: array
          minItems: 1
          items: { type: string, enum: [pwd, totp, webauthn] }
        # Omitted = unchanged; null clears the rule (inherit / off).
        minPasswordLength: { type: [integer, 'null'], minimum: 1 }
        passwordMaxAgeDays: { type: [integer, 'null'], minimum: 1 }
        inactiveDisableAfterDays: { type: [integer, 'null'], minimum: 1 }
        sessionTimeoutSeconds: { type: [integer, 'null'], minimum: 300 }
        # Omitted = unchanged; false denies session extension for this policy.
        allowSessionExtension: { type: boolean }

    CredentialPolicyWithSource:
      type: object
      required: [policy, source]
      properties:
        # The EFFECTIVE policy (per-user override merged onto the global default).
        policy: { $ref: '#/components/schemas/CredentialPolicy' }
        # The raw per-user override row; null when no override exists.
        override:
          oneOf:
            - $ref: '#/components/schemas/CredentialPolicy'
            - type: 'null'
        # Where the effective policy comes from (user = has an override).
        source: { type: string, enum: [user, global] }

    UserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        deviceScope:
          $ref: '#/components/schemas/DeviceScope'

    Role:
      type: object
      required: [name, permissions, createdAt]
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        permissions:
          type: array
          items: { type: string }
        deviceScope:
          $ref: '#/components/schemas/DeviceScope'
        createdAt: { type: string, format: date-time }

    RoleCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
        deviceScope:
          $ref: '#/components/schemas/DeviceScope'

    RoleUpdateRequest:
      type: object
      minProperties: 1
      properties:
        description: { type: [string, 'null'] }
        permissions:
          type: array
          items: { type: string }
        deviceScope:
          $ref: '#/components/schemas/DeviceScope'

    PermissionCatalog:
      type: object
      required: [permissions, roles]
      properties:
        permissions:
          type: array
          items:
            type: object
            required: [id, description]
            properties:
              id: { type: string }
              description: { type: string }
        # DB-backed role definitions (name + permission bundle).
        roles:
          type: array
          items:
            type: object
            required: [name, permissions]
            properties:
              name: { type: string }
              description: { type: [string, 'null'] }
              permissions:
                type: array
                items: { type: string }

    # --- Cross-device inventory views (Networks + Hosts pages) --------------

    LogEntry:
      type: object
      description: >-
        One structured log entry emitted by a plugin (batched via the internal
        POST /plugin/logs endpoint). `context` is an arbitrary JSON object with
        structured details ({endpoint, httpStatus, oid, ...}) — null when the
        plugin sent none.
      required: [id, pluginId, level, message, timestamp]
      properties:
        id: { type: string }
        pluginId: { type: string, description: "Plugin instance id (the sender's effective UUID)" }
        pluginName: { type: [string, 'null'], description: "Display name of the plugin instance" }
        deviceId: { type: [string, 'null'], description: "Device the entry relates to; null for plugin-level events" }
        deviceName: { type: [string, 'null'] }
        level:
          type: string
          enum: [debug, info, warn, error]
        message: { type: string, description: "Human-readable message (truncated at ~2KB on ingest)" }
        context: { type: object, additionalProperties: true, nullable: true, description: "Structured details; null when absent" }
        timestamp: { type: string, format: date-time, description: "ISO-8601 timestamp from the plugin's clock" }

    Notification:
      type: object
      description: >-
        One notification-center row. Ongoing conditions (device state changes,
        appliance alerts) carry a stable dedupeKey and are upserted while they
        persist — occurrences/lastSeenAt track recurrence; one-shot events use
        unique keys. `status`: open = counts toward the badge; acknowledged =
        seen by a user; resolved = condition cleared (auto or manual); closed
        = dismissed from view.
      required: [id, severity, source, title, message, createdAt, lastSeenAt, occurrences, status]
      properties:
        id: { type: string }
        dedupeKey: { type: [string, 'null'], description: "Stable identity of an ongoing condition; null for one-shot events" }
        severity:
          type: string
          enum: [info, warning, critical]
        source:
          type: string
          enum: [system, device, plugin]
          description: "system = the API itself (plans/config jobs); device = mirrored from telemetry; plugin = pushed by a plugin"
        pluginId: { type: [string, 'null'] }
        pluginName: { type: [string, 'null'], description: "Display name of the producing plugin instance" }
        deviceId: { type: [string, 'null'] }
        deviceName: { type: [string, 'null'] }
        title: { type: string }
        message: { type: string }
        context: { type: object, additionalProperties: true, nullable: true, description: "Structured details ({from,to}, {planId}, ...); null when absent" }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, description: "When the condition was last (re)observed" }
        occurrences: { type: integer, description: "How many times the condition has been observed since creation" }
        status:
          type: string
          enum: [open, acknowledged, resolved, closed]
        acknowledgedBy: { type: [string, 'null'] }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }

    NotificationPrefs:
      type: object
      description: >-
        Per-user visibility prefs — which severities from each source show up
        in the bell badge and dropdown panel. A missing/empty list hides that
        source entirely; omitted sources default to showing everything.
      required: [userId, visibility]
      properties:
        userId: { type: string }
        visibility:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum: [info, warning, critical]

    PluginSelfMetricsSample:
      type: object
      description: >-
        One self-metrics sample of a plugin process, collected by the API
        worker from the plugin's auto-mounted GET /metrics endpoint. All
        fields are nullable — older plugin images (predating the SDK feature)
        or partial payloads simply omit what they don't report.
      required: [id, pluginId, timestamp]
      properties:
        id: { type: string }
        pluginId: { type: string }
        uptimeSeconds: { type: [integer, 'null'], description: "Seconds since the plugin process started" }
        heapUsedBytes: { type: [integer, 'null'] }
        heapTotalBytes: { type: [integer, 'null'] }
        rssBytes: { type: [integer, 'null'], description: "Resident set size — in a single-node-process container this is the container's memory usage" }
        cpuPercent: { type: [number, 'null'], description: "% of ONE core over the plugin's sample window (can exceed 100 on multi-core hosts)" }
        eventLoopLagMs: { type: [number, 'null'], description: "Moving-average event-loop lag in ms (0 = healthy; high values mean blocking work)" }
        inFlight: { type: [integer, 'null'], description: "/monitoring + /config + /plan requests being handled at sample time (>1 = a poll is taking longer than the 30s cycle)" }
        lastPollMs: { type: [number, 'null'], description: "Duration of the plugin's last completed work request" }
        errorRatePercent: { type: [number, 'null'], description: "Failure rate of the plugin's last N work requests (0-100)" }
        emittedMetricsCount: { type: [integer, 'null'], description: "Metric keys in the plugin's last /monitoring payload (per-poll telemetry weight)" }
        logQueueDepth: { type: [integer, 'null'], description: "Pending entries in the plugin logger queue; null when no logger is registered" }
        timestamp: { type: string, format: date-time }

    NetworkRow:
      type: object
      description: >-
        One LOGICAL network across devices. Stored rows are per device+plugin;
        the API merges them — interfaces sharing a subnet or VLAN become one row
        (e.g. the same SSID/VLAN broadcast by many APs appears once with all
        reporting devices listed in `devices`).
      required: [key, name, subnet, versions, devices, collectedAt]
      properties:
        key: { type: string, description: "Canonical identity of the logical network (subnet:<cidr>, vlan:<id> or name:<interface>)" }
        name: { type: string, description: "Display label: subnet when known (e.g. 192.168.1.0/24), else 'VLAN <id>', else the interface name" }
        subnet: { type: [string, 'null'], description: "Network address + prefix when any member carries an IP; null for pure SSID/VLAN rows" }
        vlanId: { type: [integer, 'null'], description: "VLAN id when all members of the network are VLAN-tagged (or it is a VLAN-only group)" }
        versions:
          type: array
          items:
            type: string
            enum: [v4, v6]
          description: "Address families present across all members (e.g. [v4, v6] for dual-stack)"
        devices:
          type: array
          minItems: 1
          items:
            type: object
            required: [deviceId, pluginId, interfaces, cidrs]
            properties:
              deviceId: { type: string }
              deviceName: { type: [string, 'null'], description: "Display name of the device reporting this network" }
              managementAddress: { type: [string, 'null'] }
              siteName: { type: [string, 'null'] }
              pluginId: { type: string, description: "Plugin instance id (multi-instance ids carry a :instance suffix)" }
              pluginName: { type: [string, 'null'], description: "Display name of the plugin instance that produced this member" }
              interfaces:
                type: array
                items: { type: string }
                description: "Interface name(s) carrying this network on the device (e.g. [lan], [WLAN-1, WLAN-2])"
              cidrs:
                type: array
                items: { type: string }
                description: "Addresses configured on those interfaces with their prefix when known, IPv4 first; empty for IP-less rows (SSIDs)"
              mac: { type: [string, 'null'] }
              status: { type: [string, 'null'] }
        collectedAt: { type: string, format: date-time, description: "Latest observation across all members" }

    HostRow:
      type: object
      required: [mac, ips, sources, devices, lastSeenAt]
      properties:
        mac: { type: string }
        # One row per physical host ACROSS all devices and plugins: rows with the
        # same MAC are merged (a WLAN client on an AP that is also in the router's
        # ARP table appears once, with both addresses and all observing devices).
        ips:
          type: array
          minItems: 1
          items: { type: string }
          description: "All known addresses of this host, IPv4 first"
        sources:
          type: array
          minItems: 1
          items:
            type: string
            enum: [arp, ndp, dhcp, wlan, self]
          description: "Discovery sources that reported this MAC anywhere on the network (e.g. arp + wlan; 'self' = the appliance's own interfaces)"
        hostname: { type: [string, 'null'], description: "Best-known hostname across all sources (DHCP leases first, then any reporter)" }
        manufacturer: { type: [string, 'null'], description: "Best-known MAC vendor across all sources" }
        expiry: { type: [string, 'null'], format: date-time, description: "Lease expiry (when a DHCP lease is known for this MAC)" }
        lastSeenAt: { type: string, format: date-time, description: "Latest observation across all devices/sources" }
        devices:
          type: array
          minItems: 1
          items:
            type: object
            required: [deviceId, pluginId, interfaces]
            properties:
              deviceId: { type: string }
              deviceName: { type: [string, 'null'], description: "Display name of the device that observed this host" }
              managementAddress: { type: [string, 'null'] }
              siteName: { type: [string, 'null'] }
              pluginId: { type: string, description: "Plugin instance id (multi-instance ids carry a :instance suffix)" }
              pluginName: { type: [string, 'null'], description: "Display name of the plugin instance that observed this host" }
              interfaces:
                type: array
                items: { type: string }
                description: "Interface(s) on the observing device where the host was seen (e.g. [lan], [wlan0])"

    DocumentedHostIp:
      type: object
      description: >-
        One documented IP address of a documented host, enriched with live
        discovery data at read time.
      required: [id, address, version, discovered]
      properties:
        id: { type: string }
        address: { type: string, description: "Bare IPv4/IPv6 literal" }
        version:
          type: string
          enum: [v4, v6]
        mac:
          type: [string, 'null']
          description: "The DOCUMENTED (expected) MAC in colon form; null = unknown. Auto-filled from live observations in the webapp but user-overridable."
        networkLabel:
          type: [string, 'null']
          description: >-
            Reference to a known network — either the canonical key of a merged
            logical network (subnet CIDR / "VLAN <id>" / interface name) or a
            free-form label for networks not in the inventory yet.
        vlanId:
          type: [integer, 'null']
          description: "VLAN id the address lives in; null = unknown. Auto-filled from the inventory when known."
        networkName:
          type: [string, 'null']
          description: "Resolved display name of the referenced network"
        networkKnown:
          type: boolean
          description: "True when the label refers to a known logical network (vs free-form)"
        discovered:
          type: boolean
          description: "True when this address was observed in the live inventory recently"
        observedMac:
          type: [string, 'null']
          description: "MAC currently observed for this address; null = not observed"
        macMismatch:
          type: boolean
          description: "Documented MAC is set AND differs from what is currently observed here"

    DocumentedHost:
      type: object
      description: >-
        One documented host (user-maintained inventory) with live discovery
        info. `discovered` = a matching documented MAC or IP was seen in the
        live ARP/NDP/DHCP/WLAN inventory recently; `macMismatch` = any
        documented MAC differs from what is currently observed for its address.
      required: [id, dnsNames, ips, discovered, createdAt, updatedAt]
      properties:
        id: { type: string }
        dnsNames:
          type: array
          minItems: 1
          items: { type: string }
          description: "DNS names / FQDNs (lowercase); the FIRST entry is the primary name"
        friendlyName: { type: [string, 'null'], description: "Optional human-friendly label" }
        description: { type: [string, 'null'] }
        siteId: { type: [string, 'null'] }
        siteName: { type: [string, 'null'], description: "Display name of the placed-at site" }
        layerId: { type: [string, 'null'] }
        layerName: { type: [string, 'null'], description: "Display name of the topology layer" }
        tags:
          type: array
          items: { type: string }
          default: []
          description: >-
            User-assigned free-form tags (same data basis as devices.tags,
            e.g. "vm", "lab"). Also auto-applied from a matching device on
            inventory import when the host has none yet.
        ips:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentedHostIp'
        discovered:
          type: boolean
          description: "True when any documented MAC or IP was observed in the live inventory"
        lastSeenAt:
          type: [string, 'null']
          format: date-time
          description: "Most recent observation matching this host; null = never seen"
        observedHostname:
          type: [string, 'null']
          description: "Hostname reported by the best-matching live row (DHCP preferred)"
        macMismatch:
          type: boolean
          description: "Any documented MAC differs from what is currently observed for its address"
        isActive:
          type: boolean
          default: true
          description: >-
            User-maintained lifecycle flag — true = the host is in active use,
            false = stale/retired (the row stays documented but is dimmed in
            the UI). Every new or imported host starts active.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DocumentedHostIpRequest:
      type: object
      required: [address]
      properties:
        address: { type: string, description: "Bare IPv4/IPv6 literal (no scheme)" }
        mac:
          type: [string, 'null']
          description: "Documented MAC (any common format; normalized to colon form); null = unknown"
        networkLabel:
          type: [string, 'null']
          description: "Known-network reference or free-form label for an unknown network"
        vlanId:
          type: [integer, 'null']
          minimum: 0
          maximum: 4095
          description: "VLAN id the address lives in; null = unknown"

    DocumentedHostRequest:
      type: object
      required: [dnsNames, ips]
      properties:
        dnsNames:
          type: array
          minItems: 1
          items: { type: string }
          description: "DNS names / FQDNs (validated RFC 1123); first entry = primary name"
        friendlyName: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        siteId: { type: [string, 'null'], description: "Site this host is placed at; must exist when set" }
        layerId: { type: [string, 'null'], description: "Topology layer this host sits on; must exist when set" }
        tags:
          type: array
          items: { type: string }
          default: []
          description: "Free-form user tags (same data basis as devices.tags); omitted = none"
        isActive:
          type: boolean
          default: true
          description: "Lifecycle flag — false marks the host stale/retired (new hosts default to active)"
        ips:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentedHostIpRequest'

    DocumentedHostUpdateRequest:
      type: object
      description: >-
        Partial update of a documented host — every property is optional; only
        the provided fields change. When `ips` is present it REPLACES the full
        address list. The merged result must be a complete valid host (at least
        one DNS name and one IP), enforced server-side.
      properties:
        dnsNames:
          type: array
          minItems: 1
          items: { type: string }
          description: "Replaces the full DNS-name list"
        friendlyName: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        siteId: { type: [string, 'null'], description: "Site this host is placed at; must exist when set" }
        layerId: { type: [string, 'null'], description: "Topology layer this host sits on; must exist when set" }
        tags:
          type: array
          items: { type: string }
          description: "Replaces the full tag list (same data basis as devices.tags); [] clears all. Omitted = keep current"
        isActive:
          type: boolean
          description: "Lifecycle flag — true = active use, false = stale/retired. Omitted = keep the current value"
        ips:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentedHostIpRequest'
          description: "Replaces the full address list"

    DocumentedHostImportResult:
      type: object
      required: [created, updated, skipped, errors]
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer, description: "Matched rows left untouched (updateExisting=false)" }
        errors:
          type: array
          items:
            type: object
            required: [index, error]
            properties:
              index: { type: integer, description: "0-based position in the submitted batch" }
              error: { type: string }

    DocumentedHostInventoryImportRequest:
      type: object
      properties:
        skipWithoutHostname:
          type: boolean
          default: true
          description: "Skip live hosts without a usable hostname (no DNS name can be derived; MAC is used as fallback when disabled)"
        skipUnknownNetworks:
          type: boolean
          default: false
          description: "Skip live hosts whose addresses match no known logical network"
        skipWithoutVlan:
          type: boolean
          default: false
          description: "Skip live hosts whose addresses resolve to no known logical network with a discovered VLAN id"
        publicIpv4Policy:
          type: string
          enum: [keep, strip, skip-host]
          default: keep
          description: "How to treat publicly routable IPv4 addresses (RFC 1918 private ranges count as internal): keep = import as-is; strip = drop only the public v4 addresses but still import the host with its internal ones; skip-host = any public v4 address skips the whole host"
        publicIpv6Policy:
          type: string
          enum: [keep, strip, skip-host]
          default: keep
          description: "How to treat publicly routable IPv6 addresses (GUA 2000::/3; ULA fc00::/7 counts as internal): keep = import as-is; strip = drop only the public v6 addresses but still import the host with its internal ones; skip-host = any public v6 address skips the whole host"
        rangeMode:
          type: string
          enum: [keep-all, include-only, exclude]
          default: keep-all
          description: "Network/range filter applied BEFORE all other options. include-only imports only hosts with an address inside one of `ranges`; exclude skips hosts with an address inside one of `ranges`"
        ranges:
          type: array
          items:
            type: string
          default: []
          description: "CIDR blocks (192.168.1.0/24, fd00::/64) and/or inclusive IP ranges (192.168.1.10-192.168.1.50). A host matches when ANY of its addresses falls into ANY entry; empty = no range filtering"
        maxAgeHours:
          type: number
          minimum: 0
          default: 24
          description: "Only import hosts observed within this many hours (0 = all)"
        dryRun:
          type: boolean
          default: true
          description: "Preview only — compute the plan without writing anything"

    DocumentedHostInventoryImportResult:
      type: object
      required: [dryRun, totalLiveHosts, planned, created, updated, skipped]
      properties:
        dryRun: { type: boolean }
        totalLiveHosts: { type: integer, description: "Live hosts considered (within the age window)" }
        planned:
          type: array
          items:
            type: object
            required: [mac, hostname, ips, action]
            properties:
              mac: { type: string, description: "Representative MAC of this entry (first-seen; for merged groups the first NIC)" }
              hostname: { type: [string, 'null'] }
              ips: { type: integer, description: "Documentable addresses of this host" }
              action: { type: string, enum: [create, update, skip] }
              reason: { type: string, description: "Why the host is skipped (action=skip only)" }
              stripped: { type: integer, description: "Public addresses removed by a strip policy (action=create/update only)" }
              mergedFrom:
                type: array
                items: { type: string }
                description: >-
                  Extra MACs folded into this entry by the smart hostname merge
                  (a multi-NIC machine observed once per NIC); empty/absent =
                  single-MAC row.
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        mergedGroups:
          type: integer
          description: "How many live MAC rows were folded into one entry by the hostname merge (dry-run only)"

    DocumentedNetwork:
      type: object
      description: >-
        One documented network (user-maintained inventory) with live discovery
        info. `discovered` = a merged live logical network matches this row by
        name, CIDR containment (either direction), or VLAN id; `observedSubnets`
        / `observedVlanId` carry what the matching live group(s) report right now.
      required: [id, name, subnets, discovered, createdAt, updatedAt]
      properties:
        id: { type: string }
        name:
          type: string
          description: "Primary label / identity (\"VLAN 30\", \"10.40.0.0/16\", \"Mgmt LAN\"); unique case-insensitively"
        subnets:
          type: array
          items: { type: string }
          default: []
          description: "Canonicalized CIDR blocks, IPv4 first (may be empty for name-only rows)"
        vlanId:
          type: [integer, 'null']
          minimum: 0
          maximum: 4095
          description: "VLAN id when the network lives in one; null = unknown / not VLAN-based"
        gateways:
          type: array
          items: { type: string }
          default: []
          description: "Documented gateway IP literals (dual-stack networks carry both families)"
        dnsServers:
          type: array
          items: { type: string }
          default: []
          description: "Documented DNS server IP literals"
        ntpServers:
          type: array
          items: { type: string }
          default: []
          description: "Documented NTP server IP literals"
        friendlyName: { type: [string, 'null'], description: "Optional human-friendly label" }
        description: { type: [string, 'null'] }
        siteId: { type: [string, 'null'] }
        siteName: { type: [string, 'null'], description: "Display name of the placed-at site" }
        layerId: { type: [string, 'null'] }
        layerName: { type: [string, 'null'], description: "Display name of the topology layer" }
        tags:
          type: array
          items: { type: string }
          default: []
          description: "User-assigned free-form tags (same data basis as devices.tags)"
        discovered:
          type: boolean
          description: "True when a merged live logical network matches this documented one"
        lastSeenAt:
          type: [string, 'null']
          format: date-time
          description: "Most recent collection of any matching live group; null = never seen"
        observedSubnets:
          type: array
          items: { type: string }
          default: []
          description: "Subnets observed on the matching live groups (union, IPv4 first)"
        observedVlanId:
          type: [integer, 'null']
          minimum: 0
          maximum: 4095
          description: "VLAN id observed on a matching live group; null when none known"
        totalHosts:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Usable IPv4 host addresses over all v4 subnets (network + broadcast
            reserved for /30 and larger; RFC 3021 point-to-point /31 and /32
            count every address). Null when the row has no v4 subnet.
        freeHosts:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Usable hosts minus the distinct documented host IPs (documented-hosts
            page) that fall inside any of the network's v4 subnets; clamped at 0.
            Null when totalHosts is null.
        firstHost:
          type: [string, 'null']
          description: "First usable host address of each v4 subnet, \", \"-joined (e.g. \"192.168.1.1\"); null when no v4 subnet"
        lastHost:
          type: [string, 'null']
          description: "Last usable host address of each v4 subnet, \", \"-joined; null when no v4 subnet"
        broadcastAddress:
          type: [string, 'null']
          description: "Broadcast address of each v4 subnet (only for /30 and larger — RFC 3021 /31 + /32 have none), comma-joined; null when no v4 subnet"
        firstHostV6:
          type: [string, 'null']
          description: "First address of each v6 subnet (the network address itself — v6 has no reserved network address), \" \"-joined; null when no v6 subnet"
        lastHostV6:
          type: [string, 'null']
          description: "Last address of each v6 subnet, \" \"-joined; null when no v6 subnet. IPv6 has no broadcast concept"
        subnetStats:
          type: array
          items: { $ref: '#/components/schemas/SubnetHostStats' }
          default: []
          description: >-
            Per-subnet used/free breakdown for EVERY documented subnet (v4 and
            v6) — the dual-stack view where the two families carry different
            prefixes, so one aggregate number per family is not enough.
        isActive:
          type: boolean
          default: true
          description: >-
            User-maintained lifecycle flag — true = in active use, false =
            stale/retired (the row stays documented but is dimmed in the UI).
            Every new or imported network starts active.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubnetHostStats:
      type: object
      description: >-
        Host-address statistics for ONE documented subnet. IPv4 reserves the
        network + broadcast addresses (RFC 3021 /31 and /32 reserve nothing);
        IPv6 has no such reservations, so its totals are exact powers of two.
        `total`/`free` are strings because a v6 /64's 2^64 addresses overflow
        safe integers.
      required: [cidr, family, total, used, free]
      properties:
        cidr: { type: string, description: "The documented subnet (canonical CIDR)" }
        family: { type: string, enum: [v4, v6] }
        total:
          type: string
          description: "Total usable addresses in this subnet"
        used:
          type: integer
          minimum: 0
          description: "Distinct documented host IPs (documented-hosts page) inside this subnet"
        free:
          type: string
          description: "Free = total − used, clamped at 0"
        firstHost: { type: [string, 'null'], description: "First usable address of the subnet (v6: the network address itself)" }
        lastHost: { type: [string, 'null'], description: "Last usable address of the subnet" }
        broadcastAddress: { type: [string, 'null'], description: "Broadcast address — v4 /30 and larger only; null for v6 (no broadcast concept)" }

    DocumentedNetworkRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: "Primary label / identity of the network; unique case-insensitively"
        subnets:
          type: array
          items: { type: string }
          default: []
          description: "CIDR blocks (\"10.40.0.0/16\", \"fd00::/64\"); canonicalized + deduped server-side; may be empty"
        vlanId:
          type: [integer, 'null']
          minimum: 0
          maximum: 4095
          description: "VLAN id when the network lives in one; null = unknown"
        gateways:
          type: array
          items: { type: string }
          default: []
          description: "Gateway IP literals (bare IPv4/IPv6, no prefix)"
        dnsServers:
          type: array
          items: { type: string }
          default: []
          description: "DNS server IP literals (bare IPv4/IPv6, no prefix)"
        ntpServers:
          type: array
          items: { type: string }
          default: []
          description: "NTP server IP literals (bare IPv4/IPv6, no prefix)"
        friendlyName: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        siteId: { type: [string, 'null'], description: "Site this network is placed at; must exist when set" }
        layerId: { type: [string, 'null'], description: "Topology layer this network sits on; must exist when set" }
        tags:
          type: array
          items: { type: string }
          default: []
          description: "Free-form user tags (same data basis as devices.tags); omitted = none"
        isActive:
          type: boolean
          default: true
          description: "Lifecycle flag — false marks the network stale/retired (new networks default to active)"

    DocumentedNetworkUpdateRequest:
      type: object
      description: >-
        Partial update of a documented network — every property is optional; only
        the provided fields change. When `subnets` / `gateways` / `dnsServers` /
        `ntpServers` are present they REPLACE the full list. The merged result must be a complete
        valid row (a non-empty name), enforced server-side.
      properties:
        name: { type: string, minLength: 1, description: "Replaces the network's identity label" }
        subnets:
          type: array
          items: { type: string }
          description: "Replaces the full subnet list (CIDR blocks)"
        vlanId:
          type: [integer, 'null']
          minimum: 0
          maximum: 4095
          description: "VLAN id; null clears it"
        gateways:
          type: array
          items: { type: string }
          description: "Replaces the full gateway list (IP literals); [] clears all. Omitted = keep current"
        dnsServers:
          type: array
          items: { type: string }
          description: "Replaces the full DNS server list (IP literals); [] clears all. Omitted = keep current"
        ntpServers:
          type: array
          items: { type: string }
          description: "Replaces the full NTP server list (IP literals); [] clears all. Omitted = keep current"
        friendlyName: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        siteId: { type: [string, 'null'], description: "Site this network is placed at; must exist when set" }
        layerId: { type: [string, 'null'], description: "Topology layer this network sits on; must exist when set" }
        tags:
          type: array
          items: { type: string }
          description: "Replaces the full tag list (same data basis as devices.tags); [] clears all. Omitted = keep current"
        isActive:
          type: boolean
          description: "Lifecycle flag — true = active use, false = stale/retired. Omitted = keep the current value"

    DocumentedNetworkImportResult:
      type: object
      required: [created, updated, skipped, errors]
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer, description: "Matched rows left untouched (updateExisting=false)" }
        errors:
          type: array
          items:
            type: object
            required: [index, error]
            properties:
              index: { type: integer, description: "0-based position in the submitted batch" }
              error: { type: string }

    DocumentedNetworkInventoryImportRequest:
      type: object
      properties:
        skipWithoutSubnet:
          type: boolean
          default: true
          description: "Skip live logical networks without any real subnet (pure SSID/VLAN groups)"
        skipWithoutVlan:
          type: boolean
          default: false
          description: "Skip live logical networks with no discovered VLAN id"
        version:
          type: string
          enum: [all, v4, v6]
          default: all
          description: "Only import networks carrying at least one subnet of this address family"
        publicIpv4Policy:
          type: string
          enum: [keep, strip, skip-network]
          default: keep
          description: >-
            Policy for publicly routable IPv4 subnets (RFC 1918 + loopback/
            link-local count as internal). strip removes only the public v4
            subnets — the network is still documented with its internal ones;
            skip-network drops the whole network when it has any public v4 subnet.
        publicIpv6Policy:
          type: string
          enum: [keep, strip, skip-network]
          default: keep
          description: >-
            Policy for publicly routable IPv6 subnets (GUA 2000::/3; ULA fc00::/7
            counts as internal). strip removes only the public v6 subnets — the
            network is still documented with its internal ones; skip-network drops
            the whole network when it has any public v6 subnet.
        rangeMode:
          type: string
          enum: [keep-all, include-only, exclude]
          default: keep-all
          description: "Network/range filter applied BEFORE all other options. include-only imports only networks with a subnet inside one of `ranges`; exclude skips such networks"
        ranges:
          type: array
          items:
            type: string
          default: []
          description: "CIDR blocks (192.168.1.0/24, fd00::/64) and/or inclusive IP ranges (192.168.1.10-192.168.1.50). A network matches when ANY of its subnets falls into ANY entry; empty = no range filtering"
        maxAgeHours:
          type: number
          minimum: 0
          default: 24
          description: "Only import networks observed within this many hours (0 = all)"
        dryRun:
          type: boolean
          default: true
          description: "Preview only — compute the plan without writing anything"

    DocumentedNetworkInventoryImportResult:
      type: object
      required: [dryRun, totalLiveNetworks, planned, created, updated, skipped]
      properties:
        dryRun: { type: boolean }
        totalLiveNetworks: { type: integer, description: "Live logical networks considered (within the age window)" }
        planned:
          type: array
          items:
            type: object
            required: [name, subnets, vlanId, action]
            properties:
              name: { type: string, description: "Display label of the live logical network" }
              subnets:
                type: array
                items: { type: string }
                description: "Real subnets of this network (empty for pure SSID/VLAN groups)"
              vlanId:
                type: [integer, 'null']
                minimum: 0
                maximum: 4095
                description: "Discovered VLAN id; null when unknown"
              action: { type: string, enum: [create, update, skip] }
              reason: { type: string, description: "Why the network is skipped (action=skip only)" }
              stripped:
                type: integer
                description: "Public subnets removed by a 'strip' policy (action=create/update only)"
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }

    NetworkLayer:
      type: object
      description: >-
        One network layer — a horizontal band of the topology view. Built-ins
        (core/distribution/access/endpoint) are seeded at boot; custom layers
        are user-created and deletable when unreferenced.
      required: [id, name, sort, color, isBuiltin]
      properties:
        id: { type: string, description: "Stable layer id (built-ins: core | distribution | access | endpoint)" }
        name: { type: string, description: "Display name of the band" }
        sort: { type: integer, description: "Band order — 1 is topmost" }
        color: { type: string, description: "Hex accent color (e.g. \"#e11d48\") used for band headers + device chips" }
        isBuiltin: { type: boolean, description: "Seeded at boot; cannot be deleted" }

    LayerCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64, description: "Display name of the new layer (unique)" }
        color: { type: string, pattern: '^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$', default: '#8b5cf6', description: "Hex accent color" }

    LayerUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 64 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$' }
        sort: { type: integer, minimum: 1 }

    TopologyPort:
      type: object
      description: "A physical port as reported by the device's latest telemetry snapshot (switches/APs that report port detail)"
      required: [name, vlans]
      properties:
        name: { type: string }
        linkUp:
          type: [string, 'null']
          enum: [up, down, null]
        speed: { type: [string, 'null'], description: "Speed label as reported by the plugin (e.g. '1 Gbit')" }
        mode: { type: [string, 'null'], description: "Port VLAN mode when reported: access | trunk | hybrid" }
        pvid: { type: [integer, 'null'], description: "Access (PVID) VLAN id when reported" }
        vlans:
          type: array
          items: { type: integer }
          description: "VLAN ids traversing this port — drives the per-VLAN edge coloring in trunk mode"
        mac: { type: [string, 'null']}

    TopologyNode:
      type: object
      description: >-
        One node of the topology graph. `kind` discriminates the shape:
        device nodes carry ports + VLAN participation; segment nodes are merged
        logical networks (VLAN/subnet groups); host nodes are end-hosts
        (only present when includeHosts was set); remote nodes are tunnel peers
        that are not part of this inventory.
      required: [id, kind]
      properties:
        id: { type: string, description: "Stable node id ('device:<id>', 'segment:<key>', 'host:<mac>' or 'remote:<address>')" }
        kind:
          type: string
          enum: [device, segment, host, remote]
        name: { type: [string, 'null'], description: "Device display name (kind=device)" }
        status: { type: [string, 'null'], description: "Device status (kind=device): unknown | online | degraded | offline | critical" }
        siteId: { type: [string, 'null']}
        managementAddress: { type: [string, 'null']}
        layer:
          type: string
          description: "Resolved network-layer id this device is drawn in (kind=device) — manual override > plugin-suggested model default > heuristic > 'access'"
        ports:
          type: array
          items:
            $ref: '#/components/schemas/TopologyPort'
          description: "Physical port detail (kind=device; empty when the plugin reports no port table)"
        vlans:
          type: array
          items: { type: integer }
          description: "VLAN ids this device participates in (kind=device)"
        label: { type: [string, 'null'], description: "Display label — segment subnet/'VLAN <id>' (kind=segment) or '<type> → <address>' (kind=remote)" }
        vlanId: { type: [integer, 'null']}
        subnets:
          type: array
          items: { type: string }
          description: "All real subnets of the segment, IPv4 first (kind=segment)"
        mac: { type: [string, 'null'], description: "Host MAC (kind=host)" }
        hostname: { type: [string, 'null']}

    TopologyEdge:
      type: object
      description: >-
        One edge of the topology graph. `kind` discriminates: cable = inferred
        physical link (`via` records the evidence), tunnel = overlay link,
        membership = device/host belongs to a logical segment.
      required: [id, source, target, kind]
      properties:
        id: { type: string }
        source: { type: string, description: "Source node id" }
        target: { type: string, description: "Target node id" }
        kind:
          type: string
          enum: [cable, tunnel, membership]
        via:
          type: [string, 'null']
          enum: [mac-table, lacp, null]
          description: "Evidence the cable was inferred from (kind=cable)"
        portA: { type: [string, 'null'], description: "Port on the source device (kind=cable)" }
        portB: { type: [string, 'null'], description: "Interface on the target device (kind=cable; null when unknown)" }
        vlans:
          type: array
          items: { type: integer }
          description: "VLANs traversing the observing port — one colored line per VLAN in trunk mode (kind=cable; empty = unknown)"
        type: { type: [string, 'null'], description: "Tunnel technology (kind=tunnel): wireguard | openvpn | ipsec | pppoe | gre" }
        status: { type: [string, 'null']}

    TopologyResponse:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TopologyNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TopologyEdge'

    TunnelRow:
      type: object
      required: [deviceId, pluginId, name, type, status, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the device this tunnel is configured on" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this tunnel" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        name: { type: string, description: "Tunnel/interface name on the device (e.g. wg0, IPSEC-1, gre1)" }
        type:
          type: string
          enum: [wireguard, openvpn, ipsec, pppoe, gre]
          description: "Normalized tunnel technology"
        peerAddress: { type: string, description: "Remote endpoint (peer IP/FQDN, remote gateway, GRE destination); '' = unknown" }
        localAddress: { type: string, description: "Local side of the tunnel (WG server IP, local gateway, PPPoE WAN IP); '' = unknown" }
        subnet: { type: [string, 'null'], description: "Tunnel subnet / assigned network (e.g. 10.99.0.0/24)" }
        status:
          type: string
          enum: [up, down, enabled, disabled, unknown]
          description: "What the plugin can observe — live state where available, config state otherwise"
        uptimeSeconds: { type: [number, 'null'], description: "Live session uptime in seconds (null when not a live-session metric)" }
        lastHandshakeSeconds: { type: [number, 'null'], description: "Seconds since the last handshake (WireGuard peers; null = no live data)" }
        interfaceName: { type: [string, 'null'], description: "Kernel interface carrying the tunnel traffic" }
        rxRate: { type: [number, 'null'], description: "Receive rate in bytes/s (plugin-computed counter delta; null when unavailable)" }
        txRate: { type: [number, 'null'], description: "Transmit rate in bytes/s (plugin-computed counter delta; null when unavailable)" }
        extra:
          type: object
          additionalProperties: true
          description: "Type-specific extras (ikeType, cryptAlg, mode, allowedIPs, ...)"
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this tunnel" }

    CertificateRow:
      type: object
      required: [deviceId, pluginId, name, type, host, commonName, subject, issuer, selfSigned, notBefore, notAfter, keyAlgorithm, signatureAlgorithm, sanNames, serialNumber, chain, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the device this endpoint belongs to" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this endpoint" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        name: { type: string, description: "Stable endpoint identity on the device (e.g. https:443, ssh:22)" }
        type:
          type: string
          enum: [https, ssh]
          description: "What kind of credential material is presented — TLS certificate vs. SSH host key"
        host: { type: string, description: "Hostname/IP probed (the management address); '' = unknown" }
        port: { type: [integer, 'null'], description: "Port probed (443 for https, 22 for ssh)" }
        fingerprint: { type: [string, 'null'], description: "SHA-256 fingerprint of the leaf cert / SSH host key currently OBSERVED (OpenSSH-style SHA256:<base64>)" }
        trustedFingerprint: { type: [string, 'null'], description: "The TRUSTED (pinned) fingerprint — what plugins verify against before transmitting credentials. Seeded from the first observation; changed only by explicit acceptance (POST /certificates/accept)." }
        fingerprintMismatch: { type: boolean, description: "True when the endpoint currently presents a DIFFERENT key than trusted — strict pinning refuses connections until accepted" }
        commonName: { type: string, description: "Subject Common Name; ssh rows carry a synthetic label like 'SSH Host Key'" }
        subject: { type: string, description: "Full subject distinguished name" }
        issuer: { type: string, description: "Issuer distinguished name" }
        selfSigned: { type: boolean, description: "True when issuer === subject (self-signed)" }
        notBefore: { type: string, format: date-time, description: "Validity start; empty for ssh host keys" }
        notAfter: { type: string, format: date-time, description: "Expiry; empty for ssh host keys" }
        keyAlgorithm: { type: string, description: "Public key algorithm (RSA, ECDSA, ED25519, ...)" }
        keySizeBits: { type: [integer, 'null'], description: "Key size in bits (RSA modulus); null for EC/Ed keys" }
        curveName: { type: [string, 'null'], description: "Elliptic curve name for EC keys; null otherwise" }
        signatureAlgorithm: { type: string, description: "Signature algorithm (friendly name when known)" }
        sanNames:
          type: array
          items: { type: string }
          description: "SAN DNS names + IPs as reported by the certificate; empty for ssh rows"
        serialNumber: { type: string, description: "Serial number (hex); empty for ssh rows" }
        valid: { type: [boolean, 'null'], description: "Chain-validation verdict — every cert in the served chain inside its validity window AND signatures verify. Null when no cert could be read." }
        invalidReason: { type: [string, 'null'], description: "Human-readable reason when valid === false (e.g. expired issuer), else null" }
        daysToExpiry: { type: [integer, 'null'], description: "Days until the LEAF expires (negative = already expired); null when n/a" }
        chainDaysToExpiry: { type: [integer, 'null'], description: "Days until the EARLIEST chain element expires — an issuer expiring before its leaf is a real break; null when n/a" }
        chain:
          type: array
          items:
            $ref: '#/components/schemas/CertificateInfo'
          description: "Full served chain (leaf first) for issuer validation"
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this endpoint" }

    CertificateInfo:
      type: object
      required: [commonName, subject, issuer, selfSigned, notBefore, notAfter, keyAlgorithm, signatureAlgorithm, sanNames, serialNumber]
      properties:
        commonName: { type: string }
        subject: { type: string }
        issuer: { type: string }
        selfSigned: { type: boolean }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        keyAlgorithm: { type: string }
        keySizeBits: { type: [integer, 'null'] }
        curveName: { type: [string, 'null'] }
        signatureAlgorithm: { type: string }
        sanNames:
          type: array
          items: { type: string }
        serialNumber: { type: string }

    CertificateHistoryRow:
      type: object
      required: [deviceId, pluginId, name, type, fingerprint, firstSeenAt, lastSeenAt]
      properties:
        deviceId: { type: string }
        pluginId: { type: string }
        name: { type: string, description: "Endpoint identity (e.g. https:443, ssh:22)" }
        type:
          type: string
          enum: [https, ssh]
        fingerprint: { type: string, description: "SHA-256 fingerprint of the key observed during this window" }
        commonName: { type: string }
        subject: { type: string }
        issuer: { type: string }
        selfSigned: { type: boolean }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        keyAlgorithm: { type: string }
        keySizeBits: { type: [integer, 'null'] }
        curveName: { type: [string, 'null'] }
        signatureAlgorithm: { type: string }
        firstSeenAt: { type: string, format: date-time, description: "First time this fingerprint was observed on the endpoint" }
        lastSeenAt: { type: string, format: date-time, description: "Last time it was still the current key" }

    RouteRow:
      type: object
      required: [deviceId, pluginId, destination, protocol, status, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the device this route is configured on" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this route" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        destination: { type: string, description: "Destination network as CIDR (e.g. 10.25.0.0/16, 0.0.0.0/0 for default)" }
        gateway: { type: string, description: "Next-hop gateway address or name; '' = directly connected / unknown" }
        protocol:
          type: string
          enum: [static, connected, ospf, bgp, rip, other]
          description: "Normalized route origin — static config vs. dynamically learned (OSPF/BGP/RIP)"
        distance: { type: [number, 'null'], description: "Administrative distance (null when the source doesn't expose it)" }
        metric: { type: [number, 'null'], description: "Route metric / cost (null when n/a)" }
        mtu: { type: [integer, 'null'], description: "Per-route MTU override (null when n/a)" }
        status:
          type: string
          enum: [active, inactive, unknown]
          description: "What the plugin can observe — installed/active vs. configured-but-inactive"
        extra:
          type: object
          additionalProperties: true
          description: "Protocol-specific extras (uuid, description, gatewayStatus, gatewayLatencyMs for OPNsense; rtgTag, peer, rawType for LCOS)"
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this route" }

    FirewallRuleRow:
      type: object
      required: [deviceId, pluginId, ruleType, vendorRuleId, position, action, enabled, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the device this firewall is configured on" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this rule" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        ruleType:
          type: string
          enum: [filter, dnat, snat, one-to-one, npt]
          description: "Normalized rule kind — filter rules vs. NAT kinds (RouterOS srcnat→snat, dstnat→dnat)"
        vendorRuleId: { type: string, description: "Stable vendor-side identity (OPNsense uuid / RouterOS .id); part of the row key" }
        position: { type: integer, description: "Order within its rule set on the device (0-based; display data only)" }
        protocol: { type: string, description: "Normalized protocol name (tcp, udp, icmp, ...); '' = any/unknown" }
        sourceIp: { type: string, description: "Source network/CIDR or alias name as configured; '' = any" }
        destIp: { type: string, description: "Destination network/CIDR or alias name as configured; '' = any" }
        sourcePort: { type: [string, 'null'], description: "Source port(s) — single port or range string (null when n/a)" }
        destPort: { type: [string, 'null'], description: "Destination port(s) — single port or range string (null when n/a)" }
        action:
          type: string
          enum: [allow, deny, other]
          description: "Normalized verdict — allow/deny for filter rules; NAT actions map to 'other'"
        enabled: { type: boolean, description: "Whether the rule is active on the device" }
        description: { type: string, description: "Rule description / comment; '' = none" }
        scope: { type: string, description: "Where the rule applies (OPNsense interface, RouterOS chain + iface lists)" }
        ipVersion:
          type: string
          enum: [v4, v6, both]
          description: "IP family the rule applies to — OPNsense `family`/`ipprotocol`, RouterOS derived from address text; 'both' when unconstrained"
        packets: { type: [integer, 'null'], description: "Live hit counter — packets matched by this rule (RouterOS only; null when not reported)" }
        bytes: { type: [integer, 'null'], description: "Live hit counter — bytes matched by this rule (RouterOS only; null when not reported)" }
        states: { type: [integer, 'null'], description: "Current connection-state count for this rule (not yet reported by any vendor; reserved)" }
        extra:
          type: object
          additionalProperties: true
          description: "Vendor-specific extras (uuid, family, log, tag, quick, state, resolvedSource/resolvedDest for OPNsense; connection-state, time, address-list, srcAddressLists/dstAddressLists with list contents for RouterOS)"
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this rule" }
        sourceResolved:
          type: object
          allOf:
            - $ref: '#/components/schemas/FirewallAddressResolution'
          nullable: true
          description: "Cross-device resolution of the source address against the networks + hosts inventory (null when nothing matched — alias names without a known subnet or host)"
        destResolved:
          type: object
          allOf:
            - $ref: '#/components/schemas/FirewallAddressResolution'
          nullable: true
          description: "Cross-device resolution of the destination address against the networks + hosts inventory (null when nothing matched)"

    FirewallResolvedHost:
      type: object
      required: [mac, ips]
      properties:
        mac: { type: string, description: "MAC address (canonical lowercase colon form)" }
        ips:
          type: array
          items: { type: string }
          description: "All known addresses of this host, IPv4 first"
        hostname: { type: [string, 'null'], description: "Hostname when a DHCP/NDP source reported one" }
        manufacturer: { type: [string, 'null'], description: "OUI-derived vendor name (ARP rows)" }
        devices:
          type: array
          items: { type: string }
          description: "Device names that observed this host (deduped)"

    FirewallAddressResolution:
      type: object
      required: [subnets, interfaces, hostCount, hosts, unresolved]
      properties:
        subnets:
          type: array
          items: { type: string }
          description: "Known subnets the address covers (e.g. 192.168.1.0/24), IPv4 first"
        interfaces:
          type: array
          items: { type: string }
          description: "Interfaces carrying those subnets, labeled 'DeviceName: iface'"
        hostCount: { type: integer, description: "Number of discovered hosts inside the address (may exceed hosts.length)" }
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/FirewallResolvedHost'
          description: "Matched hosts, capped at 50 for payload size"
        unresolved:
          type: array
          items: { type: string }
          description: "Tokens that are neither IP literals nor CIDRs — alias names not expandable from the inventory"

    StorageFilesystemRow:
      type: object
      required: [deviceId, pluginId, name, type, status, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the device this filesystem lives on" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this filesystem" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        name: { type: string, description: "Filesystem/pool/dataset/zvol name (e.g. DATA01, tank/vm, tank/zvols/disk0)" }
        type:
          type: string
          enum: [zfs-pool, zfs-dataset, zfs-zvol, ext4, squashfs, usb, other]
          description: "Normalized filesystem class (lowercase at ingest; 'other' when the plugin does not classify). zfs-zvol = ZFS block device (VM disk / iSCSI LUN)"
        mountpoint: { type: [string, 'null'], description: "Mountpoint (null for unmounted datasets / pools without a mount)" }
        sizeBytes: { type: [number, 'null'] }
        usedBytes: { type: [number, 'null'] }
        freeBytes: { type: [number, 'null'] }
        status:
          type: string
          description: "ONLINE/DEGRADED/OFFLINE (ZFS) or up/down/unknown — lowercase at ingest"
        parent: { type: [string, 'null'], description: "IMMEDIATE parent name (pool or dataset) — the UI nests hierarchically via this field; null for top-level pools/filesystems" }
        extra:
          type: object
          additionalProperties: true
          description: "Plugin-specific details (ZFS dataset props — quota, used-bytes breakdown, compression, mount options — consumed by expandable rows and future config/state endpoints)"
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this filesystem" }

    StorageDiskRow:
      type: object
      required: [deviceId, pluginId, name, rotationRate, health, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the device this disk is installed in" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this disk" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        name: { type: string, description: "Disk name/identifier (e.g. da0, sda)" }
        model: { type: [string, 'null'] }
        serial: { type: [string, 'null'] }
        capacityBytes: { type: [number, 'null'] }
        rotationRate:
          type: string
          enum: [hdd, ssd, flash, unknown]
          description: "Rotation-rate class (lowercase at ingest)"
        health:
          type: string
          description: "healthy | degraded | failed | unknown — lowercase at ingest"
        poolName: { type: [string, 'null'], description: "Pool this disk belongs to; null for unassigned/boot disks" }
        extra:
          type: object
          additionalProperties: true
          description: "Plugin-specific details (temperature, power state, ...) — same contract as StorageFilesystemRow.extra"
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this disk" }

    StorageOverview:
      type: object
      required: [filesystems, disks]
      properties:
        filesystems:
          type: array
          items:
            $ref: '#/components/schemas/StorageFilesystemRow'
        disks:
          type: array
          items:
            $ref: '#/components/schemas/StorageDiskRow'

    ShareRow:
      type: object
      required: [deviceId, pluginId, name, type, status, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the device this share lives on" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this share" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        name: { type: string, description: "Share/export name (SMB share name, NFS path, iSCSI target, NVMe-oF NQN)" }
        type:
          type: string
          enum: [smb, nfs, iscsi, nvmeof]
          description: "Share protocol — normalized to lowercase at ingest"
        path: { type: [string, 'null'], description: "Dataset/path backing the share; null for block-protocol targets without a path" }
        status:
          type: string
          enum: [up, down, enabled, disabled, unknown]
          description: "Share state as observed by the plugin — lowercase at ingest"
        sessionCount: { type: [integer, 'null'], description: "Number of active client sessions on this share; null when not observable" }
        extra:
          type: object
          additionalProperties: true
          description: >-
            Plugin-specific details (JSON): smb {comment}, nfs {readOnly, hosts[]},
            iscsi {id, iscsiName, datasets[]}, nvmeof {id, serialNumber, modelNumber, namespaces[]}.
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this share" }

    ShareSessionRow:
      type: object
      required: [deviceId, pluginId, type, shareName, clientAddress, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the device this session is on" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this session" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        type:
          type: string
          enum: [smb, nfs]
          description: "Protocol of this client session — lowercase at ingest"
        shareName: { type: string, description: "Share/export name the client is connected to; empty for NFS sessions without a resolvable share" }
        clientAddress: { type: string, description: "Client host address (IP or hostname); empty when unknown" }
        user: { type: [string, 'null'], description: "Client username (SMB); null for NFS" }
        uptimeSeconds: { type: [number, 'null'], description: "Seconds this session has been open; null when not observable" }
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this session" }

    SharesOverview:
      type: object
      required: [shares, sessions]
      properties:
        shares:
          type: array
          items:
            $ref: '#/components/schemas/ShareRow'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ShareSessionRow'

    ContainerRow:
      type: object
      required: [deviceId, pluginId, name, state, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the device this app runs on" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this container" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        name: { type: string, description: "App/container name (e.g. radius05, zabbix05-proxy12)" }
        state:
          type: string
          description: "RUNNING | STOPPED | ... — app-level workload state (uppercase at emit)"
        image: { type: [string, 'null'], description: "Container image for single-container apps; null for multi-service workloads" }
        version: { type: [string, 'null'], description: "Human version string from the app catalog (e.g. 1.0.0_custom)" }
        upgradeAvailable: { type: [boolean, 'null'], description: "True when an app or image update is available on the appliance" }
        startedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            UNM-observed start of the current RUNNING period (ISO-8601). The TrueNAS
            public API exposes no container start-time, so this is tracked by the
            telemetry worker from state transitions — stamped when a row first appears
            RUNNING and cleared when it leaves RUNNING. NULL for non-RUNNING rows or
            apps observed already-running (true uptime unknown; UI shows "≥ X").
        extra:
          type: object
          additionalProperties: true
          description: >-
            Plugin-specific details (JSON): networks[] {name, driver?, subnets?},
            ips[] (static container IPs from the compose config), ports[] (published
            host ports), containerCount, containers[] per-service detail, volumeMounts[].
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this app" }

    DockerImageRow:
      type: object
      required: [deviceId, pluginId, name, dangling, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the device this image lives on" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this image" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        name: { type: string, description: "Full image reference (e.g. nginx:1.27-alpine, ghcr.io/x/y@sha256:...)" }
        sizeBytes: { type: [number, 'null'], description: "Image size in bytes as reported by the plugin's API" }
        createdAt: { type: [string, 'null'], format: date-time, description: "ISO-8601 creation timestamp of the image" }
        updateAvailable: { type: [boolean, 'null'], description: "True when a newer version is available (TrueNAS app.image.update_available; null for plain Docker hosts)" }
        dangling: { type: boolean, description: "True for dangling images (<none>:<none> / unreferenced layers)" }
        extra:
          type: object
          additionalProperties: true
          description: "Plugin-specific details (JSON) — same contract as ContainerRow.extra"
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this image" }

    UpdateRow:
      type: object
      required: [deviceId, pluginId, kind, name, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the device this update is for" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this update" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        kind:
          type: string
          enum: [firmware, os-package, docker-image, app]
          description: "Update kind (plugins may emit custom kinds)"
        name: { type: string, description: "Stable identity within (device, kind): 'os' for firmware, a package name, an app or image name" }
        currentVersion: { type: [string, 'null'] }
        latestVersion: { type: [string, 'null'] }
        rebootRequired: { type: [boolean, 'null'], description: "True when applying this update requires a device reboot" }
        sizeBytes: { type: [number, 'null'] }
        releaseNotesUrl:
          type: [string, 'null']
          description: >-
            Vendor release-notes URL for this update (changelog page or docs
            anchor) — shown as a link on the Updates page. Null when the plugin
            has no notes source for this row.
        releaseNotes:
          type: [string, 'null']
          description: >-
            Release-notes TEXT propagated directly from the device's own update
            feed (e.g. TrueNAS `update.available_versions`, which its web UI also
            shows). Rendered inline on the Updates page; capped at 16 KB at ingest.
        branch:
          type: [string, 'null']
          description: >-
            The device's current update branch/channel (TrueNAS update profile
            like GENERAL/EARLY_ADOPTER, distro line, vendor firmware track) —
            shown in the Updates page Branch column. Null when the reporting
            plugin does not expose a branch concept for this row.
        applyActionId:
          type: [string, 'null']
          description: >-
            Catalog action id (of the reporting plugin) that applies this row —
            the webapp's Update button fires it through the plan workflow.
            Null = no safe apply path; the row shows as available without a button.
        applyInput:
          type: object
          additionalProperties: true
          description: "Prefilled input for applyActionId"
        extra:
          type: object
          additionalProperties: true
          description: "Plugin-specific details (JSON) — e.g. the package manager id for os-package rows"
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this update" }

    StackUpdateInfo:
      type: object
      required: [apiVersion, plugins, feedConfigured]
      properties:
        apiVersion: { type: string, description: "Running API version (UNM_VERSION env or package.json)" }
        plugins:
          type: array
          items:
            type: object
            required: [name, version]
            properties:
              name: { type: string }
              version: { type: string }
          description: "Discovered plugin instances + their versions"
        feedConfigured: { type: boolean, description: "True when the updateFeedUrl system setting is set" }
        latestApiVersion: { type: [string, 'null'], description: "Latest version from the configured release feed (null = no feed / fetch failed)" }
        available: { type: boolean, description: "True when the feed reports a newer version than the running one" }
        notesUrl: { type: [string, 'null'], description: "Release notes URL from the manifest, if present" }

    UpdatesResponse:
      type: object
      required: [rows, stack]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/UpdateRow'
        stack:
          $ref: '#/components/schemas/StackUpdateInfo'

    ContainersOverview:
      type: object
      required: [containers, images]
      properties:
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerRow'
        images:
          type: array
          description: "Docker image inventory for the page's collapsible images panel (generic `images[]` metric)"
          items:
            $ref: '#/components/schemas/DockerImageRow'

    DeviceTimeRow:
      type: object
      required: [deviceId, name, managementAddress, available, unmNowMs]
      properties:
        deviceId: { type: string }
        name: { type: string }
        managementAddress: { type: string }
        siteId: { type: [string, 'null'] }
        pluginId: { type: [string, 'null'], description: "Plugin that produced the latest snapshot (lets the page target a live probe)" }
        collectedAt: { type: [string, 'null'], format: date-time, description: "ISO timestamp of the underlying telemetry row" }
        available: { type: boolean, description: "True when an absolute instant could be resolved from the device's reported clock" }
        localIso: { type: [string, 'null'], description: "Device's local wall clock as reported (ISO-8601, may carry an offset)" }
        timezone: { type: [string, 'null'], description: "IANA timezone identifier when known" }
        utcOffsetMinutes: { type: [integer, 'null'], description: "Fixed UTC offset in minutes baked into the reading (when no IANA zone)" }
        deviceEpochMs: { type: [integer, 'null'], description: "Absolute instant of the device clock, epoch ms" }
        unmNowMs: { type: integer, description: "UNM's own clock at response time, epoch ms" }
        driftMs: { type: [integer, 'null'], description: "deviceEpochMs − reading instant — positive = device ahead, negative = behind" }
        ntpAvailable: { type: boolean, description: "True when the device serves a time over its NTP/SNTP service (generic-ntp plugin)" }
        ntpPluginId: { type: [string, 'null'], description: "Plugin that produced the latest NTP-served reading (lets the page target a live probe)" }
        ntpCollectedAt: { type: [string, 'null'], format: date-time, description: "ISO timestamp of the underlying NTP telemetry row" }
        ntpTimeUtc: { type: [string, 'null'], description: "UTC wall clock served by the device's NTP service (ISO-8601 …Z) — distinct from its own system clock" }
        ntpEpochMs: { type: [integer, 'null'], description: "Absolute instant served over NTP, epoch ms" }
        ntpStratum: { type: [integer, 'null'], description: "NTP stratum of the source (1 = reference clock … 15 = unsynchronized)" }
        ntpReferenceId: { type: [string, 'null'], description: "NTP reference ID (dotted IPv4 for stratum ≤ 1, else a 4-char tag like GOOG)" }
        ntpDriftMs: { type: [integer, 'null'], description: "ntpEpochMs − reading instant — positive = served time ahead of UNM" }

    DeviceTimeOverview:
      type: object
      required: [unmNowMs, devices]
      properties:
        unmNowMs: { type: integer, description: "UNM's own clock at response time, epoch ms (the reference for all rows)" }
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceTimeRow'

    VmRow:
      type: object
      required: [deviceId, pluginId, name, state, collectedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Display name of the hypervisor this VM runs on" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginId: { type: string, description: "Plugin instance id that reported this VM" }
        pluginName: { type: [string, 'null'], description: "Display name of the reporting plugin instance" }
        name: { type: string, description: "VM name as reported (e.g. win11-01)" }
        state:
          type: string
          description: "RUNNING | STOPPED | SUSPENDED | ... — VM runtime state (uppercase at emit)"
        vcpus: { type: [integer, 'null'], description: "Number of virtual CPUs allocated to the VM" }
        memoryMiB: { type: [number, 'null'], description: "Memory allocated in MiB" }
        archType: { type: [string, 'null'], description: "Guest architecture / machine type when reported (e.g. x86_64)" }
        startedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            UNM-observed start of the current RUNNING period (ISO-8601), tracked by
            the telemetry worker from state transitions — stamped when a row first
            appears RUNNING and cleared when it leaves RUNNING. NULL for non-RUNNING
            rows or VMs observed already-running (true uptime unknown).
        extra:
          type: object
          additionalProperties: true
          description: >-
            Plugin-specific details (JSON): nics[] {mac, type?, nicAttach?} (the NIC
            MACs feed the Hosts page with source 'vm'), disks[], description, uuid,
            autostart, ...
        collectedAt: { type: string, format: date-time, description: "When the reporting plugin last observed this VM" }

    VmsOverview:
      type: object
      required: [vms]
      properties:
        vms:
          type: array
          items:
            $ref: '#/components/schemas/VmRow'

    WifiOverview:
      type: object
      required: [ssids, bands, neighbors]
      properties:
        ssids:
          type: array
          items:
            $ref: '#/components/schemas/WifiSsidGroup'
        bands:
          type: array
          description: "Per-band spectrum view (2.4 / 5 / 6 GHz): one bar per channel + noise floor + own-SSID markers"
          items:
            $ref: '#/components/schemas/WifiBandView'
        neighbors:
          type: array
          description: "Neighbor networks seen by device scan engines (own BSSIDs excluded), strongest signal first"
          items:
            $ref: '#/components/schemas/WifiNeighborRef'

    WifiSsidGroup:
      type: object
      required: [name, channels, security, clientCount]
      properties:
        name: { type: string, description: "SSID / network name (grouping key)" }
        channels:
          type: array
          description: "Distinct (band, channel) pairs broadcasting this SSID"
          items:
            $ref: '#/components/schemas/WifiChannelRef'
        security:
          type: array
          description: "Distinct encryption values across the group (empty when not exposed)"
          items: { type: string }
        vlanId: { type: [number, 'null'], description: "VLAN id — only set when unique across ALL rows of this SSID" }
        clientCount: { type: integer, description: "Connected clients currently associated with this SSID (across all devices)" }
        airtimeMeanPct: { type: [number, 'null'], description: "Mean airtime utilization (%) over all channels/devices of this SSID; null when no data" }
        airtimeMaxPct: { type: [number, 'null'], description: "Maximum airtime utilization (%) over all channels/devices of this SSID; null when no data" }
        devices:
          type: array
          description: "Devices broadcasting this SSID (one entry per device+plugin instance)"
          items:
            $ref: '#/components/schemas/WifiDeviceRef'

    WifiChannelRef:
      type: object
      required: [band]
      properties:
        band: { type: string, description: "'2.4' | '5' | '6'; '' when the device cannot say which band" }
        channel: { type: [number, 'null'], description: "Channel number on that band; null when unknown" }

    WifiDeviceRef:
      type: object
      required: [deviceId]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'] }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        pluginName: { type: [string, 'null'] }
        interfaces:
          type: array
          description: "Radio interface(s) broadcasting this SSID (e.g. WLAN-1)"
          items: { type: string }

    WifiBandView:
      type: object
      required: [band, channels, markers]
      properties:
        band: { type: string, enum: ['2.4', '5', '6'] }
        minChannel: { type: [number, 'null'], description: "Lowest channel in use on this band (for axis scaling); null when empty" }
        maxChannel: { type: [number, 'null'], description: "Highest channel in use on this band; null when empty" }
        noiseFloorDbm: { type: [number, 'null'], description: "Noisiest radio noise floor (dBm) on this band — the shaded line under the bars; null when no radio reports it" }
        channels:
          type: array
          description: "One entry per channel with airtime data or an own SSID (inSSIDer-style bar chart)"
          items:
            $ref: '#/components/schemas/WifiChannelBar'
        markers:
          type: array
          description: "Own SSIDs at their channel position (deduped per name+channel)"
          items:
            $ref: '#/components/schemas/WifiSsidMarker'

    WifiChannelBar:
      type: object
      required: [channel]
      properties:
        channel: { type: number }
        utilizationPct: { type: [number, 'null'], description: "Worst-case airtime utilization (%) across all devices reporting this channel; null when no device reports a value" }

    WifiSsidMarker:
      type: object
      required: [name, channel]
      properties:
        name: { type: string, description: "Own SSID broadcasting on this channel" }
        channel: { type: number }

    WifiNeighborRef:
      type: object
      required: [deviceId, bssid]
      properties:
        deviceId: { type: string }
        deviceName: { type: [string, 'null'], description: "Device whose scan engine saw this network" }
        managementAddress: { type: [string, 'null'] }
        siteName: { type: [string, 'null'] }
        bssid: { type: string }
        ssid: { type: [string, 'null'], description: "Neighbor SSID name; null when hidden/unknown" }
        band: { type: string, description: "'2.4' | '5' | '6'; '' when unknown" }
        channel: { type: [number, 'null'] }
        signalDbm: { type: [number, 'null'], description: "Received signal strength (dBm) at the scanning device" }

    # One plugin's monitoring snapshot for a device (a device can have several).
    PluginTelemetrySnapshot:
      type: object
      required: [pluginId, health, metrics]
      properties:
        pluginId: { type: string }
        collectedAt: { type: string, format: date-time, description: "null when the plugin has not reported yet" }
        health:
          type: string
          enum: [ok, warning, degraded, critical, unknown]
        metrics:
          type: object
          additionalProperties: true
        metricDescriptors:
          type: array
          items:
            $ref: '#/components/schemas/MetricDescriptor'

    TelemetrySnapshot:
      type: object
      required: [deviceId, health, snapshots]
      properties:
        deviceId: { type: string }
        # Overall device health = worst-wins across all plugin assignments.
        health:
          type: string
          enum: [ok, warning, degraded, critical, unknown]
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/PluginTelemetrySnapshot'

    # --- Device state (per-device Config page) ------------------------------
    # The dynamic device-state document a plugin serves from GET /state. The
    # API brokers it verbatim; plugins own the shape. Actions reference ids in
    # the plugin's action catalog and are executed through the plan workflow.

    StateActionRef:
      type: object
      required: [actionId]
      properties:
        actionId: { type: string, description: "Catalog entry id of this plugin (deviceCount 1)" }
        prefill:
          type: object
          additionalProperties: true
          description: "Pre-filled input values merged under the schema defaults"

    StateItem:
      type: object
      required: [key, title, fields]
      properties:
        key: { type: string }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        status:
          type: string
          description: "up | down | enabled | disabled | ok | degraded | critical (free string)"
          nullable: true
        fields:
          type: object
          additionalProperties:
            oneOf: [{ type: string }, { type: number }, { type: 'null' }]
        actions:
          type: array
          items:
            $ref: '#/components/schemas/StateActionRef'

    SwitchPortGroup:
      type: object
      required: [id, portKeys]
      properties:
        id: { type: string }
        label:
          type: string
          nullable: true
          description: "Band header rendered above the ports (e.g. 'RJ45', 'SFP+'); null/omitted = unlabeled band"
        portKeys:
          type: array
          items: { type: string }
          description: "Item keys in panel order (left → right); must match StateItem.key of this section's items"

    SwitchLayout:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SwitchPortGroup'
          description: "Bands top → bottom. Items not referenced by any band are appended after all bands."

    StateSection:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        kind:
          type: string
          enum: [table, switch]
          default: table
          description: "Rendering hint — 'switch' renders a virtual switch face with per-port selection for bulk actions"
        layout:
          $ref: '#/components/schemas/SwitchLayout'
        items:
          type: array
          items:
            $ref: '#/components/schemas/StateItem'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/StateActionRef'

    DeviceStateResponse:
      type: object
      required: [collectedAt, sections]
      properties:
        collectedAt: { type: string, format: date-time }
        sections:
          type: array
          items:
            $ref: '#/components/schemas/StateSection'

    DeviceState:
      type: object
      required: [deviceId, pluginId, state]
      properties:
        deviceId: { type: string }
        pluginId: { type: string }
        state:
          $ref: '#/components/schemas/DeviceStateResponse'

    # Live probe snapshot (capability 'probe') — the metrics map is free-form
    # and plugin-owned; the broker never interprets its content.
    DeviceProbeResult:
      type: object
      required: [collectedAt, metrics]
      properties:
        collectedAt: { type: string, format: date-time }
        metrics:
          type: object
          additionalProperties: true

    FilesystemRequest:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [list, read, stat, write, mkdir, rmdir, unlink, rename]
          description: "The file operation to perform"
        path: { type: string, description: "Path within the scoped root (relative). For rename this is the SOURCE. Empty/absent = the root itself." }
        targetPath: { type: string, description: "Destination path for rename" }
        contentBase64: { type: string, description: "File contents for write, base64-encoded (binary-safe)" }
        parents: { type: boolean, description: "For mkdir: create intermediate directories as needed" }
        pluginId: { type: string, description: "Assigned plugin to use (default = primary assignment)" }
        secretId:
          type: string
          description: >-
            The user's chosen file-access credential (from the session-credential picker).
            Absent = auto-use (stored default / sole eligible candidate); several candidates
            with no valid default answer 409 `credential_selection_required`.
        context:
          type: object
          additionalProperties: true
          description: >-
            Plugin-owned context naming what to browse — e.g. `{ kind: 'dataset', name }`
            or `{ kind: 'container-volume', source, target? }`. The plugin maps it onto an
            SFTP root and confines every path to it.

    FilesystemEntry:
      type: object
      required: [name, isDirectory]
      properties:
        name: { type: string }
        isDirectory: { type: boolean }
        sizeBytes: { type: integer, nullable: true }
        mtimeMs: { type: integer, nullable: true }

    FilesystemResult:
      type: object
      required: [collectedAt]
      properties:
        collectedAt: { type: string, format: date-time }
        path: { type: string, description: "Absolute path operated on (after root resolution)" }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FilesystemEntry'
        contentBase64: { type: string, description: "File contents for read, base64-encoded" }
        sizeBytes: { type: integer, nullable: true }
        mtimeMs: { type: integer, nullable: true }
        isDirectory: { type: boolean }

    FilesystemResponse:
      type: object
      required: [deviceId, pluginId, result]
      properties:
        deviceId: { type: string }
        pluginId: { type: string }
        result:
          $ref: '#/components/schemas/FilesystemResult'

    ConsoleTicketRequest:
      type: object
      properties:
        pluginId: { type: string, description: "Assigned plugin to console (default = primary assignment)" }
        secretId:
          type: string
          description: >-
            The user's chosen SSH credential (from the session-credential picker).
            Absent = auto-use (stored default / sole eligible candidate); several candidates
            with no valid default answer 409 `credential_selection_required`.
        context:
          type: object
          additionalProperties: true
          description: >-
            Plugin-owned context naming what to attach to — e.g. `{ kind: 'host' }`
            for a login shell or `{ kind: 'container', name?, service? }` for an exec
            into a container (the plugin resolves the docker name + entrypoint).

    # --- Session credentials (interactive SSH console / SFTP file access) ------
    SessionCredentialCandidate:
      type: object
      required: [id, own]
      properties:
        id: { type: string }
        label: { type: string, nullable: true }
        type: { type: string, description: "usernamePassword | sshKeyPair" }
        own: { type: boolean, description: "True when this is the caller's own secret (vs. from the shared pool)" }

    SessionCredentialOptions:
      type: object
      required: [purpose, candidates, defaultSecretId]
      properties:
        purpose: { type: string, enum: [console, filesystem] }
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/SessionCredentialCandidate'
          description: "Eligible secrets ordered by the stored preference (valid entries first)"
        defaultSecretId:
          type: string
          nullable: true
          description: "The secret auto-used without prompting; null = the client must show its picker"

    SessionCredentialPreferenceRequest:
      type: object
      required: [purpose, secretIds]
      properties:
        purpose: { type: string, enum: [console, filesystem] }
        secretIds:
          type: array
          items: { type: string }
          description: "Ordered preference — first = auto-used default, rest = alternatives"

    ConsoleTicketResponse:
      type: object
      required: [deviceId, ticket]
      properties:
        deviceId: { type: string }
        ticket:
          type: string
          description: "Single-use, 60 s console ticket — pass it as ?ticket= on the console WebSocket endpoint"

    DeviceProbe:
      type: object
      required: [deviceId, pluginId, probe]
      properties:
        deviceId: { type: string }
        pluginId: { type: string }
        probe:
          $ref: '#/components/schemas/DeviceProbeResult'

    DevicePortRow:
      type: object
      required: [pluginId, name, status]
      properties:
        pluginId: { type: string }
        name: { type: string }
        status: { type: string, description: "up | down | enabled | disabled | unknown" }
        speed: { type: string, nullable: true }
        duplex: { type: string, nullable: true }
        vlanId: { type: integer, nullable: true }
        poe: { type: string, nullable: true }
        extra:
          type: object
          additionalProperties: true
        collectedAt: { type: string, format: date-time }

    DevicePorts:
      type: object
      required: [deviceId, ports]
      properties:
        deviceId: { type: string }
        ports:
          type: array
          items:
            $ref: '#/components/schemas/DevicePortRow'

    ConfigJobRequest:
      type: object
      required: [pluginId, action, payload]
      properties:
        # Which assigned plugin applies the change (a device can have several).
        pluginId: { type: string }
        action:
          type: string
          enum: [applyConfig, rollbackConfig, syncState]
        payload:
          type: object
          additionalProperties: true

    ConfigJob:
      type: object
      required: [id, deviceId, action, status, createdAt]
      properties:
        id: { type: string }
        deviceId: { type: string }
        pluginId: { type: string, description: "The assignment that executes this job" }
        action:
          type: string
          enum: [applyConfig, rollbackConfig, syncState]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        result:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    # --- Execution plans -----------------------------------------------------

    PlanCreateRequest:
      type: object
      required: [pluginId, intentActionId, devices]
      properties:
        pluginId: { type: string, description: "Plugin whose action catalog provides the intent" }
        intentActionId: { type: string, description: "Catalog entry id (e.g. wireguard.tunnel.create)" }
        inputs:
          type: object
          additionalProperties: true
          description: "Intent input values, validated against the catalog entry's inputSchema by the plugin"
        devices:
          type: array
          minItems: 1
          items:
            type: object
            required: [deviceId]
            properties:
              deviceId: { type: string }

    PlanStepCreateRequest:
      type: object
      required: [deviceId, actionId]
      properties:
        deviceId: { type: string }
        actionId: { type: string, description: "Single-device catalog entry id" }
        input:
          type: object
          additionalProperties: true
        secretRefs:
          type: array
          items: { type: string }
          description: "ProvisionRequest refs whose decrypted fields merge into this step's credentials"
        bestEffort: { type: boolean, default: false }

    PlanStepUpdateRequest:
      type: object
      properties:
        actionId: { type: string, description: "Single-device catalog entry id" }
        input:
          type: object
          additionalProperties: true
        secretRefs:
          type: array
          items: { type: string }
        dependsOn:
          type: array
          items: { type: integer }
          description: "stepIndex values that must succeed first (cycles rejected)"
        bestEffort: { type: boolean }

    PlanScheduleRequest:
      type: object
      description: >-
        Exactly one of `at` (absolute date-time) or `inMinutes` (relative, >= 1)
        must be provided. `policy` defaults to 'run-asap'.
      properties:
        at: { type: string, format: date-time, description: "Absolute due instant" }
        inMinutes: { type: number, minimum: 1, maximum: 525600, description: "Relative due time (minutes from now)" }
        policy:
          type: string
          enum: [run-asap, skip]
          default: run-asap
          description: >-
            Behavior when the plugin is unreachable at the due instant — 'run-asap'
            retries with backoff until it succeeds; 'skip' marks the plan skipped.

    PlanProvisionedSecret:
      type: object
      required: [ref, secretId]
      properties:
        ref: { type: string, description: "The provisionRequest ref (e.g. keyA)" }
        secretId: { type: string }
        label: { type: string, nullable: true }
        type: { type: string, description: "Secret type (e.g. wireguardKeyPair)" }

    PlanStep:
      type: object
      required: [id, planId, stepIndex, deviceId, actionId, input, status]
      properties:
        id: { type: string }
        planId: { type: string }
        stepIndex: { type: integer, description: "Final ordering; doubles as topological order" }
        deviceId: { type: string }
        actionId: { type: string }
        input:
          type: object
          additionalProperties: true
          description: "May contain ${steps[N].result.details.<key>} tokens resolved at execution time"
        dependsOn:
          type: array
          items: { type: integer }
          description: "stepIndex values that must succeed first"
        secretRefs:
          type: array
          items: { type: string }
        bestEffort:
          type: boolean
          description: "True for steps whose failure does not abort the plan (e.g. snapshot.create)"
        status:
          type: string
          enum: [pending, running, succeeded, failed, skipped]
        result:
          type: object
          nullable: true
          additionalProperties: true
          description: "The plugin's ActionResult ({ success, applied?, verified?, details?, error? })"
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    Plan:
      type: object
      required: [id, pluginId, intentActionId, status, provisionedSecrets, createdAt]
      properties:
        id: { type: string }
        pluginId: { type: string }
        intentActionId: { type: string }
        intentInputs:
          type: object
          additionalProperties: true
          description: "The raw intent inputs as submitted — the payload of every execution (re-runs and retries carry the same values)"
        status:
          type: string
          enum: [draft, ready, scheduled, executing, succeeded, unverified, failed, cancelled, skipped]
          description: >-
            'unverified' = every step applied without error but at least one
            non-best-effort write step could not be confirmed against device
            state (the plugin did not report ActionResult.verified=true).
        provisionedSecrets:
          type: array
          items:
            $ref: '#/components/schemas/PlanProvisionedSecret'
        error: { type: string, nullable: true }
        createdBy: { type: string }
        createdByName: { type: string, description: "Display name of the creator (falls back to the raw user id)" }
        executedBy:
          type: string
          nullable: true
          description: "User who started the current execution (null until executed; may differ from createdBy)"
        executedByName:
          type: string
          nullable: true
          description: "Display name of the executor (null until executed)"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: "When the current execution actually started (set by the executor); null while queued"
        finishedAt: { type: string, format: date-time, nullable: true }
        retriedFrom:
          type: string
          nullable: true
          description: "Set on plans created via retry — id of the duplicated plan"
        recentlyFinishedAt:
          type: string
          format: date-time
          nullable: true
          description: "Last time the plan reached a terminal status (cleared on re-execution); drives the top-bar plans icon tick"
        scheduledAt:
          type: string
          format: date-time
          nullable: true
          description: "Due instant of the current schedule (null when not scheduled)"
        schedulePolicy:
          type: string
          enum: [run-asap, skip]
          nullable: true
          description: >-
            What happens when a due execution cannot reach its plugin — 'run-asap'
            retries with backoff until it succeeds, 'skip' marks the plan skipped.
        stepCount: { type: integer, description: "Present on list responses" }
        stepsDone: { type: integer, description: "Present on list responses" }

    PlanDetail:
      allOf:
        - $ref: '#/components/schemas/Plan'
        - type: object
          properties:
            steps:
              type: array
              items:
                $ref: '#/components/schemas/PlanStep'

    # A single entry of a plugin's action catalog (from /discover `actions`).
    CatalogEntry:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        module: { type: string, description: "Grouping for display (e.g. WireGuard)" }
        riskLevel:
          type: string
          enum: [read, write, dangerous]
        deviceCount:
          oneOf:
            - type: integer
              description: "Exact number of devices the intent spans"
            - type: string
              enum: ['N']
              description: "Any number of devices (fan-out)"
        beOnly: { type: boolean, description: "Only executable on Business Edition appliances" }
        timeoutMs: { type: integer, description: "Per-action dispatch timeout override" }
        inputSchema:
          $ref: '#/components/schemas/InputSchema'

    # The JSON-Schema subset a plugin declares for an action's inputs.
    InputSchemaProperty:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [string, number, boolean, array, object]
        label: { type: string }
        description: { type: string }
        required: { type: boolean }
        default:
          description: "Default value (type depends on the property's own type)"
        pattern: { type: string, description: "Regex for string values" }
        min: { type: number }
        max: { type: number }
        enum:
          type: array
          items:
            oneOf:
              - type: string
              - type: number
        items:
          $ref: '#/components/schemas/InputSchemaProperty'
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InputSchemaProperty'

    InputSchema:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/InputSchemaProperty'

    MetricDescriptor:
      type: object
      required: [key, label, type, visualization]
      properties:
        key: { type: string, description: "Metric id; matches a key in the telemetry metrics map" }
        label: { type: string }
        unit: { type: string, description: "Unit of measure (%, MB, bps, s, ...) — the raw unit, kept for machine comparison" }
        format:
          type: string
          enum: [bytes, bits, duration, number, text]
          description: "How the webapp should humanize the value (bytes → 1.2 GB, bits → 850 Mbps, duration → 3d 4h, ...). The extensible rendering hint."
        type:
          type: string
          enum: [number, string, boolean, enum]
        visualization:
          type: string
          enum: [gauge, plot, text, table]
        group: { type: string, description: "Optional section grouping" }
        min: { type: number }
        max: { type: number }
        color: { type: string }
        rows:
          type: array
          items: { type: string }
          description: "For 'table': the row keys (e.g. interface names)"
        columns:
          type: array
          items: { type: string }
          description: "For 'table': the column keys (e.g. rx, tx)"
        summary:
          type: boolean
          description: "When true, this is a headline metric the webapp renders inline in the device overview table (not just the detail view)."
        intervalMs:
          type: integer
          description: "How often this metric group should be re-fetched from the appliance (ms). The plugin caches slow data (inventory) and only re-polls when the interval elapses — the extensible refresh-cadence contract."

    # A typed option a plugin declares in /discover. Discriminated union on
    # `type`; adding a new type = add one member + one webapp renderer branch.
    PluginOptionDescriptor:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string, description: "Short internal name; unique per plugin" }
        label: { type: string, description: "Human-readable display name" }
        type:
          type: string
          enum: [string, integer, boolean]
        # No `type` on purpose: the default is string | integer | boolean
        # depending on the option's own type (OpenAPI 3.0 "any" schema).
        default:
          description: "Default value used when the user has not set an override"
        description: { type: string, description: "Longer help text for the option" }
        docsUrl: { type: string, format: uri, description: "Optional URI with more information" }
        # string-type extras
        enumOptions:
          type: array
          items: { type: string }
          description: "Closed set of allowed values — rendered as a combobox in the webapp, rejected server-side otherwise (type=string)"
        pattern: { type: string, description: "Regex the user input must match (type=string)" }
        minLength: { type: integer, description: "Minimum length (type=string)" }
        maxLength: { type: integer, description: "Maximum length (type=string)" }
        # integer-type extras
        min: { type: number, description: "Lower bound (type=integer)" }
        max: { type: number, description: "Upper bound (type=integer)" }

    PluginOptions:
      type: object
      required: [pluginId, options, values, effectiveValues]
      properties:
        pluginId: { type: string }
        options:
          type: array
          items:
            $ref: '#/components/schemas/PluginOptionDescriptor'
        values:
          type: object
          additionalProperties: true
          description: "Stored overrides only (empty when nothing was set)"
        effectiveValues:
          type: object
          additionalProperties: true
          description: "Defaults merged with stored overrides — what the form initializes to"

    Plugin:
      type: object
      required: [id, name, version, vendors, capabilities, endpoint]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        vendors:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items:
            type: string
            enum: [monitoring, configuration, inventory, identityProvider, secretsProvider]
        endpoint: { type: string, format: uri }
        authType:
          type: string
          enum: [none, token, mTLS]
        iconUrl: { type: [string, 'null'], description: "Icon path relative to the plugin root (e.g. /icons/lancom-lx.svg); served via GET /plugins/{id}/icon" }
        deviceModels:
          type: array
          items:
            $ref: '#/components/schemas/DeviceModelEntry'
          description: "Supported device model catalog advertised in /discover; null when the plugin has no catalog (e.g. ICMP)"
        credentialSlots:
          type: array
          items:
            $ref: '#/components/schemas/CredentialSlotDescriptor'
          description: "Additional named credential slots beyond the primary secret (null = none)"
        declaredMetricCount: { type: [integer, 'null'], description: "Number of metric descriptors the plugin declared in /discover (how many metrics it can emit); null when unknown" }

    DeviceModelEntry:
      type: object
      required: [vendor, model]
      properties:
        vendor: { type: string, description: "Vendor this entry applies to (matches one of the plugin's vendors)" }
        model: { type: string, description: "Display name of the hardware model, e.g. LX45" }
        iconPath: { type: [string, 'null'], description: "Optional per-model icon path relative to the plugin root" }
        firmwareVersions:
          type: array
          items: { type: string }
          description: "Optional list of firmware versions for this model (plain strings)"

    PluginCreateRequest:
      type: object
      required: [name, version, vendors, capabilities, endpoint]
      properties:
        name: { type: string }
        version: { type: string }
        vendors:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items:
            type: string
            enum: [monitoring, configuration, inventory, identityProvider, secretsProvider]
        endpoint: { type: string, format: uri }
        authType:
          type: string
          enum: [none, token, mTLS]

    # --- System/HA (Workers page) -------------------------------------------
    WorkerRuntime:
      type: object
      required: [name, leaderKey, isLeader, beatsCompleted]
      properties:
        name: { type: string, description: "Worker role id (telemetry, planExecutor, retention, telemetryRetention, pluginMetrics, discovery, configJob)" }
        leaderKey: { type: integer, description: "Advisory-lock key for this role (-1 = not leader-gated; every replica runs it)" }
        isLeader: { type: boolean, description: "True while THIS instance holds the leadership lock" }
        becameLeaderAt: { type: [string, 'null'], format: date-time, description: "When this instance acquired leadership (null = standby)" }
        beatsCompleted: { type: integer }
        lastBeatStartedAt: { type: [string, 'null'], format: date-time }
        lastBeatFinishedAt: { type: [string, 'null'], format: date-time }
        lastBeatDurationMs: { type: [integer, 'null'] }
        beatErrors: { type: integer }
        lastError: { type: [string, 'null'] }

    TelemetryCycleStats:
      type: object
      required: [cyclesCompleted, cyclesSkippedOverlap]
      properties:
        cyclesCompleted: { type: integer }
        cyclesSkippedOverlap: { type: integer, description: "Beats skipped because the previous cycle was still running (cycle guard)" }
        devicesPolledLastCycle: { type: integer }
        assignmentsPolledLastCycle: { type: integer }
        lastCycleDurationMs: { type: [integer, 'null'] }

    SystemEvent:
      type: object
      required: [id, at, type, message]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        type:
          type: string
          enum: [leadership-acquired, leadership-lost, worker-started, beat-error]
        worker: { type: [string, 'null'] }
        message: { type: string }

    PostgresTableStat:
      type: object
      required: [name, approxRows, totalSizeBytes, totalSizePretty]
      properties:
        name: { type: string }
        approxRows: { type: integer, description: "Approximate live row count (pg_stat_user_tables)" }
        totalSizeBytes: { type: integer }
        totalSizePretty: { type: string, example: "12 MB" }

    PostgresStats:
      type: object
      required: [version, databaseName, maxConnections, connectionsTotal, tables]
      properties:
        version: { type: string, example: "PostgreSQL 16.4 on x86_64-pc-linux-gnu" }
        databaseName: { type: string }
        databaseSizePretty: { type: string, example: "250 MB" }
        maxConnections: { type: integer }
        connectionsTotal: { type: integer }
        connectionsActive: { type: integer }
        connectionsIdle: { type: integer }
        tables:
          type: array
          items:
            $ref: '#/components/schemas/PostgresTableStat'

    SystemStatus:
      type: object
      required: [instance, workers, telemetry, events, postgres]
      properties:
        instance:
          type: object
          properties:
            hostname: { type: string }
            pid: { type: integer }
            uptimeSeconds: { type: integer }
            nodeVersion: { type: string }
        workers:
          type: array
          items:
            $ref: '#/components/schemas/WorkerRuntime'
        telemetry:
          $ref: '#/components/schemas/TelemetryCycleStats'
        events:
          type: array
          items:
            $ref: '#/components/schemas/SystemEvent'
        postgres:
          $ref: '#/components/schemas/PostgresStats'

    SystemSettingsUpdate:
      type: object
      properties:
        telemetryPollIntervalMs: { type: integer, description: "Metrics poll window in ms — how often /monitoring is called per assignment (clamped 5000–3600000)" }
        telemetryInventoryWindowMs: { type: integer, description: "Inventory refresh window in ms — how often the slow/static collection runs (clamped 30000–43200000)" }
        telemetryMaxConcurrency: { type: integer, description: "Max concurrent /monitoring calls in flight (clamped 1–2000)" }
        telemetryJitterPercent: { type: integer, description: "Random spread applied to each rescheduled deadline, percent of the window (clamped 0–90)" }

    SystemSettingsResponse:
      allOf:
        - $ref: '#/components/schemas/SystemSettingsUpdate'
        - type: object
          properties:
            limits:
              type: object
              required: [MIN_POLL_INTERVAL_MS, MAX_POLL_INTERVAL_MS, MIN_INVENTORY_WINDOW_MS, MAX_INVENTORY_WINDOW_MS, MIN_CONCURRENCY, MAX_CONCURRENCY, MIN_JITTER_PERCENT, MAX_JITTER_PERCENT]
              properties:
                MIN_POLL_INTERVAL_MS: { type: integer }
                MAX_POLL_INTERVAL_MS: { type: integer }
                MIN_INVENTORY_WINDOW_MS: { type: integer }
                MAX_INVENTORY_WINDOW_MS: { type: integer }
                MIN_CONCURRENCY: { type: integer }
                MAX_CONCURRENCY: { type: integer }
                MIN_JITTER_PERCENT: { type: integer }
                MAX_JITTER_PERCENT: { type: integer }

    SettingView:
      type: object
      required: [key, label, type, category, help, value, defaultValue, isModified]
      properties:
        key: { type: string, description: "Stable settings key (system_settings.key)" }
        label: { type: string, description: "Human-friendly display name" }
        type: { type: string, enum: [integer, string, boolean] }
        category: { type: string, description: "Grouping for the Settings table (e.g. Retention, Security)" }
        help: { type: string, description: "Help text describing the setting" }
        unit: { type: string, nullable: true, description: "Display unit hint (ms, s, days, %)" }
        value: { description: "Effective value (stored override ⊕ env default), already clamped", oneOf: [{ type: integer }, { type: string }, { type: boolean }] }
        defaultValue: { description: "Baseline the setting reverts to on reset", oneOf: [{ type: integer }, { type: string }, { type: boolean }] }
        isModified: { type: boolean, description: "True when a stored override differs from the baseline" }
        min: { type: integer, nullable: true }
        max: { type: integer, nullable: true }
        pattern: { type: string, nullable: true }

    SettingsListResponse:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/SettingView'

    SettingUpdateRequest:
      type: object
      required: [value]
      properties:
        value: { description: "The new setting value (integer, string or boolean)", oneOf: [{ type: integer }, { type: string }, { type: boolean }] }

    SettingResponse:
      type: object
      required: [setting]
      properties:
        setting:
          $ref: '#/components/schemas/SettingView'
