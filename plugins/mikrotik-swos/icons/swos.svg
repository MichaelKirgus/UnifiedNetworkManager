<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- MikroTik SwOS plugin icon: dark switch chassis with red accent (MikroTik brand) -->
  <rect x="4" y="18" width="56" height="28" rx="5" fill="#0f172a"/>
  <rect x="4" y="18" width="56" height="28" rx="5" fill="none" stroke="#334155" stroke-width="1.5"/>
  <!-- port slots -->
  <g fill="#1e293b" stroke="#475569" stroke-width="0.75">
    <rect x="10" y="26" width="8" height="12" rx="1.5"/>
    <rect x="21" y="26" width="8" height="12" rx="1.5"/>
    <rect x="32" y="26" width="8" height="12" rx="1.5"/>
  </g>
  <!-- SFP slots -->
  <g fill="#0b1220" stroke="#475569" stroke-width="0.75">
    <rect x="43" y="26" width="11" height="5" rx="1"/>
    <rect x="43" y="33" width="11" height="5" rx="1"/>
  </g>
  <!-- status LEDs -->
  <circle cx="14" cy="22.5" r="1.6" fill="#22c55e"/>
  <circle cx="25" cy="22.5" r="1.6" fill="#22c55e"/>
  <circle cx="36" cy="22.5" r="1.6" fill="#f59e0b"/>
  <!-- MikroTik red accent bar -->
  <rect x="4" y="48" width="56" height="4" rx="2" fill="#d93a2f"/>
</svg>
