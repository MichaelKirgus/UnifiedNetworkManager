<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- CCR rackmount router — house style: 1U chassis with SFP cage row + LEDs. -->
  <rect x="2" y="22" width="60" height="20" rx="3" fill="#1e1b4b"/>
  <rect x="2" y="22" width="60" height="20" rx="3" fill="none" stroke="#818cf8" stroke-width="2"/>
  <!-- rack ears -->
  <circle cx="7" cy="27" r="1.5" fill="#a5b4fc"/>
  <circle cx="7" cy="37" r="1.5" fill="#a5b4fc"/>
  <circle cx="57" cy="27" r="1.5" fill="#a5b4fc"/>
  <circle cx="57" cy="37" r="1.5" fill="#a5b4fc"/>
  <!-- SFP cages -->
  <g fill="#c7d2fe">
    <rect x="13" y="28" width="6" height="8" rx="1"/>
    <rect x="21" y="28" width="6" height="8" rx="1"/>
    <rect x="29" y="28" width="6" height="8" rx="1"/>
    <rect x="37" y="28" width="6" height="8" rx="1"/>
  </g>
  <!-- status LEDs -->
  <circle cx="50" cy="30" r="2.5" fill="#34d399"/>
  <circle cx="50" cy="37" r="2.5" fill="#fbbf24"/>
</svg>
