<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- hEX / RB desktop router — house style: flat box with port row + antenna hint. -->
  <rect x="8" y="26" width="48" height="18" rx="4" fill="#312e81"/>
  <rect x="8" y="26" width="48" height="18" rx="4" fill="none" stroke="#6366f1" stroke-width="2"/>
  <!-- port row -->
  <g fill="#c7d2fe">
    <rect x="14" y="32" width="5" height="7" rx="1"/>
    <rect x="21" y="32" width="5" height="7" rx="1"/>
    <rect x="28" y="32" width="5" height="7" rx="1"/>
    <rect x="35" y="32" width="5" height="7" rx="1"/>
  </g>
  <!-- status LED -->
  <circle cx="49" cy="35" r="3" fill="#34d399"/>
  <!-- antenna hint (many hEX units ship with one) -->
  <line x1="52" y1="26" x2="58" y2="12" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round"/>
</svg>
