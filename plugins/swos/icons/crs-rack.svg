<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- CRS rack switch: 1U chassis with SFP/QSFP slots -->
  <rect x="3" y="20" width="58" height="24" rx="3" fill="#0f172a"/>
  <rect x="3" y="20" width="58" height="24" rx="3" fill="none" stroke="#334155" stroke-width="1.5"/>
  <!-- rack ears -->
  <g fill="#1e293b" stroke="#475569" stroke-width="0.75">
    <rect x="5" y="23" width="3" height="18" rx="1"/>
    <rect x="56" y="23" width="3" height="18" rx="1"/>
  </g>
  <!-- RJ45 port block -->
  <g fill="#0b1220" stroke="#475569" stroke-width="0.6">
    <rect x="11" y="26" width="6" height="8" rx="1"/>
    <rect x="19" y="26" width="6" height="8" rx="1"/>
    <rect x="27" y="26" width="6" height="8" rx="1"/>
    <rect x="35" y="26" width="6" height="8" rx="1"/>
  </g>
  <!-- SFP/QSFP slots -->
  <g fill="#0b1220" stroke="#475569" stroke-width="0.6">
    <rect x="44" y="26" width="10" height="3.5" rx="0.8"/>
    <rect x="44" y="31" width="10" height="3.5" rx="0.8"/>
  </g>
  <!-- LEDs -->
  <circle cx="14" cy="23.5" r="1.3" fill="#22c55e"/>
  <circle cx="22" cy="23.5" r="1.3" fill="#22c55e"/>
  <circle cx="30" cy="23.5" r="1.3" fill="#f59e0b"/>
  <!-- red accent -->
  <rect x="3" y="47" width="58" height="3.5" rx="1.75" fill="#d93a2f"/>
</svg>
