    image: ${UNM_REGISTRY:-ghcr.io/michaelkirgus/unifiednetworkmanager}/web-fetch-plugin:${UNM_IMAGE_TAG:-dev}
  mcp:
    environment:
      - MCP_PORT=3901
      - UNM_API_BASE=http://api:3000/v1
      - UNM_TLS=${UNM_TLS:-}
      - UNM_API_TLS_BASE=https://api:8443/v1
      - UNM_API_TOKEN=${UNM_API_TOKEN:-}
      - MCP_DEBUG_KEY=${MCP_DEBUG_KEY:-dev-mcp-debug-key}
      - MCP_KEY=${MCP_KEY:-}
      - DATABASE_URL=postgresql://unm:unm@postgres:5432/unm
    volumes:
      - ${UNM_CA_CONFIG_VOLUME:-unm-ca-cfg}:/data/ca:ro
      - ${UNM_MCP_TLS_VOLUME:-unm-mcp-tls}:/data/tls
    healthcheck:
      test:
        - CMD-SHELL
        - node -e 'require("http").get({host:"127.0.0.1",port:3901,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - api
    restart: unless-stopped
    image: ${UNM_REGISTRY:-ghcr.io/michaelkirgus/unifiednetworkmanager}/mcp:${UNM_IMAGE_TAG:-dev}
  mock-appliance:
    profiles:
      - test
    image: node:20-alpine
    network_mode: host
    entrypoint:
      - node
      - /mock/mock.js
    volumes:
      - ./packages/plugin-test-kit/src/fixtures/opnsenseAppliance.cjs:/mock/mock.js:ro
      - ./packages/plugin-test-kit/src/fixtures/tls:/mock/tls:ro
    healthcheck:
      test:
        - CMD-SHELL
        - node -e 'require("http").get({host:"127.0.0.1",port:80,path:"/__requests"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: no
  basic-auth-plugin:
    ports:
      - 4002:4080
    environment:
      - PORT=4080
      - ADVERTISED_ENDPOINT=http://basic-auth-plugin:4080
      - UNM_API_URL=http://api:3000/v1
      - UNM_TLS=${UNM_TLS:-}
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:8080}
    healthcheck:
      test:
        - CMD-SHELL
        - node -e 'require("http").get({host:"127.0.0.1",port:4081,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - api
    restart: unless-stopped
    image: ${UNM_REGISTRY:-ghcr.io/michaelkirgus/unifiednetworkmanager}/basic-auth-plugin:${UNM_IMAGE_TAG:-dev}
  secrets-provider-plugin:
    ports:
      - 4003:4080
    environment:
      - PORT=4080
      - ADVERTISED_ENDPOINT=http://secrets-provider-plugin:4080
      - UNM_API_URL=http://api:3000/v1
      - UNM_TLS=${UNM_TLS:-}
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      - MASTER_KEY=${MASTER_KEY:-default-master-key-must-be-changed-in-production}
      - CRYPTO_SALT=${CRYPTO_SALT:-salt}
    healthcheck:
      test:
        - CMD-SHELL
        - node -e 'require("http").get({host:"127.0.0.1",port:4081,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - api
    restart: unless-stopped
    image: ${UNM_REGISTRY:-ghcr.io/michaelkirgus/unifiednetworkmanager}/secrets-provider-plugin:${UNM_IMAGE_TAG:-dev}
  webapp:
    ports:
      - ${UNM_WEB_PORT:-8080}:5173
    healthcheck:
      test:
        - CMD-SHELL
        - node -e 'require("http").get({host:"127.0.0.1",port:5173,path:"/manifest.json"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - api
    restart: unless-stopped
    image: ${UNM_REGISTRY:-ghcr.io/michaelkirgus/unifiednetworkmanager}/webapp:${UNM_IMAGE_TAG:-dev}
volumes:
  pgdata: null
  unm-ca-pki: null
  unm-api-tls: null
  unm-ca-cfg: null
  unm-mcp-tls: null
  unm-backups: null
  filerepo: null
  filerepo-plugin: null
