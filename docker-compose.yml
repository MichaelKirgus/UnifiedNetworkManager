# UNM — standard deployment compose (END USERS: no local build required).
#
# Generated from docker-compose.dev.yml by scripts/generate-registry-compose.cjs —
# do not edit by hand; change the dev compose and regenerate. Every service that
# is built locally in the dev compose is pulled here as a GHCR image instead
# (same service names, env vars and volumes).
#
#   docker compose up -d
#
# Overrides (.env or environment):
#   UNM_REGISTRY    registry prefix  (default ghcr.io/michaelkirgus/unifiednetworkmanager)
#   UNM_IMAGE_TAG   image tag        (default dev; use a release tag like v0.1.0)
#   UNM_WEB_PORT    webapp host port (default 8080)
#
# The MCP server is NOT published to the host by default — it carries an API
# token with full agent capabilities, so exposing it on all interfaces is a
# deliberate choice. If you need remote MCP access, add your own mapping in .env
# or a reverse proxy (with auth), e.g. UNM_MCP_PORT=8081.

version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unm}
      POSTGRES_DB: ${POSTGRES_DB:-unm}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-unm} -d ${POSTGRES_DB:-unm}
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
  unm-ca:
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${UNM_CA_PKI_VOLUME:-unm-ca-pki}:/pki
      - ${UNM_CA_CONFIG_VOLUME:-unm-ca-cfg}:/data/ca
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - step ca health --ca-url https://unm-ca:9000 --root /data/ca/root_ca.crt | grep '^ok' >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
    image: ${UNM_REGISTRY:-ghcr.io/michaelkirgus/unifiednetworkmanager}/unm-ca:${UNM_IMAGE_TAG:-dev}
  api:
    ports:
      - 3000:3000
    environment:
      - PORT=3000
      - JWT_SECRET=dev-secret
      - DATABASE_URL=postgresql://unm:unm@postgres:5432/unm
      - AUTH_PLUGIN_ID=${AUTH_PLUGIN_ID:-00000000-0000-4000-8000-000000000001}
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:8080}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - FILE_REPO_PLUGIN_ID=${FILE_REPO_PLUGIN_ID:-00000000-0000-4000-8000-000000000011}
      - FILE_REPO_PATH=${FILE_REPO_PATH:-/data/file-repo}
      - BACKUP_PATH=${BACKUP_PATH:-/data/backups}
      - SECRETS_PLUGIN_ID=${SECRETS_PLUGIN_ID:-00000000-0000-4000-8000-000000000002}
      - PLUGIN_POLL_ENDPOINTS=${PLUGIN_POLL_ENDPOINTS:-}
      - UNM_TLS=${UNM_TLS:-}
      - MCP_DEBUG_KEY=${MCP_DEBUG_KEY:-dev-mcp-debug-key}
      - UNM_MCP_URL=http://mcp:3901
    volumes:
      - ${UNM_BACKUP_VOLUME:-unm-backups}:/data/backups
      - filerepo:/data/file-repo
      - ${UNM_CA_CONFIG_VOLUME:-unm-ca-cfg}:/data/ca
      - ${UNM_API_TLS_VOLUME:-unm-api-tls}:/data/tls
    healthcheck:
      test:
        - CMD-SHELL
        - node -e 'require("http").get({host:"127.0.0.1",port:3000,path:"/healthz"},function(r){process.exit(r.statusCode===200?0:1)}).on("error",function(){process.exit(1)})'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - postgres
      - unm-ca
    restart: unless-stopped
    image: ${UNM_REGISTRY:-ghcr.io/michaelkirgus/unifiednetworkmanager}/api:${UNM_IMAGE_TAG:-dev}
  file-repo-plugin:
    ports:
      - 4020:4080
    environment:
      - PORT=4080
      - ADVERTISED_ENDPOINT=http://file-repo-plugin:4080
      - UNM_API_URL=http://api:3000/v1
      - UNM_TLS=${UNM_TLS:-}
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      - FILE_REPO_PATH=/data/file-repo
    volumes:
