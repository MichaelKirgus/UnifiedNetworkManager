version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unm}
      POSTGRES_DB: ${POSTGRES_DB:-unm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=dev-secret
      - DATABASE_URL=postgresql://unm:unm@postgres:5432/unm
      # Identity provider selection (the API is a pure auth broker).
      # AUTH_PLUGIN_ID names the active identity provider plugin; if unset or
      # offline the API falls back to the built-in basic-auth plugin.
      - AUTH_PLUGIN_ID=${AUTH_PLUGIN_ID:-00000000-0000-4000-8000-000000000001}
      # Shared key the API presents to plugins (x-plugin-api-key).
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      # How many days of plugin log entries are kept before the retention sweep deletes them.
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      # Secrets provider selection (the API is a pure secrets broker).
      # SECRETS_PLUGIN_ID names the active secrets provider plugin; if unset or
      # offline the API falls back to the built-in secrets-provider plugin.
      - SECRETS_PLUGIN_ID=${SECRETS_PLUGIN_ID:-00000000-0000-4000-8000-000000000002}
      # Poll these plugin endpoints for discovery (mDNS is often isolated on
      # Docker bridge networks). Ensures the provider plugins are registered.
      # All plugins listen on the conventional internal port 4080 (see
      # docs/PLUGIN-DEVELOPMENT.md); compose maps distinct HOST ports to it.
      - PLUGIN_POLL_ENDPOINTS=${PLUGIN_POLL_ENDPOINTS:-http://basic-auth-plugin:4080,http://secrets-provider-plugin:4080,http://opnsense-plugin:4080,http://icmp-plugin:4080,http://generic-snmp-plugin:4080,http://lancom-lx-plugin:4080,http://lancom-lcos-plugin:4080,http://swos-plugin:4080,http://lancom-sx-plugin:4080}
    depends_on:
      - postgres
    restart: unless-stopped

  opnsense-plugin:
    # Root context — the image also builds the shared @unm/plugin-sdk package.
    build:
      context: .
      dockerfile: plugins/opnsense/Dockerfile
    ports:
      - "4001:4080"
    # Lets the plugin reach host-network services (e.g. mock-appliance on :80/:443)
    # as http(s)://host.docker.internal — plain Linux Docker has no such name by default.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Conventional internal port for ALL plugins; the host mapping above is
      # only for curl-from-host debugging + setup.sh wait_for_port.
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      # Without this the plugin advertises http://localhost:4080, which is
      # unreachable from the API container.
      - ADVERTISED_ENDPOINT=http://opnsense-plugin:4080
      # Base URL of the API's internal endpoints (plugin -> API) — used for log shipping.
      - UNM_API_URL=http://api:3000/v1
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      - OPNSENSE_HOST=${OPNSENSE_HOST:-https://opnsense.local}
      - OPNSENSE_KEY=${OPNSENSE_KEY:-}
      - OPNSENSE_SECRET=${OPNSENSE_SECRET:-}
    depends_on:
      - api
    restart: unless-stopped

  # ICMP plugin: reachability / latency metrics plus IP+MAC inventory,
  # measured from inside its own container via system ping (ICMP echo). No
  # credentials needed — it probes whatever host the device's settings point at.
  icmp-plugin:
    # Root context — the image also builds the shared @unm/plugin-sdk package.
    build:
      context: .
      dockerfile: plugins/icmp/Dockerfile
    ports:
      - "4004:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://icmp-plugin:4080
      # Base URL of the API's internal endpoints (plugin -> API) — used for log shipping.
      - UNM_API_URL=http://api:3000/v1
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
    depends_on:
      - api
    restart: unless-stopped

  # ── Multi-instance example ────────────────────────────────────────────────
  # Every plugin supports running multiple instances of the same type (e.g. one
  # ICMP plugin per remote site). Each instance needs a unique
  # PLUGIN_INSTANCE_ID and its own ADVERTISED_ENDPOINT; it then registers as a
  # separate plugin ("ICMP Plugin (site-a)") that can be assigned independently.
  # PLUGIN_DISPLAY_NAME optionally overrides the auto-generated name.
  # Also append the endpoint to the api service's PLUGIN_POLL_ENDPOINTS list.
  # icmp-site-a:
  #   build:
  #     context: .
  #     dockerfile: plugins/icmp/Dockerfile
  #   ports:
  #     - "4010:4080"   # next free HOST port — the container port is always 4080
  #   environment:
  #     - PORT=4080
  #     - ADVERTISED_ENDPOINT=http://icmp-site-a:4080
  #     - PLUGIN_INSTANCE_ID=site-a
  #     # - PLUGIN_DISPLAY_NAME=HQ ICMP
  #   restart: unless-stopped

  # Generic SNMP plugin: SNMPv1/v2c monitoring (system group + interface
  # throughput) and inventory over native UDP (@unm/snmp-client). Credentials
  # come from an snmp-type secret assigned per device (community + version).
  # Vendor MIB files can be dropped into ./plugins/generic-snmp/mibs — mounted
  # read-only at /app/mibs for manual debugging only.
  generic-snmp-plugin:
    # Root context — the image also builds the shared @unm/snmp-client package.
    build:
      context: .
      dockerfile: plugins/generic-snmp/Dockerfile
    ports:
      - "4005:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://generic-snmp-plugin:4080
      # Base URL of the API's internal endpoints (plugin -> API) — used for log shipping.
      - UNM_API_URL=http://api:3000/v1
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
    volumes:
      - ./plugins/generic-snmp/mibs:/app/mibs:ro
    depends_on:
      - api
    restart: unless-stopped

  # LANCOM LX plugin: vendor-specific monitoring for LCOS-LX access points via
  # the LCOS-LX-MIB (radios, SSIDs, stations/clients, RF environment, WDS,
  # CAPWAP/LMC) plus network + WLAN-client inventory propagation. Intended to
  # be assigned IN ADDITION TO the generic SNMP plugin on the same devices.
  lancom-lx-plugin:
    # Root context — the image also builds the shared @unm/snmp-client package.
    build:
      context: .
      dockerfile: plugins/lancom-lx/Dockerfile
    ports:
      - "4006:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://lancom-lx-plugin:4080
      # Base URL of the API's internal endpoints (plugin -> API) — used for log shipping.
      - UNM_API_URL=http://api:3000/v1
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
    volumes:
      - ./plugins/lancom-lx/mibs:/app/mibs:ro
    depends_on:
      - api
    restart: unless-stopped
  # LANCOM LCOS router plugin: vendor-specific monitoring for Lancom LCOS
  # routers via the unified LCOS MIB (system/hardware, LAN/WAN throughput,
  # VPN connections, firewall counters, temperature) plus network/ARP/DHCP
  # inventory propagation. Config + plan actions run over SNMP SET against the
  # lcsSetup tree; config backup/restore goes through the router's web UI via
  # a separate username/password credential slot ("web"). Intended to be
  # assigned IN ADDITION TO the generic SNMP plugin on the same devices.
  lancom-lcos-plugin:
    # Root context — the image also builds the shared @unm/snmp-client package.
    build:
      context: .
      dockerfile: plugins/lancom-lcos/Dockerfile
    ports:
      - "4008:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://lancom-lcos-plugin:4080
      # Base URL of the API's internal endpoints (plugin -> API) — used for log shipping.
      - UNM_API_URL=http://api:3000/v1
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
    volumes:
      - ./plugins/lancom-lcos/mibs:/app/mibs:ro
    depends_on:
      - api
    restart: unless-stopped
  # LANCOM SX-Series switch plugin: vendor-specific monitoring for Lancom
  # GS/IGS/XS switches over the LCOS-SX MIBs (system/PSU/fans/temperature,
  # ports + throughput, PoE, LAG/LACP) plus network/host inventory propagation.
  # Supports BOTH firmware lines — the unified 4.x tree (lcosSX, base
  # .1.3.6.1.4.1.2356.14) and the legacy GS-2310 3.x tree (base
  # .1.3.6.1.4.1.2356.800.3.2313) — auto-detected per device. Config + plan
  # actions run over SNMP SET against the port/PoE/LACP/VLAN tables.
  lancom-sx-plugin:
    # Root context — the image also builds the shared @unm/snmp-client package.
    build:
      context: .
      dockerfile: plugins/lancom-sx/Dockerfile
    ports:
      - "4009:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://lancom-sx-plugin:4080
      # Base URL of the API's internal endpoints (plugin -> API) — used for log shipping.
      - UNM_API_URL=http://api:3000/v1
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
    volumes:
      - ./plugins/lancom-sx/mibs:/app/mibs:ro
    depends_on:
      - api
    restart: unless-stopped
  # SwOS plugin: MikroTik SwOS / SwOS Lite switch monitoring (system, ports,
  # PoE, LAG/LACP, VLANs, SFP, SNMP) via the .b-file HTTP API with Digest auth,
  # plus plan/config actions and network/MAC inventory propagation. SwOS only —
  # RouterOS devices get their own plugin later.
  swos-plugin:
    # Root context — the image also builds the shared @unm/plugin-sdk package.
    build:
      context: .
      dockerfile: plugins/swos/Dockerfile
    ports:
      - "4007:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://swos-plugin:4080
      # Base URL of the API's internal endpoints (plugin -> API) — used for log shipping.
      - UNM_API_URL=http://api:3000/v1
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
    depends_on:
      - api
    restart: unless-stopped

  # MCP server for AI agents: exposes the API's OpenAPI operations as MCP tools
  # over Streamable HTTP. Two endpoints:
  #   POST :3901/mcp        — production-safe (OpenAPI tools only; scope the
  #                           UNM_API_TOKEN to control what an agent can do)
  #   POST :3901/debug/mcp  — extended debug: + read-only SQL against Postgres
  #                           and live plugin probes. Requires Authorization:
  #                           Bearer <MCP_DEBUG_KEY>.
  # Create the UNM_API_TOKEN in the webapp (Tokens page) or via POST /v1/tokens.
  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    ports:
      - "3901:3901"
    environment:
      - MCP_PORT=3901
      # Base URL the OpenAPI tools call (container-to-container).
      - UNM_API_BASE=http://api:3000/v1
      # Long-lived API token for the OpenAPI tools — REQUIRED.
      - UNM_API_TOKEN=${UNM_API_TOKEN:-}
      # Bearer key gating /debug/mcp (read-only SQL + plugin probes).
      - MCP_DEBUG_KEY=${MCP_DEBUG_KEY:-dev-mcp-debug-key}
      # Optional: also gate the plain /mcp endpoint with a bearer key.
      - MCP_KEY=${MCP_KEY:-}
      # Same database as the API — used by the debug SQL tool only.
      - DATABASE_URL=postgresql://unm:unm@postgres:5432/unm
      # Endpoints probed by the plugin_probe debug tool (same list as the api).
      - PLUGIN_POLL_ENDPOINTS=${PLUGIN_POLL_ENDPOINTS:-http://basic-auth-plugin:4080,http://secrets-provider-plugin:4080,http://opnsense-plugin:4080,http://icmp-plugin:4080,http://generic-snmp-plugin:4080,http://lancom-lx-plugin:4080,http://lancom-lcos-plugin:4080,http://swos-plugin:4080,http://lancom-sx-plugin:4080}
    depends_on:
      - api
    restart: unless-stopped

  # Mock OPNsense appliance for end-to-end plan-execution tests. Host network
  # so it can bind :80/:443 directly; reachable from the plugin containers as
  # http(s)://host.docker.internal (bare hostname — device managementAddress
  # never carries a scheme/port). Captured requests are served at GET /__requests.
  # Start on demand: `docker compose up -d mock-appliance`.
  mock-appliance:
    image: node:20-alpine
    network_mode: host
    entrypoint: ["node", "/mock/mock.js"]
    volumes:
      - ./scripts/mock-opnsense.cjs:/mock/mock.js:ro
      # Self-signed TLS material generated on the host (openssl req -x509);
      # node:20-alpine has no openssl and apk access is unreliable here.
      - ./scripts/mock-tls:/mock/tls:ro
    restart: "no"
  # Identity provider plugin: local users + TOTP (2FA). Performs credential
  # verification on behalf of the API. It does NOT own a database: the API
  # owns the `users` table and this plugin reads/writes user records through
  # the API's internal user-data endpoints (UNM_API_URL + x-plugin-api-key).
  basic-auth-plugin:
    # Root context — the image also builds the shared @unm/plugin-sdk package.
    build:
      context: .
      dockerfile: plugins/basic-auth/Dockerfile
    ports:
      - "4002:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://basic-auth-plugin:4080
      # Base URL of the API's internal user-data endpoints (plugin -> API).
      - UNM_API_URL=http://api:3000/v1
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
    depends_on:
      - api
    restart: unless-stopped

  # Secrets provider plugin: encrypts/decrypts and manages device secrets.
  # It is the crypto holder (owns MASTER_KEY) and the management logic. It does
  # NOT own a database: the API owns the `secrets` table and this plugin
  # stores/reads ciphertext through the API's internal endpoints
  # (UNM_API_URL + x-plugin-api-key).
  secrets-provider-plugin:
    # Root context — the image also builds the shared @unm/plugin-sdk package.
    build:
      context: .
      dockerfile: plugins/secrets-provider/Dockerfile
    ports:
      - "4003:4080"
    environment:
      - PORT=4080
      # Endpoint the API (in its own container) uses to reach this plugin.
      - ADVERTISED_ENDPOINT=http://secrets-provider-plugin:4080
      # Base URL of the API's internal secrets-data endpoints (plugin -> API).
      - UNM_API_URL=http://api:3000/v1
      - PLUGIN_API_KEY=${PLUGIN_API_KEY:-dev-plugin-key}
      # Crypto key material (the plugin is the crypto holder).
      - MASTER_KEY=${MASTER_KEY:-default-master-key-must-be-changed-in-production}
      - CRYPTO_SALT=${CRYPTO_SALT:-salt}
    depends_on:
      - api
    restart: unless-stopped

  webapp:
    build:
      context: ./webapp
      # VITE_API_URL is compiled into the static bundle at build time (Vite
      # inlines import.meta.env.VITE_* at build, not at container runtime),
      # so it must be passed as a build arg here rather than as a plain
      # `environment:` entry below, which the already-built assets would
      # never see. The value is the URL the *browser* (not the container)
      # uses to reach the API, i.e. the host's published api port.
      args:
        VITE_API_URL: http://localhost:3000/v1
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  # Optional: uncomment to back the job queue with real Redis/BullMQ instead
  # of the in-process fallback queue used by default in api/src/queue.ts.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

volumes:
  pgdata:
